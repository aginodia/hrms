/* =====================================================================
   ESOPs — allocations come from the ESOP Excel; vesting follows the sheet's
   schedule. Status per tranche is worked out here from the dates and the
   employee's exit, following the scheme (summary below — the scheme
   document itself is not stored).
   ===================================================================== */
const ESOP_COLORS = { exercised: '#2a78d6', vested: '#eb6834', unvested: '#1baf7a', returned: '#9CA3AF', available: '#E5E7EB' };
const ESOP_LABEL = { exercised: 'Exercised', vested: 'Vested', unvested: 'Unvested', returned: 'Returned to pool', available: 'Available in pool' };
const ESOP_TRANCHE = { vested: ['Vested', 'amber'], upcoming: ['Upcoming', 'green'], returned: ['Returned to pool', 'gray'], lapsed: ['Lapsed', 'gray'], exercised: ['Exercised', 'blue'] };
const ESOP_SCHEME = [
  ['Plan', ['Altius ESOP 2026 — effective 1 April 2026 for 8 years', 'Pool of 2,000 options; 1 option = 1 equity share of ₹100 face value',
    'Granted at the discretion of the Committee; a grant is accepted within 30 days or it lapses']],
  ['Vesting', ['Minimum 12 months from grant before anything vests (cliff)', 'Standard schedule 25% a year over 4 years — the Committee can set a different one; the allocation sheet\'s schedule is what is shown here',
    'Vesting needs continuous employment and the employee not being on notice on the vesting date']],
  ['Exercise', ['Exercise price is fixed at grant and is never below face value; paid through banking channels',
    'Vested options can be exercised while in service (the allocation sheet sets the exercise period)', 'No shareholder rights until shares are allotted; options cannot be transferred, pledged or sold']],
  ['Leaving the company', ['Resignation or termination (not for misconduct): all unvested options are cancelled from the notice date and go back to the pool',
    'Vested options: exercise within 6 months of the last working day after resignation, 30 days after termination — otherwise they lapse back to the pool',
    'Misconduct: all options, vested and unvested, are cancelled', 'Retirement: vested options stay exercisable; unvested may continue to vest if the Committee approves',
    'Death or permanent incapacity: the Committee may vest everything at once; the nominee or legal heirs exercise', 'Transfer within the group: no change']],
  ['Shares & other terms', ['Shares may carry lock-in, right of first refusal and tag-along / drag-along terms', 'Bonus, split, merger or similar events: options are adjusted fairly; in a merger they may be rolled over, cashed out or cancelled',
    'Buy-back or liquidity only at the Board\'s discretion — no liquidity is guaranteed', 'All taxes on exercise and sale are borne by the employee'],
  ],
];
const addYearsISO = (iso, n) => { const d = parseISODate(iso); d.setFullYear(d.getFullYear() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const addMonthsISO = (iso, n) => { const d = parseISODate(iso); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtNum = (n) => Number(n || 0).toLocaleString('en-IN');

// One employee's position. tranches: [{allocation_id, date, label, options}], exercises: [{date, options}],
// allocations: [{id, allocation_date, exercise_years}], profile: exit fields.
function esopPosition({ tranches = [], exercises = [], allocations = [], profile = {}, today = todayISO() }) {
  const st = profile.employment_status;
  const left = ['resigned', 'terminated'].includes(st) || !!profile.fnf_completed_at;
  // Unvested options are cancelled from the notice date (resignation date; for a termination the last working day).
  const noticeDate = profile.resignation_date || (left ? profile.exit_date : null) || null;
  const leaveDeadline = left && profile.exit_date ? (st === 'terminated' ? addDaysISO(profile.exit_date, 30) : addMonthsISO(profile.exit_date, 6)) : null;
  const allocOf = Object.fromEntries(allocations.map((a) => [a.id, a]));
  const rows = tranches.map((t) => {
    const a = allocOf[t.allocation_id];
    const expiry = a?.exercise_years ? addYearsISO(a.allocation_date, a.exercise_years) : null;
    const deadline = [expiry, leaveDeadline].filter(Boolean).sort()[0] || null;
    const base = { ...t, options: Number(t.options), deadline, exercised: 0, lapsed: 0 };
    if (noticeDate && t.date > noticeDate) return { ...base, status: 'returned' };
    if (t.date <= today) return { ...base, status: 'vested' };
    return { ...base, status: 'upcoming' };
  }).sort((a, b) => a.date.localeCompare(b.date));
  // Exercises use the earliest vested tranches first.
  let pool = exercises.reduce((s, e) => s + Number(e.options), 0);
  for (const r of rows) {
    if (r.status !== 'vested' || pool <= 0) continue;
    r.exercised = Math.min(r.options, pool); pool -= r.exercised;
  }
  for (const r of rows) {
    if (r.status !== 'vested') continue;
    const open = r.options - r.exercised;
    if (open > 0 && r.deadline && today > r.deadline) r.lapsed = open;
    if (r.exercised === r.options) r.status = 'exercised';
    else if (r.lapsed && !r.exercised) r.status = 'lapsed';
  }
  const sum = (f) => rows.reduce((s, r) => s + f(r), 0);
  const granted = sum((r) => r.options);
  const vestedAll = sum((r) => (['vested', 'exercised', 'lapsed'].includes(r.status) ? r.options : 0));
  const exercised = exercises.reduce((s, e) => s + Number(e.options), 0);
  const cancelled = sum((r) => (r.status === 'returned' ? r.options : 0));
  const lapsed = sum((r) => r.lapsed);
  const unvested = sum((r) => (r.status === 'upcoming' ? r.options : 0));
  const exercisable = Math.max(0, vestedAll - exercised - lapsed);
  const next = rows.find((r) => r.status === 'upcoming') || null;
  return { rows, granted, vested: vestedAll, exercised, exercisable, unvested, returned: cancelled + lapsed, cancelled, lapsed, next, noticeDate, leaveDeadline, left };
}

/* ---------- Charts (plain SVG/HTML; hover tooltips via data-tip) ---------- */
function esopLegend(keys, values) {
  return `<div class="ch-legend">${keys.map((k) => `<span><i style="background:${ESOP_COLORS[k]}"></i>${ESOP_LABEL[k]}${values ? ` <b>${fmtNum(values[k])}</b>` : ''}</span>`).join('')}</div>`;
}
// 100% stacked bar with 2px gaps between segments
function esopStackBar(parts, total, { height = 22, labels = true } = {}) {
  const shown = parts.filter((p) => p.value > 0);
  if (!total || !shown.length) return `<div class="ch-stack empty" style="height:${height}px"></div>`;
  return `<div class="ch-stack" style="height:${height}px">${shown.map((p) => {
    const pct = (p.value / total) * 100;
    return `<span style="flex:${p.value} 0 0;background:${ESOP_COLORS[p.key]}" data-tip="${esc(`${ESOP_LABEL[p.key]}: ${fmtNum(p.value)} (${pct.toFixed(1)}%)`)}">${labels && pct >= 7 ? `<em class="${p.key === 'available' ? 'dark' : ''}">${fmtNum(p.value)}</em>` : ''}</span>`;
  }).join('')}</div>`;
}
// Vesting timeline: one column per vesting date, stacked by status; a dashed line marks today.
function esopTimelineChart(rows, { height = 190, today = todayISO(), startDate = null } = {}) {
  const byDate = {};
  for (const r of rows) {
    const k = r.date; const b = byDate[k] || (byDate[k] = { date: k, label: r.label, exercised: 0, vested: 0, unvested: 0, returned: 0 });
    b.exercised += r.exercised || 0;
    b.returned += r.status === 'returned' ? r.options : r.lapsed || 0;
    b.vested += ['vested', 'exercised', 'lapsed'].includes(r.status) ? r.options - (r.exercised || 0) - (r.lapsed || 0) : 0;
    b.unvested += r.status === 'upcoming' ? r.options : 0;
  }
  const cols = Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));
  if (!cols.length) return emptyState('pie', 'No vesting yet', 'Upload the ESOP allocation sheet to see the vesting timeline.');
  const keys = ['exercised', 'vested', 'unvested', 'returned'];
  const max = Math.max(...cols.map((c) => keys.reduce((s, k) => s + c[k], 0)), 1);
  const W = Math.max(320, cols.length * 92 + 60), H = height, top = 22, bottom = 34, left = 36, plotH = H - top - bottom;
  const step = (W - left - 12) / cols.length, bw = Math.min(46, step * 0.5);
  const y = (v) => top + plotH - (v / max) * plotH;
  const ticks = [0, Math.round(max / 2), max];
  let svg = ticks.map((t) => `<line x1="${left}" x2="${W - 8}" y1="${y(t)}" y2="${y(t)}" class="ch-grid"/><text x="${left - 6}" y="${y(t) + 4}" class="ch-axis" text-anchor="end">${fmtNum(t)}</text>`).join('');
  cols.forEach((c, i) => {
    const cx = left + step * i + step / 2; let acc = 0;
    const total = keys.reduce((s, k) => s + c[k], 0);
    const segs = keys.filter((k) => c[k] > 0);
    segs.forEach((k, j) => {
      const y1 = y(acc + c[k]), y0 = y(acc); acc += c[k];
      const h = Math.max(1, y0 - y1 - (j < segs.length - 1 ? 2 : 0));
      const isTop = j === segs.length - 1;
      svg += `<path d="${isTop ? roundTopRect(cx - bw / 2, y1, bw, h, Math.min(4, h)) : `M${cx - bw / 2},${y1 + (y0 - y1 - h)}h${bw}v${h}h${-bw}z`}" fill="${ESOP_COLORS[k]}" data-tip="${esc(`${c.label || fmtDMY(c.date)} · ${ESOP_LABEL[k]}: ${fmtNum(c[k])}`)}"/>`;
    });
    svg += `<text x="${cx}" y="${y(total) - 6}" class="ch-val" text-anchor="middle">${fmtNum(total)}</text>`;
    svg += `<text x="${cx}" y="${H - bottom + 15}" class="ch-axis" text-anchor="middle">${esc(c.label || fmtDMY(c.date).slice(3))}</text>`;
    svg += `<text x="${cx}" y="${H - bottom + 28}" class="ch-axis faint" text-anchor="middle">${fmtDMY(c.date)}</text>`;
  });
  // today marker, placed between the columns it falls between
  if (today) {
    const idx = cols.findIndex((c) => c.date > today);
    const tx = idx === -1 ? W - 10 : idx === 0 ? left + 4 : left + step * idx;

// Stages: allocation → cliff → each vesting date → end of the exercise period
function esopStagesHTML(allocations, rows, pos) {

/* ---------- Admin data ---------- */
async function loadEsopAdmin() {
  await ensureAdmin();
  const [allocations, grants, vesting, exercises, setting] = await Promise.all([
    q(db.from('esop_allocations').select('*').is('removed_at', null).order('allocation_date')),
    fetchAll(() => db.from('esop_grants').select('*').order('member_name')),
    fetchAll(() => db.from('esop_vesting').select('*').order('vest_date')),
    q(db.from('esop_exercises').select('*').is('removed_at', null).order('exercise_date')),
    q(db.from('app_settings').select('value').eq('key', 'esop').maybeSingle()),
  ]);
  const live = new Set((allocations || []).map((a) => a.id));
  const E = { allocations: allocations || [], grants: (grants || []).filter((g) => live.has(g.allocation_id)), vesting: (vesting || []).filter((v) => live.has(v.allocation_id)),
    exercises: exercises || [], pool: Number(setting?.value?.pool || 2000) };
  // One holder per employee (or per unmapped sheet name)
  const holders = {};
  const keyOf = (r) => r.employee_id || `name:${r.member_name.trim().toLowerCase()}`;
  const holder = (r) => holders[keyOf(r)] || (holders[keyOf(r)] = { key: keyOf(r), employee_id: r.employee_id, names: new Set(), grants: [], tranches: [], exercises: [] });
  for (const g of E.grants) { const h = holder(g); h.names.add(g.member_name.trim()); h.grants.push(g); }
  for (const v of E.vesting) { const h = holder(v); h.names.add(v.member_name.trim()); h.tranches.push({ allocation_id: v.allocation_id, date: v.vest_date, label: v.label, options: v.options }); }
  for (const x of E.exercises) { const h = holders[x.employee_id] || (holders[x.employee_id] = { key: x.employee_id, employee_id: x.employee_id, names: new Set(), grants: [], tranches: [], exercises: [] }); h.exercises.push({ ...x, date: x.exercise_date }); }
  E.holders = Object.values(holders).map((h) => {
    const emp = h.employee_id ? byId(h.employee_id) : null;
    const pos = esopPosition({ tranches: h.tranches, exercises: h.exercises, allocations: E.allocations, profile: emp || {} });
    return { ...h, emp, name: emp?.full_name || [...h.names][0] || '—', pos, grantedSheet: h.grants.reduce((s, g) => s + g.options, 0) };
  }).sort((a, b) => b.pos.granted - a.pos.granted || a.name.localeCompare(b.name));
  const tot = (f) => E.holders.reduce((s, h) => s + f(h.pos), 0);
  E.totals = { granted: tot((p) => p.granted), vested: tot((p) => p.vested), exercised: tot((p) => p.exercised), exercisable: tot((p) => p.exercisable),
    unvested: tot((p) => p.unvested), returned: tot((p) => p.returned) };
  E.totals.outstanding = E.totals.granted - E.totals.returned;
  E.totals.available = Math.max(0, E.pool - E.totals.outstanding);
  E.types = {};
  for (const g of E.grants) E.types[g.grant_type] = (E.types[g.grant_type] || 0) + g.options;
  state.esop = E;
  return E;
}

/* ---------- Excel parsing ---------- */
const MONTHS3 = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
function esopLabelToDate(v) {
  if (v instanceof Date) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
  if (typeof v === 'number' && v > 20000) { const d = new Date(Math.round((v - 25569) * 86400000)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  const m = String(v ?? '').trim().match(/^([A-Za-z]{3})[a-z]*[\s'’\-]*(\d{2}|\d{4})$/);
  if (!m) return null;
  const mi = MONTHS3.indexOf(m[1].toLowerCase()); if (mi < 0) return null;
  const y = m[2].length === 2 ? 2000 + Number(m[2]) : Number(m[2]);
  return `${y}-${pad(mi + 1)}-${pad(new Date(y, mi + 1, 0).getDate())}`; // end of that month
}
function esopGrantType(h) {
  const s = String(h).toLowerCase();
  if (s.includes('perform')) return 'Performance';
  if (s.includes('time')) return 'Time-weighted';
  if (s.includes('histor')) return 'Historical';
  return String(h).replace(/\s+/g, ' ').trim();
}
async function parseEsopFile(file) {
  await loadXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const A = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
  const cells = A.flat().filter((c) => c != null).map(String);
  let allocationDate = null, title = '', exerciseYears = null;
  for (const c of cells) {
    const m = c.match(/allocation\s*date\s*:?\s*(\d{1,2})(?:st|nd|rd|th)?[\s\-\/]+([A-Za-z]+)[\s,\-\/]+(\d{4})/i);
    if (m && !allocationDate) {
      const mi = MONTHS3.indexOf(m[2].slice(0, 3).toLowerCase());
      if (mi >= 0) { allocationDate = `${m[3]}-${pad(mi + 1)}-${pad(Number(m[1]))}`; title = c.replace(/\s*-\s*allocation\s*date.*$/i, '').trim() || c.trim(); }
    }
    const e = c.match(/exercise\s*period\s*:?\s*(\d+)\s*year/i);
    if (e && exerciseYears == null) exerciseYears = Number(e[1]);
  }
  const hi = A.findIndex((r) => (r || []).some((c) => /member\s*name/i.test(String(c ?? ''))));
  if (hi < 0) throw new Error('Could not find the “Member Name” header row — use the ESOP allocation template.');
  const H = A[hi], nameCol = H.findIndex((c) => /member\s*name/i.test(String(c ?? '')));
  const schedCol = H.findIndex((c) => /allocation\s*schedule|vesting\s*schedule/i.test(String(c ?? '')));
  const notesRow = A[hi + 1] || [];
  // Schedule columns: labels like Mar'27 in the header row or the row under it
  const sched = [];
  const maxLen = Math.max(H.length, notesRow.length);
  for (let c = 0; c < maxLen; c++) {
    if (c === nameCol || (schedCol >= 0 && c < schedCol)) continue;
    const lab = esopLabelToDate(notesRow[c]) ? notesRow[c] : esopLabelToDate(H[c]) ? H[c] : null;
    if (lab != null) sched.push({ col: c, label: lab instanceof Date ? fmtDMY(esopLabelToDate(lab)) : String(lab).trim(), date: esopLabelToDate(lab) });
  }
  const grantCols = [];
  const lastGrant = schedCol >= 0 ? schedCol : sched.length ? sched[0].col : maxLen;
  for (let c = 0; c < lastGrant; c++) {
    if (c === nameCol || H[c] == null || String(H[c]).trim() === '' || /total/i.test(String(H[c]))) continue;
    grantCols.push({ col: c, type: esopGrantType(H[c]), header: String(H[c]).trim(), note: String(notesRow[c] ?? '').replace(/\s+/g, ' ').trim() });
  }
  if (!grantCols.length) throw new Error('No grant columns found before the allocation schedule.');
  const derived = !sched.length; // no Mar'27-style columns: work the schedule out from the vesting notes
  const num = (v) => { const n = Number(String(v ?? '').replace(/[,\s]/g, '')); return Number.isFinite(n) ? Math.round(n) : 0; };
  const members = []; let sheetTotal = null;
  for (let r = hi + 1; r < A.length; r++) {
    const row = A[r] || []; const name = String(row[nameCol] ?? '').replace(/\s+/g, ' ').trim();
    if (!name) continue;
    if (/^total/i.test(name)) { if (sheetTotal == null) sheetTotal = { grants: grantCols.map((g) => num(row[g.col])), sched: sched.map((s) => num(row[s.col])) }; if (/^total\s*$/i.test(name)) break; continue; }
    const grants = grantCols.map((g) => ({ type: g.type, options: num(row[g.col]), note: g.note }));
    const vesting = derived ? [] : sched.map((s) => ({ date: s.date, label: s.label, options: num(row[s.col]) }));
    if (!grants.some((g) => g.options) && !vesting.some((v) => v.options)) continue;
    if (/vesting\s*period/i.test(name)) continue;
    members.push({ member_name: name, grants, vesting, granted: grants.reduce((s, g) => s + g.options, 0), scheduled: vesting.reduce((s, v) => s + v.options, 0) });
  }
  if (!members.length) throw new Error('No members with options found under the header row.');
  const P = { allocationDate, title, exerciseYears, grantCols, sched, members, sheetTotal, derived };
  if (derived) esopApplyDerived(P, allocationDate || todayISO());
  return P;
}
// "25% each - 4 years" → 4 equal yearly parts; "50% - 2 years" → 2. No note: the scheme's standard 25% a year for 4 years.
function esopNoteSplit(note) {
  const s = String(note || '').toLowerCase();
  const yrs = Number((s.match(/(\d+)\s*-?\s*y(?:ea)?rs?/) || [])[1]) || 0;
  const pct = Number((s.match(/(\d+(?:\.\d+)?)\s*%/) || [])[1]) || 0;
  const n = Math.min(10, yrs || (pct ? Math.round(100 / pct) : 4)) || 4;
  return Array.from({ length: n }, () => 1 / n);
}
// Vesting on each anniversary of the allocation date; whole options, rounded so they add up to the grant
function esopDeriveVesting(grants, allocDate) {
  const per = {};
  for (const g of grants) esopNoteSplit(g.note).forEach((f, i) => { per[i + 1] = (per[i + 1] || 0) + g.options * f; });
  const total = grants.reduce((s, g) => s + g.options, 0);
  const years = Object.keys(per).map(Number).sort((a, b) => a - b);
  const whole = years.map((y) => Math.floor(per[y] + 1e-9));
  let left = total - whole.reduce((s, v) => s + v, 0);
  for (const [, i] of years.map((y, i) => [per[y] - whole[i], i]).sort((a, b) => b[0] - a[0] || a[1] - b[1])) { if (left <= 0) break; whole[i] += 1; left -= 1; }
  return years.map((y, i) => { const d = addYearsISO(allocDate, y); const dt = parseISODate(d);
    return { date: d, label: `${MONTHS3[dt.getMonth()][0].toUpperCase()}${MONTHS3[dt.getMonth()].slice(1)}'${String(dt.getFullYear()).slice(2)}`, options: whole[i] }; }).filter((v) => v.options > 0);
}
function esopApplyDerived(P, allocDate) {
  for (const m of P.members) { m.vesting = esopDeriveVesting(m.grants, allocDate); m.scheduled = m.vesting.reduce((s, v) => s + v.options, 0); }
  const dates = [...new Set(P.members.flatMap((m) => m.vesting.map((v) => v.date)))].sort();
  P.sched = dates.map((d) => ({ date: d, label: P.members.flatMap((m) => m.vesting).find((v) => v.date === d).label }));
  for (const m of P.members) m.vesting = P.sched.map((s) => ({ ...s, options: m.vesting.find((v) => v.date === s.date)?.options || 0 }));
}
const normName = (s) => String(s || '').toLowerCase().replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
function esopMatchMember(name, profiles) {
  const n = normName(name); if (!n) return null;
  const exact = profiles.filter((p) => normName(p.full_name) === n);
  if (exact.length === 1) return exact[0];
  const starts = profiles.filter((p) => normName(p.full_name).startsWith(n + ' ') || n.startsWith(normName(p.full_name) + ' '));
  if (starts.length === 1) return starts[0];
  const first = n.split(' ')[0], last = n.split(' ').slice(-1)[0];
  const fl = profiles.filter((p) => { const w = normName(p.full_name).split(' '); return w[0] === first && (n.split(' ').length === 1 || w.slice(-1)[0] === last); });
  return fl.length === 1 ? fl[0] : null;
}

/* ---------- Admin page ---------- */
// Totals over tranche rows (from esopPosition) — used for one allocation or all of them
function esopSum(rows) {
  const s = { granted: 0, vested: 0, exercised: 0, lapsed: 0, cancelled: 0, unvested: 0 };
  for (const r of rows) {
    s.granted += r.options;
    if (['vested', 'exercised', 'lapsed'].includes(r.status)) s.vested += r.options;
    if (r.status === 'upcoming') s.unvested += r.options;
    if (r.status === 'returned') s.cancelled += r.options;
    s.exercised += r.exercised || 0; s.lapsed += r.lapsed || 0;
  }
  s.returned = s.cancelled + s.lapsed;
  s.exercisable = Math.max(0, s.vested - s.exercised - s.lapsed);
  s.next = rows.filter((r) => r.status === 'upcoming').sort((a, b) => a.date.localeCompare(b.date))[0] || null;
  return s;
}
// One row per allocation with a running (cumulative) total — the "final" calculation
function esopAllocationRows(allocations, rows, grants) {
  let cum = 0, cumRet = 0;
  return [...allocations].sort((a, b) => a.allocation_date.localeCompare(b.allocation_date)).map((a) => {
    const s = esopSum(rows.filter((r) => r.allocation_id === a.id));
    cum += s.granted; cumRet += s.returned;
    const members = new Set(grants.filter((g) => g.allocation_id === a.id).map((g) => g.employee_id || g.member_name)).size;
    return { a, s, cum, cumRet, members };
  });
}

async function editEsopPool() {

function pickEsopFile() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.xlsx,.xls,.csv';
  input.addEventListener('change', async () => {
    const file = input.files[0]; if (!file) return;
    const busy = toastBusy(`Reading ${file.name}…`);
    try { const parsed = await parseEsopFile(file); busy(); showEsopPreview(file, parsed); }
    catch (e) { busy(); toast(friendlyError(e), 'error'); }
  });
  input.click();
}

    const date = $('[data-a-date]', el).value, years = Number($('[data-a-years]', el).value) || null;
    if (!date) return toast('Enter the allocation date', 'error');
    if (P.derived) esopApplyDerived(P, date);
    try {
      await api.rpc('admin_import_esop', { p_allocation_date: date, p_title: $('[data-a-title]', el).value, p_exercise_years: years, p_file_name: file.name,
        p_rows: P.members.map((m) => ({ member_name: m.member_name, employee_id: m.emp?.id || null, grants: m.grants, vesting: m.vesting })) });
      close(); toast(`Saved ${fmtNum(total)} options for ${P.members.length} members`);
      archiveUpload('ESOP', file);
      location.hash = '#/esops'; render();
    } catch (e) { toast(friendlyError(e), 'error'); }
  }));
}

// Ask HR to change details — nothing is saved until HR approves
function openChangeRequest(P) {
  const me = P.profile, k = P.kyc;
  const kycOpen = KYC_OPEN.includes(me.kyc_status || 'not_started');
  const field = (key, label, value, type = 'text') => `<div class="field"><label>${label}</label>
    ${key === 'emergency_relationship' ? `<select class="input" data-cr="${key}"><option value="">Select</option>${RELATIONSHIPS.map((r) => `<option ${value === r ? 'selected' : ''}>${r}</option>`).join('')}</select>`
      : `<input class="input ${key.startsWith('bank') ? 'mono' : ''}" type="${type}" data-cr="${key}" value="${esc(value || '')}">`}</div>`;
  const dlg = openModal({
    title: 'Request a change', size: 'md', subtitle: 'Change only what needs changing. HR approves the request before anything is updated.',
    body: `<div class="grid" style="gap:16px">
      <div><div class="section-title">Personal</div><div class="grid g2" style="gap:12px">
        ${field('full_name', 'Full name', me.full_name)}${field('phone', 'Phone', me.phone, 'tel')}${field('date_of_birth', 'Date of birth', me.date_of_birth, 'date')}</div></div>
      ${k && !kycOpen ? `<div><div class="section-title">Bank</div><div class="grid g2" style="gap:12px">
        ${field('bank_account_number', 'Account number', k.bank_account_number)}${field('bank_ifsc', 'IFSC', k.bank_ifsc)}</div></div>
      <div><div class="section-title">Emergency contact</div><div class="grid g3" style="gap:12px">
        ${field('emergency_name', 'Name', k.emergency_name)}${field('emergency_relationship', 'Relationship', k.emergency_relationship)}${field('emergency_phone', 'Contact number', k.emergency_phone, 'tel')}</div></div>`
        : `<p class="muted" style="font-size:12.5px">Bank and emergency details come from your KYC — fill them in the KYC form (${kycOpen ? 'still open for you' : 'not submitted yet'}).</p>`}
      <div class="field"><label>Reason <span class="faint">(optional, for HR)</span></label><textarea class="input" id="cr-reason" placeholder="e.g. New bank account"></textarea></div>
      <div id="cr-msg"></div></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-ok>${icon('check', 'sm')}Send for approval</button>`,
  });
  const current = { full_name: me.full_name, phone: me.phone, date_of_birth: me.date_of_birth, ...(k || {}) };
  $('[data-ok]', dlg.el).addEventListener('click', async (ev) => {
    const changes = {};
    $$('[data-cr]', dlg.el).forEach((el) => {
      let v = el.value.trim();
      if (el.dataset.cr === 'bank_ifsc') v = v.toUpperCase();
      if (el.dataset.cr.endsWith('phone')) v = normPhone(v);
      if (v && v !== String(current[el.dataset.cr] ?? '')) changes[el.dataset.cr] = v;
    });
    const fail = (t) => { $('#cr-msg', dlg.el).innerHTML = `<div class="alert alert-error">${icon('alert')}<span>${esc(t)}</span></div>`; };
    if (!Object.keys(changes).length) return fail('Nothing has changed.');
    if (changes.bank_ifsc && !/^[A-Z]{4}0[A-Z0-9]{6}$/.test(changes.bank_ifsc)) return fail('Enter a valid IFSC (e.g. HDFC0001234).');
    if (changes.bank_account_number && !/^\d{9,18}$/.test(changes.bank_account_number)) return fail('The account number should be 9–18 digits.');
    if ((changes.phone && !isPhone(changes.phone)) || (changes.emergency_phone && !isPhone(changes.emergency_phone))) return fail('Enter a valid phone number.');
    try {
      await withBusy(ev.currentTarget, 'Sending…', () => api.rpc('request_profile_change', { p_changes: changes, p_note: $('#cr-reason', dlg.el).value }));
      dlg.close();
      toast('Sent to HR. Your details change once it’s approved.');
      render();
    } catch (err) { fail(friendlyError(err)); }
  });
}

    const x = qByDate.get(d.date);
    if (x) return `<span class="chip ${Q_TONE[x.status]} plain" title="${esc(x.admin_note || x.note)}">Query ${Q_LABEL[x.status].toLowerCase()}</span>`;

      <div class="right"><b class="nowrap" style="font-size:18px">${fmtINR(sl.net)}</b><span class="muted" style="font-size:12.5px">net pay</span></div></div>
    <div class="card-body">
      <div class="count-grid">
        <div><span class="st st-F">F</span><b>${sl.full}</b><span>Full${cnt('H') || cnt('WFH') ? ` (incl. ${[cnt('H') ? `${cnt('H')} holiday` : '', cnt('WFH') ? `${cnt('WFH')} WFH` : ''].filter(Boolean).join(', ')})` : ''}</span></div>
        <div><span class="st st-HD">HD</span><b>${sl.half}</b><span>Half</span></div>
        <div><span class="st st-L">L</span><b>${sl.leave}</b><span>Leave</span></div>
        <div><span class="st st-WO">WO</span><b>${sl.weekly_off}</b><span>WO</span></div>
      </div>
      <div class="pay-line">Monthly salary ${fmtINR(sl.monthly_salary)} · Earned ${fmtINR(sl.earned)} − Professional Tax ${fmtINR(sl.pt)} = <b>${fmtINR(sl.net)}</b></div>

        ? `Something wrong with a <b>Leave</b> or <b>Half day</b>? Click <b>Ask</b> on that date. Open until <b>${esc(fmtDateTime(until))}</b> (${Math.floor(msLeft / 3600e3)}h ${pad(Math.floor((msLeft % 3600e3) / 60e3))}m left).`
        : `Queries for this month closed on ${esc(fmtDateTime(until))}. Contact HR for anything else.`}</span></div>
    </div>
    ${days.length ? `<details class="slip-days" ${open ? 'open' : ''}><summary>Day-wise sheet</summary><div class="table-wrap"><table class="table compact">
      <thead><tr><th>Date</th><th>Day</th><th>IN</th><th>OUT</th><th>Worked</th><th>Status</th><th></th></tr></thead><tbody>
      ${days.map((d) => `<tr><td class="nowrap mono">${fmtDMY(d.date)}</td><td>${esc(d.day || '')}</td><td class="mono">${d.in || '<span class="faint">—</span>'}</td><td class="mono">${d.out || '<span class="faint">—</span>'}</td>
        <td class="nowrap">${d.mins == null ? '<span class="faint">—</span>' : fmtDuration(d.mins)}</td>
        <td class="nowrap">${stChip(d.status, DAY_WORD[d.status])} <span class="muted" style="font-size:12.5px">${esc(d.label || DAY_WORD[d.status] || '')}</span></td>
        <td class="actions">${qCell(d)}</td></tr>`).join('')}

        ${x.admin_note ? `<div style="margin-top:4px;font-size:13px">HR: ${esc(x.admin_note)}</div>` : ''}</div>

// ---- Holiday & time-relaxation calendar (read-only) ----
async function pageMyCalendar() {
  const all = await q(db.from('calendar_days').select('day, kind, description, full_minutes').is('removed_at', null).order('day'));
  const fy = state.calFy ?? fyOf(todayISO());
  const [from, to] = fyRange(fy);
  const inFy = all.filter((c) => c.day >= from && c.day <= to);
  const today = todayISO();
  const next = inFy.find((c) => c.day >= today);
  const rows = (list, rel) => list.length ? `<div class="table-wrap"><table class="table compact"><thead><tr><th>Date</th><th>Day</th><th>Description</th>${rel ? '<th class="num">Full day</th>' : ''}</tr></thead><tbody>
    ${list.map((c) => `<tr class="${c.day < today ? 'muted' : ''}"><td class="nowrap mono">${fmtDMY(c.day)}${c === next ? ' <span class="chip violet plain">Next</span>' : ''}</td><td>${DAY_NAMES[parseISODate(c.day).getDay()]}</td><td>${esc(c.description)}</td>${rel ? `<td class="num nowrap"><b style="color:var(--text)">${fmtHM(c.full_minutes)}</b></td>` : ''}</tr>`).join('')}
    </tbody></table></div>` : `<div class="card-body"><p class="muted" style="font-size:13px">Nothing in ${fyLabel(fy)} yet.</p></div>`;
  return {
    title: 'Holidays', crumbs: `Holiday and time-relaxation calendar · ${fyLabel(fy)} (1 April – 31 March)`,
    html: `
      <div class="card"><div class="card-head"><div><h3>Financial year</h3><p>Set by HR. Holidays from Monday to Saturday are paid as full days; on a time-relaxation day the full day is shorter.</p></div>
        <div class="right"><select class="input" id="cal-fy" style="height:34px;width:auto">${fyOptions(fy, all.map((c) => fyOf(c.day)))}</select></div></div></div>
      <div class="card"><div class="card-head"><div><h3>Holidays</h3></div></div>${rows(inFy.filter((c) => c.kind === 'holiday'), false)}</div>
      <div class="card"><div class="card-head"><div><h3>Time relaxation</h3><p>Working the time shown counts as a full day</p></div></div>${rows(inFy.filter((c) => c.kind === 'relaxation'), true)}</div>`,
    mount() { $('#cal-fy').addEventListener('change', (e) => { state.calFy = Number(e.target.value); render(); }); },
  };
}

// ---- Work from home ----
async function pageMyWfh() {
  const [list, cal, slips] = await Promise.all([

    q(db.from('calendar_days').select('day, kind, description').is('removed_at', null)),
    api.rpc('my_payslips').catch(() => [])]);
  const holidays = new Map(cal.filter((c) => c.kind === 'holiday').map((c) => [c.day, c.description]));
  const pushed = new Set((slips || []).map((sl) => sl.month.slice(0, 7)));
  const st = { recorded: ['green', 'Recorded'], rejected: ['red', 'Rejected by HR'], withdrawn: ['gray', 'Withdrawn'] };
  return {
    title: 'Work from home', crumbs: 'Add the days you work from home',
    html: `
      ${state.updates?.left ? `<div class="alert">${icon('lock')}<span>WFH can’t be added after you have left.</span></div>` : ''}
      <div class="card ${state.updates?.left ? 'hidden' : ''}"><div class="card-head"><div><h3>Add WFH</h3><p>Pick one date or a range. Past dates are allowed within this month only (from 01-${todayISO().slice(5, 7)}). Sundays and holidays are skipped; once a month is published it is locked.</p></div></div>
        <div class="card-body"><div class="cal-form">
          <label class="muted" style="font-size:12.5px">From</label><input class="input" type="date" id="wf-from" value="${todayISO()}" min="${todayISO().slice(0, 8)}01">
          <label class="muted" style="font-size:12.5px">To</label><input class="input" type="date" id="wf-to" min="${todayISO().slice(0, 8)}01" title="Optional — leave empty for one day">
          <input class="input" id="wf-note" placeholder="Note for HR (optional)" maxlength="160">
          <button class="btn btn-primary" id="wf-add">${icon('plus', 'sm')}Add WFH</button></div>
          <div class="hint" id="wf-preview" style="margin-top:8px"></div></div></div>
      <div class="card"><div class="card-head"><div><h3>Your WFH days</h3><p>${list.filter((w) => w.status === 'recorded').length} recorded</p></div></div>
        ${list.length ? `<div class="table-wrap"><table class="table compact"><thead><tr><th>Date</th><th>Day</th><th>Note</th><th>Status</th><th></th></tr></thead><tbody>
          ${list.map((w) => `<tr><td class="nowrap mono">${fmtDMY(w.work_date)}</td><td>${DAY_NAMES[parseISODate(w.work_date).getDay()]}</td>
            <td class="wrap">${esc(w.note || '') || '<span class="faint">—</span>'}${w.added_by && w.added_by !== w.employee_id ? ' <span class="faint">(added by HR)</span>' : ''}${w.admin_note ? `<div style="font-size:12.5px">HR: ${esc(w.admin_note)}</div>` : ''}</td>
            <td><span class="chip ${st[w.status][0]} plain">${st[w.status][1]}</span></td>
            <td class="actions">${w.status === 'recorded' && !pushed.has(w.work_date.slice(0, 7)) ? `<button class="btn btn-sm" data-wf-withdraw="${w.id}">Withdraw</button>` : ''}</td></tr>`).join('')}
          </tbody></table></div>` : `<div class="card-body"><p class="muted" style="font-size:13px">No WFH days yet.</p></div>`}</div>`,
    mount() {
      const datesFor = () => {
        const a = $('#wf-from').value, b = $('#wf-to').value || a;
        if (!a) return [];
        const out = []; let d = parseISODate(a); const end = parseISODate(b);
        if (!end || end < d) return null;
        for (let n = 0; d <= end && n < 62; n++, d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
          const iso = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
          if (d.getDay() !== 0 && !holidays.has(iso)) out.push(iso);

        return out;
      };

        const ds = datesFor();
        $('#wf-preview').textContent = ds == null ? '“To” is before “From”.' : ds.length ? `${ds.length} day${ds.length === 1 ? '' : 's'}: ${ds.map(fmtDMY).join(', ')}` : 'No working days in that range.';
      };
      $('#wf-from').addEventListener('change', preview); $('#wf-to').addEventListener('change', preview); preview();
      $('#wf-add').addEventListener('click', async (ev) => {
        const ds = datesFor();
        if (!ds || !ds.length) return toast('Pick the WFH date(s).', 'error');
        if (ds[0] < todayISO().slice(0, 8) + '01') return toast('WFH can be back-dated only within this month.', 'error');
        try { const n = await withBusy(ev.currentTarget, 'Adding…', () => api.rpc('my_add_wfh', { p_dates: ds, p_note: $('#wf-note').value })); toast(n ? `${n} WFH day${n === 1 ? '' : 's'} added.` : 'Those days were already added.'); render(); }
        catch (err) { toast(friendlyError(err), 'error'); }
      });
      $$('[data-wf-withdraw]').forEach((b) => b.addEventListener('click', async () => {
        try { await withBusy(b, '', () => api.rpc('my_withdraw_wfh', { p_id: b.dataset.wfWithdraw })); toast('WFH withdrawn.'); render(); }
        catch (err) { toast(friendlyError(err), 'error'); }
      }));
    },
  };
}

    const input = b.previousElementSibling; const show = input.type === 'password';
    input.type = show ? 'text' : 'password'; b.innerHTML = icon(show ? 'eyeOff' : 'eye');
  }));
  const btn = $('#pw-btn'), step2 = $('#pw-step2'), resend = $('#pw-resend'), cancel = $('#pw-cancel');
  let sentAt = 0;
  const reset = () => {
    f.reset(); sentAt = 0;
    if (step2) { step2.classList.add('hidden'); resend.classList.add('hidden'); cancel.classList.add('hidden'); }
    btn.innerHTML = `${icon('lock', 'sm')}${SEND_AUTH_EMAILS ? 'Send code to my email' : 'Update password'}`;
  };
  const sendCode = async () => {
    const { error } = await db.auth.reauthenticate();
    if (error) throw error;
    sentAt = Date.now();
    step2.classList.remove('hidden'); resend.classList.remove('hidden'); cancel.classList.remove('hidden');
    $('#pw-hint').textContent = `Code sent to ${state.user?.email || 'your email'} — it can take a minute.`;
    f.elements.code.value = '';
  };
  const showVerify = () => { btn.innerHTML = `${icon('check', 'sm')}Verify code & update password`; f.elements.code.focus(); };
  const checkPw = () => {
    const pw = f.elements.password.value, cf = f.elements.confirm.value;
    if (pw.length < 8) { toast('The password must be at least 8 characters.', 'error'); return null; }
    if (pw !== cf) { toast('The passwords do not match.', 'error'); return null; }
    return pw;
  };
  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const pw = checkPw(); if (!pw) return;
    try {
      if (SEND_AUTH_EMAILS && !sentAt) { await withBusy(btn, 'Sending…', sendCode); showVerify(); return; }
      const nonce = SEND_AUTH_EMAILS ? f.elements.code.value.replace(/\D/g, '') : null;
      if (SEND_AUTH_EMAILS && nonce.length < 6) return toast('Enter the code from the email.', 'error');
      const current = SEND_AUTH_EMAILS ? null : f.elements.current.value;
      if (!SEND_AUTH_EMAILS && !current) return toast('Enter your current password.', 'error');
      if (!SEND_AUTH_EMAILS && current === pw) return toast('The new password must be different from the current one.', 'error');
      await withBusy(btn, 'Updating…', async () => {
        if (!SEND_AUTH_EMAILS) {
          const { error: e1 } = await getSignupClient().auth.signInWithPassword({ email: state.user?.email || state.profile?.email, password: current });
          if (e1) throw new Error(/Invalid login credentials/i.test(e1.message) ? 'Your current password is not correct.' : e1.message);
          await getSignupClient().auth.signOut({ scope: 'local' });
        }
        const { error } = await db.auth.updateUser(nonce ? { password: pw, nonce } : { password: pw });
        if (error && /reauthenticat/i.test(error.message + (error.code || ''))) throw new Error('For safety, please sign out and sign in again, then change your password.');
        if (error) throw new Error(nonce && /nonce|otp|token|expired|invalid/i.test(error.message) ? 'That code is wrong or has expired. Check the latest email, or resend the code.' : error.message);
      });
      reset();
      toast('Password updated.');
    } catch (err) { toast(friendlyError(err), 'error'); }
  });
  resend?.addEventListener('click', async () => {
    const left = Math.ceil(OTP_RESEND_SECONDS - (Date.now() - sentAt) / 1000);
    if (left > 0) return toast(`You can resend the code in ${left}s.`, 'error');
    try { await withBusy(resend, 'Sending…', sendCode); toast('A new code is on its way.'); } catch (err) { toast(friendlyError(err), 'error'); }
  });
  cancel?.addEventListener('click', reset);
}

// Admin → My Account
async function pageAdminAccount() {
  const p = state.profile;
  return {
    title: 'My Account', crumbs: 'Your sign-in details',
    html: `<div class="card emp-head">${avatar(p, 'lg')}<div style="min-width:0"><h2>${esc(p.full_name)}</h2><div class="meta"><span>${esc(p.email)}</span><span>·</span><span>${ADMIN_LABEL[adminLevel(p)] || 'Admin'}</span>${p.designation ? `<span>·</span><span>${esc(p.designation)}</span>` : ''}</div></div></div>
      ${changePasswordCardHTML('Choose a new password for your admin login.')}`,
    mount() { mountChangePassword(); },
  };
}

/* =====================================================================
   BOOT
   ===================================================================== */
function renderSetup() {
  $('#app').innerHTML = `<div class="center-wrap" style="min-height:100vh"><div class="card status-card" style="max-width:560px;text-align:left">
    <div class="brand" style="margin-bottom:20px">${LOGO}<div>Altius HRMS<small>Setup required</small></div></div>
    <h2>Connect Supabase</h2>
    <p>${window.supabase ? 'Open <b>index.html</b> and set <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of the script (Supabase → Project Settings → API), then apply <code>supabase/migrations</code> (<code>supabase db push</code> or the SQL editor).' : 'The Supabase library could not be loaded. Check your internet connection and reload.'}</p>
  </div></div>`;
}

if (!db) {
  renderSetup();
} else {
  $('#app').innerHTML = `<div class="loading full">${spinnerHTML}</div>`;
  db.auth.onAuthStateChange((event, session) => {
    // Defer: Supabase recommends not awaiting other calls inside this callback.
    setTimeout(() => handleAuthEvent(event, session), 0);
  });
}

async function handleAuthEvent(event, session) {
  if (state.otpGate) return; // waiting for an emailed code (sign-in or password reset)
  if (event === 'PASSWORD_RECOVERY' && state.codeReset) { state.codeReset = false; event = 'SIGNED_IN'; } // reset done with a code
  if (event === 'PASSWORD_RECOVERY') {
    state.recovery = true; state.session = session; state.user = session?.user || null;
    return renderAuth('reset');
  }
  if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') { state.session = session; return; }
  const sameUser = state.user && session?.user && state.user.id === session.user.id;
  state.session = session;
  state.user = session?.user || null;
  if (!session) {
    const wasSignedIn = !!state.profile;
    resetSessionState();
    if (state.signingOut) return; // signOut() renders the login screen itself
    if (wasSignedIn) {
      closeAllModals();
      history.replaceState(null, '', location.pathname);
      lastHash = '';
      toast('Your session has ended. Please sign in again.', 'error');
    }
    if (wasSignedIn || !$('#auth-form')) renderAuth('login');
    return;
  }
  if (state.recovery) return;
  if (sameUser && state.profile) return; // e.g. SIGNED_IN re-emitted on tab focus
  await loadSelfAndRoute();
}

// Never fail silently: surface unexpected errors to the user.
window.addEventListener('unhandledrejection', (e) => toast(friendlyError(e.reason), 'error'));
</script>
<script type="text/plain" id="drive-bridge-code">
/**
 * Altius HRMS — Google Drive bridge (Google Apps Script web app)
 *
 * Saves the HRMS files (KYC documents, salary slips, ESOP grant letters and
 * the uploaded Excel sheets) in a Google Drive folder instead of Supabase
 * storage. The HRMS keeps only the Drive file id.
 *
 * Every call carries the person's HRMS sign-in token; the bridge checks it
 * with Supabase before doing anything:
 *   - employees can only upload their own KYC (named and filed automatically)
 *     and open files that belong to them;
 *   - admins can upload salary slips, grant letters and sheets, and open any
 *     HRMS file.
 *
 * Setup: see "Storage & documents" in the HRMS admin (Settings).
 * Script properties: SUPABASE_URL, SUPABASE_ANON_KEY, ROOT_FOLDER_ID
 */
var APP = 'altius-hrms';

function doGet() {
  return out_({ ok: true, service: 'Altius HRMS Drive bridge' });
}

function doPost(e) {
  try {
    var req = JSON.parse((e && e.postData && e.postData.contents) || '{}');
    var user = verify_(req.token);
    var fn = ACTIONS[req.action];
    if (!fn) throw new Error('Unknown action');
    var res = fn(req, user);
    res.ok = true;
    return out_(res);
  } catch (err) {
    return out_({ ok: false, error: String((err && err.message) || err) });
  }
}

var ACTIONS = {
  // Check the connection
  ping: function (req, user) {
    var root = root_();
    return { user: user.full_name, admin: user.isAdmin, folder: root.getName(), folderUrl: root.getUrl() };
  },

  // Save a file. KYC: {kind:'kyc', label, ext, mime, data, owner?}; other files (admin): {folder:[...], name, mime, data, owner?}
  upload: function (req, user) {
    var path, owner, name, replace;
    if (req.kind === 'kyc') {
      var person = user;
      if (req.owner && req.owner !== user.id) {
        if (!user.isAdmin) throw new Error('Not allowed');
        person = profile_(req.owner, req.token);
      }
      path = ['KYC', person.full_name + (person.employee_code ? ' - ' + person.employee_code : '')];
      owner = person.id;
      name = person.full_name + ' - ' + clean_(req.label || 'Document') + '.' + String(req.ext || 'pdf').replace(/[^a-z0-9]/gi, '').toLowerCase();
      replace = 'rename';
    } else {
      if (!user.isAdmin) throw new Error('Only admin can do this');
      if (!req.folder || !req.folder.length) throw new Error('Folder missing');
      path = req.folder;
      owner = req.owner || '';
      name = clean_(req.name || 'File');
      replace = req.replace ? 'trash' : 'keep';
    }
    if (!req.data) throw new Error('The file is empty');
    var folder = folder_(path, req.kind === 'kyc' ? owner : '');
    var same = folder.getFilesByName(name);
    while (same.hasNext()) {
      var old = same.next();
      if (meta_(old).app !== APP) continue;
      if (replace === 'trash') old.setTrashed(true);
      else if (replace === 'rename') old.setName(name.replace(/(\.[a-z0-9]+)?$/i, ' (replaced ' + Utilities.formatDate(new Date(), 'Asia/Kolkata', 'dd-MM-yyyy HHmm') + ')$1'));
    }
    var blob = Utilities.newBlob(Utilities.base64Decode(req.data), req.mime || 'application/octet-stream', name);
    var file = folder.createFile(blob);
    file.setDescription(JSON.stringify({ app: APP, owner: owner, kind: req.kind || 'file', by: user.id }));
    return { id: file.getId(), name: file.getName(), url: file.getUrl(), folderUrl: folder.getUrl() };
  },

  // Open a file: the owner or an admin
  get: function (req, user) {
    var file = DriveApp.getFileById(req.id);
    var m = meta_(file);
    if (m.app !== APP) throw new Error('Not an HRMS file');
    if (!user.isAdmin && m.owner !== user.id) throw new Error('Not allowed');
    var blob = file.getBlob();
    return { name: file.getName(), mime: blob.getContentType(), data: Utilities.base64Encode(blob.getBytes()), url: user.isAdmin ? file.getUrl() : null };
  },

  // Move a file to the Drive bin (admin)
  remove: function (req, user) {
    if (!user.isAdmin) throw new Error('Only admin can do this');
    var file = DriveApp.getFileById(req.id);
    if (meta_(file).app !== APP) throw new Error('Not an HRMS file');
    file.setTrashed(true);
    return {};
  },
};

// Run this once from the editor (select "setup" → Run): Google then asks for the Drive and
// "connect to an external service" permissions, and it checks the three script properties.
function setup() {
  var folder = root_();
  var r = UrlFetchApp.fetch(cfg_('SUPABASE_URL').replace(/\/$/, '') + '/auth/v1/health', { headers: { apikey: cfg_('SUPABASE_ANON_KEY') }, muteHttpExceptions: true });
  Logger.log('Drive folder: ' + folder.getName() + ' — OK');
  Logger.log('Supabase: ' + (r.getResponseCode() === 200 ? 'OK' : 'answered ' + r.getResponseCode() + ' — check SUPABASE_URL / SUPABASE_ANON_KEY'));
}

function cfg_(k) {
  var v = PropertiesService.getScriptProperties().getProperty(k);
  if (!v) throw new Error('The Drive bridge is missing the script property ' + k);
  return v;
}
function root_() { return DriveApp.getFolderById(cfg_('ROOT_FOLDER_ID')); }

// Checks the HRMS sign-in token with Supabase and loads the person's profile
function verify_(token) {
  if (!token) throw new Error('Not signed in');
  var base = cfg_('SUPABASE_URL').replace(/\/$/, '');
  var h = { apikey: cfg_('SUPABASE_ANON_KEY'), Authorization: 'Bearer ' + token };
  var u = UrlFetchApp.fetch(base + '/auth/v1/user', { headers: h, muteHttpExceptions: true });
  if (u.getResponseCode() !== 200) throw new Error('Your session has expired. Please sign in again.');
  var p = profile_(JSON.parse(u.getContentText()).id, token);
  p.isAdmin = p.role === 'admin' && p.status === 'active';
  return p;
}
function profile_(id, token) {
  var base = cfg_('SUPABASE_URL').replace(/\/$/, '');
  var h = { apikey: cfg_('SUPABASE_ANON_KEY'), Authorization: 'Bearer ' + token };
  var r = UrlFetchApp.fetch(base + '/rest/v1/profiles?select=id,role,status,full_name,employee_code&id=eq.' + encodeURIComponent(id), { headers: h, muteHttpExceptions: true });
  var rows = JSON.parse(r.getContentText() || '[]');
  if (!rows.length) throw new Error('Profile not found');
  return rows[0];
}

// Finds or creates root/path[0]/path[1]/…; the last folder can be tied to an owner
function folder_(path, owner) {
  var f = root_();
  for (var i = 0; i < path.length; i++) {
    var name = clean_(path[i]);
    var last = i === path.length - 1;
    var it = f.getFoldersByName(name), next = null;
    while (it.hasNext()) {
      var c = it.next();
      if (!last || !owner || meta_(c).owner === owner) { next = c; break; }
    }
    if (!next) {
      next = f.createFolder(name);
      next.setDescription(JSON.stringify({ app: APP, owner: last ? owner : '' }));
    }
    f = next;
  }
  return f;
}
function meta_(item) {
  try { return JSON.parse(item.getDescription() || '{}') || {}; } catch (e) { return {}; }
}
function clean_(s) {
  return String(s || '').replace(/[\\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 150) || 'Untitled';
}
function out_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
</script>
