async function pageAccess(r) {
  await ensureAdmin();
  const tab = r.id === 'nonemd' ? 'admins' : ['requests', 'kyc', 'awaiting', 'changes', 'admins', 'rejected'].includes(r.id) ? r.id : 'requests';
  const P = state.admin.profiles;
  const lists = {
    requests: P.filter((p) => p.status === 'pending').sort((a, b) => new Date(b.created_at) - new Date(a.created_at)),
    kyc: P.filter(kycToReview).sort((a, b) => new Date(a.kyc_submitted_at) - new Date(b.kyc_submitted_at)),
    awaiting: P.filter(kycOutstanding).sort((a, b) => new Date(b.access_granted_at || b.created_at) - new Date(a.access_granted_at || a.created_at)),
    rejected: P.filter((p) => p.rejected_at).sort((a, b) => new Date(b.rejected_at) - new Date(a.rejected_at)),
    changes: (state.admin.changeRequests || []).filter((x) => x.status === 'pending'),
    admins: P.filter((p) => p.role === 'admin' && p.status === 'active')
      .sort((a, b) => (adminLevel(a) === adminLevel(b) ? a.full_name.localeCompare(b.full_name) : adminLevel(a) === 'super' ? -1 : 1)),
  };
  const tabs = [['requests', 'Signup Requests'], ['kyc', 'KYC Review'], ['awaiting', 'KYC not submitted'], ['changes', 'Change requests'], ['admins', 'Admins'], ['rejected', 'Rejected']];
  const rows = lists[tab];

  let table;
  if (!rows.length) {
    table = {
      requests: emptyState('inbox', 'No signup requests', 'New sign-ups will appear here for you to give access or reject.'),
      kyc: emptyState('fileCheck', 'Nothing to review', 'When employees submit their KYC, it will appear here.'),
      awaiting: emptyState('clock', 'Everyone has submitted KYC', 'Employees who skipped KYC (or were sent back) appear here until they submit it.'),
      rejected: emptyState('x', 'No rejected requests', 'Sign-ups and KYC submissions you reject are kept here, and can be restored.'),
      changes: emptyState('check', 'No change requests waiting', 'When an employee asks to change their details, the request appears here. Nothing changes until you approve it.'),
      admins: emptyState('shield', 'No admins', ''),

    const me = state.user.id, sup = amSuper();
    const levelChip = (p) => `<span class="chip ${adminLevel(p) === 'super' ? 'violet' : 'blue'} plain nowrap">${ADMIN_LABEL[adminLevel(p)]}</span>`;

          <button class="btn btn-sm btn-danger" data-revoke="${p.id}" title="Remove admin access">${icon('x', 'sm')}Remove</button>`;

// Reject a sign-up, an awaiting-KYC person or a submitted KYC. Access is
// cancelled; the record is kept under Access Control → Rejected.
function rejectDialog(p, onDone) {
  const stage = p.status === 'kyc_submitted' ? 'KYC' : p.status === 'kyc_pending' ? 'access' : 'sign-up';
  const reasonRequired = p.status === 'kyc_submitted';
  const dlg = openModal({
    title: p.status === 'kyc_submitted' ? 'Reject KYC' : p.status === 'kyc_pending' ? 'Cancel access' : 'Reject sign-up',
    size: 'sm',
    subtitle: `${esc(p.full_name)} · ${esc(p.email)}`,
    body: `<p class="muted" style="margin-bottom:14px">Their ${stage} will be rejected and they will not be able to use the HRMS.
             The request moves to <b>Rejected</b>, where you can restore it later.</p>
           <div class="field"><label>Reason${reasonRequired ? '<span class="req">*</span>' : ' <span class="faint">(optional, shown to them)</span>'}</label>
           <textarea class="input" id="reject-reason" placeholder="e.g. Documents could not be verified."></textarea></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn btn-danger-solid" data-confirm>${icon('x', 'sm')}Reject</button>`,
  });
  const box = $('#reject-reason', dlg.el);
  box.focus();
  $('[data-confirm]', dlg.el).addEventListener('click', async (e) => {
    const reason = box.value.trim();
    if (reasonRequired && !reason) { box.classList.add('invalid'); return; }
    try {
      await withBusy(e.currentTarget, 'Rejecting…', () => api.rpc('admin_reject', { p_user: p.id, p_reason: reason || null }));
      dlg.close();
      onDone?.();
      toast(`${p.full_name}'s ${stage} was rejected.`);
      await refreshAdmin();
    } catch (err) { toast(friendlyError(err), 'error'); }
  });
}

function monthYearSelects(name, y, m) {
  const now = new Date().getFullYear();
  const years = []; for (let i = now + 2; i >= 2010; i--) years.push(i);
  return `<select class="input" data-m="${name}">${MONTHS.map((mn, i) => `<option value="${i + 1}" ${i + 1 === m ? 'selected' : ''}>${mn}</option>`).join('')}</select>
          <select class="input" data-y="${name}">${years.map((yr) => `<option ${yr === y ? 'selected' : ''}>${yr}</option>`).join('')}</select>`;
}

function exportEmdCsv(list) {
  const cell = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const header = ['Employee ID', 'Name', 'Email', 'Phone', 'Designation', 'Reporting Manager', 'Date of Joining', 'Date of Birth', 'Current Salary', 'Salary Effective From', 'Last Increment', 'Increment %'];
  const lines = list.map((e) => {
    const s = salarySummary(e.id);
    return [e.employee_code, e.full_name, e.email, e.phone, e.designation, byId(e.reporting_manager_id)?.full_name,
      e.date_of_joining, e.date_of_birth, s.latest?.amount, s.latest ? fmtMonth(s.latest.effective_month) : '',
      s.prev ? fmtMonth(s.latest.effective_month) : '', s.pct !== null ? s.pct.toFixed(1) : ''].map(cell).join(',');
  });
  const blob = new Blob(['﻿' + [header.join(','), ...lines].join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `altius-employee-master-${todayISO()}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  const st = empState(e);

  const row = (inner, buttons) => `<div class="status-row">${inner}${self || !buttons ? '' : `<span class="status-actions">${buttons}</span>`}</div>`;

  } else if (st === 'notice') {

    body = row(`${empChip(e)}${lwdChip(e)}<span class="muted" style="font-size:13px">Resigned on ${fmtDMY(e.resignation_date)} · notice of ${daysBetween(e.resignation_date, e.exit_date)} days · ${left > 0 ? `${left} day(s) to go` : left === 0 ? 'last day today' : `last working day passed ${-left} day(s) ago`}${e.exit_note ? ` · ${esc(e.exit_note)}` : ''}. Still Active until marked Resigned.</span>`,

  } else if (st === 'fnf') {

  } else {
    body = row(`${empChip(e)}${lwdChip(e)}${settleChip(e)}<span class="muted" style="font-size:13px">${e.resignation_date ? `Resigned on ${fmtDMY(e.resignation_date)} · ` : ''}${e.exit_note ? `${esc(e.exit_note)} · ` : ''}In Resigned & Terminated (EMD and Payroll) until F&F.</span>`,

  return `<div class="card" id="emp-status-card"><div class="card-head"><div><h3>Status</h3></div></div><div class="card-body">${body}</div></div>`;
}

    title: editing ? 'Edit notice period' : 'Resignation', size: 'sm', subtitle: `${esc(e.full_name)} · ${esc(e.employee_code || '')}`,
    body: `<div class="grid" style="gap:14px">
        <div class="field"><label>Resignation date<span class="req">*</span></label><input class="input" type="date" id="rs-date" value="${resign0}"></div>
        <div class="field"><label>Notice period</label><select class="input" id="rs-preset">${NOTICE_PRESETS.map((n) => `<option value="${n}" ${String(n) === preset0 ? 'selected' : ''}>${n} days</option>`).join('')}<option value="manual" ${preset0 === 'manual' ? 'selected' : ''}>Manual — pick the last working day</option></select></div>
        <div class="field"><label>Last working day<span class="req">*</span></label><input class="input" type="date" id="rs-lwd" value="${e.exit_date || addDaysISO(resign0, 30)}"><div class="hint" id="rs-info"></div></div>
        <div class="field"><label>Note <span class="faint">(optional)</span></label><textarea class="input" id="rs-note" placeholder="e.g. Resignation mail received, moving cities">${esc(e.exit_note || '')}</textarea></div>
        <p class="muted" style="font-size:12.5px">The employee shows <b>On notice period</b> and stays Active (in payroll) until you click <b>Resigned</b>.</p></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-ok>${editing ? 'Save notice' : 'Put on notice'}</button>`,
  });
  const d = $('#rs-date', dlg.el), pre = $('#rs-preset', dlg.el), lwd = $('#rs-lwd', dlg.el);
  const info = () => {
    const n = d.value && lwd.value ? daysBetween(d.value, lwd.value) : null;
    $('#rs-info', dlg.el).innerHTML = n == null ? '' : n < 0 ? '<span class="error-text">Before the resignation date</span>'
      : `${fmtDMY(lwd.value)} · notice of ${n} day(s) · F&F settlement by ${fmtDMY(addDaysISO(lwd.value, SETTLE_DAYS))}`;
  };
  const fromPreset = () => { if (pre.value !== 'manual' && d.value) lwd.value = addDaysISO(d.value, Number(pre.value)); info(); };
  d.addEventListener('change', fromPreset);
  pre.addEventListener('change', () => { if (pre.value === 'manual') { lwd.focus(); lwd.showPicker?.(); } fromPreset(); });
  lwd.addEventListener('change', () => { const n = daysBetween(d.value, lwd.value); pre.value = NOTICE_PRESETS.includes(n) ? String(n) : 'manual'; info(); });
  if (!editing) fromPreset(); else info();
  $('[data-ok]', dlg.el).addEventListener('click', async (ev) => {
    if (!d.value || !lwd.value) return toast('Pick the resignation date and the last working day.', 'error');
    if (lwd.value < d.value) return toast('The last working day cannot be before the resignation date.', 'error');
    try {
      await withBusy(ev.currentTarget, 'Saving…', () => api.rpc('admin_set_notice', { p_user: e.id, p_resign_date: d.value, p_last_day: lwd.value, p_note: $('#rs-note', dlg.el).value }));
      dlg.close(); toast(`${e.full_name} is on notice — last working day ${fmtDMY(lwd.value)}.`); state.fin.loaded = false; await refreshAdmin();
    } catch (err) { toast(friendlyError(err), 'error'); }
  });
}

async function completeFnf(e) {

    title: 'Complete F&F?',

async function pageEmployee(r) {
  await ensureAdmin();
  const e = byId(r.id);
  if (!e || !(e.status === 'active' || e.fnf_completed_at)) {
    return {
      title: 'Employee not found', crumbs: `<a href="#/emd">Employee Master Data</a>`,
      html: `<div class="card">${emptyState('user', 'Employee not found', 'This person is not in the master data yet. They appear after KYC approval.')}</div>`,
    };
  }
  const [kyc] = await Promise.all([api.kycFor(e.id), ensureFinance()]);
  const mgr = byId(e.reporting_manager_id);
  let uid = 0;
  const model = {
    employee_code: e.employee_code || '',
    designation: e.designation || '',
    manager: e.reporting_manager_id || '',
    rows: salariesOf(e.id).map((s) => { const d = parseISODate(s.effective_month); return { uid: ++uid, y: d.getFullYear(), m: d.getMonth() + 1, amount: String(Number(s.amount)) }; }),
  };
  const s = salarySummary(e.id);

  const sortRows = () => model.rows.sort((a, b) => (a.y - b.y) || (a.m - b.m));
  const deltaHTML = (i) => {
    const row = model.rows[i], prev = model.rows[i - 1];
    if (!prev) return '<span class="faint">Initial</span>';
    const a = Number(row.amount), pa = Number(prev.amount);
    if (!(a > 0 && pa > 0)) return '<span class="faint">—</span>';
    return pctHTML(((a - pa) / pa) * 100) + `<span class="faint" style="font-size:12px"> vs ${MONTHS[prev.m - 1]} ${prev.y}</span>`;
  };
  const salaryRowsHTML = () => {
    sortRows();
    if (!model.rows.length) return `<div class="empty" style="padding:28px">${icon('wallet')}<span>No salary recorded yet. Add the first entry below.</span></div>`;
    const lastIdx = model.rows.length - 1;
    return model.rows.map((row, i) => {
      const delta = deltaHTML(i);
      const dup = model.rows.some((o) => o !== row && o.y === row.y && o.m === row.m);
      return `<div class="salary-row" data-uid="${row.uid}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${monthYearSelects(`r${row.uid}`, row.y, row.m)}</div>
        <div class="rs"><input class="input ${dup ? 'invalid' : ''}" data-amount="${row.uid}" inputmode="decimal" placeholder="Amount" value="${esc(row.amount)}"></div>
        <div style="font-size:13px" data-delta="${row.uid}">${delta}</div>
        <div>${i === lastIdx ? '<span class="chip green">Current</span>' : ''}${dup ? '<span class="chip red plain">Duplicate month</span>' : ''}</div>
        <button type="button" class="icon-btn" data-remove="${row.uid}" title="Remove entry">${icon('trash')}</button>
      </div>`;
    }).join('');
  };

  const locked = (label, value) => `<div class="field"><label>${label}</label><div class="locked"><span>${esc(value)}</span>${icon('lock')}</div></div>`;

  return {
    title: e.full_name,
    crumbs: `<a href="#/emd">Employee Master Data</a> &nbsp;/&nbsp; Detailed info`,
    actions: `<a class="btn btn-sm" href="#/emd">${icon('arrowLeft', 'sm')}Back to list</a>`,
    html: `
      <div class="card emp-head">
        ${avatar(e, 'lg')}
        <div style="min-width:0"><h2>${esc(e.full_name)}</h2>
          <div class="meta">${empChip(e)}<span>${esc(e.employee_code || 'No EID')}</span><span>·</span><span>${esc(e.designation || 'No designation')}</span></div></div>
        <div class="facts">
          <div><div class="k">Current salary</div><div class="v">${fmtINR(s.latest?.amount)}</div></div>
          <div><div class="k">Last increment</div><div class="v">${s.prev ? `${fmtMonth(s.latest.effective_month)} ${pctHTML(s.pct)}` : '—'}</div></div>
          <div><div class="k">Reporting to</div><div class="v">${esc(mgr?.full_name || '—')}</div></div>
        </div>
      </div>

      ${employmentStatusCard(e)}
      ${kycAdminCard(e)}

      <div class="card">
        <div class="card-head"><div><h3>Personal information</h3><p>Locked — captured at sign-up, KYC and approval.</p></div></div>
        <div class="card-body grid g3">
          ${locked('Name', e.full_name)}${locked('Mail ID', e.email)}${locked('Phone', e.phone || '—')}
          ${locked('Date of joining', fmtDate(e.date_of_joining))}${locked('Date of birth', fmtDate(e.date_of_birth))}
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div><h3>Employment</h3><p>Editable by admin.</p></div></div>
        <div class="card-body grid g3" id="emp-fields">
          <div class="field"><label>Employee ID (EID)</label><input class="input" name="employee_code" placeholder="e.g. AI-0012" value="${esc(model.employee_code)}"></div>
          <div class="field"><label>Designation</label><input class="input" name="designation" placeholder="e.g. Analyst" value="${esc(model.designation)}"></div>
          <div class="field"><label>Reporting manager</label><select class="input" name="manager">${managerOptions(model.manager, e.id)}</select></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><div><h3>Salary</h3><p>Each entry applies from that month until the next revision. The latest month is the current salary.</p></div>
          <div class="right"><button class="btn btn-sm" id="add-salary">${icon('plus', 'sm')}Add revision</button></div></div>
        <div class="salary-row head"><div>Effective from (Month · Year)</div><div>Monthly salary</div><div>Change</div><div></div><div></div></div>
        <div id="salary-rows">${salaryRowsHTML()}</div>
      </div>

      <div class="card">
        <div class="card-head"><div><h3>KYC</h3><p>Submitted by the employee during onboarding${e.approved_at ? ` · approved ${esc(fmtDate(e.approved_at.slice(0, 10)))}` : ''}.</p></div></div>
        <div class="card-body">
          ${kyc ? `<div class="split" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)">
            <div>${docListHTML(kyc)}</div>
            <div class="grid" style="gap:22px">
              <div><div class="section-title">Bank details</div><div class="kv">
                <div><div class="k">Account number</div><div class="v mono">${esc(kyc.bank_account_number)}</div></div>
                <div><div class="k">IFSC</div><div class="v mono">${esc(kyc.bank_ifsc)}</div></div></div></div>
              <div><div class="section-title">Emergency contact</div><div class="kv">
                <div><div class="k">Name</div><div class="v">${esc(kyc.emergency_name)}</div></div>
                <div><div class="k">Relationship</div><div class="v">${esc(kyc.emergency_relationship)}</div></div>
                <div><div class="k">Contact number</div><div class="v">${esc(kyc.emergency_phone)}</div></div></div></div>
            </div></div>` : `<p class="muted">No KYC on file${e.role === 'admin' ? ' (admin account)' : ''}.</p>`}
        </div>
      </div>

      ${logCardHTML(state.fin.log.filter((x) => x.employee_id === e.id), { title: 'Activity log', sub: 'Status, payroll, variable, bonus and loan activity for this employee', showSection: true })}
      <div class="savebar hidden" id="savebar">
        <div class="grow"><b>Unsaved changes</b> <span>— save to update Employee Master Data</span></div>
        <button class="btn btn-sm" id="discard-btn">Discard</button>
        <button class="btn btn-sm btn-light" id="save-btn">${icon('check', 'sm')}Save</button>
      </div>`,
    mount() {
      mountEmploymentStatus(e);
      $('#emd-kyc-review')?.addEventListener('click', (ev) => openKycReview(e.id, ev.currentTarget));
      if (empState(e) === 'fnf') { // read-only after F&F
        $$('#emp-fields input, #emp-fields select, #salary-rows input, #salary-rows select, #salary-rows button, #add-salary').forEach((x) => { x.disabled = true; });
      }
      const markDirty = () => { state.dirty = true; $('#savebar').classList.remove('hidden'); };
      const fields = $('#emp-fields');
      fields.addEventListener('input', (ev) => { if (ev.target.name in model) { model[ev.target.name] = ev.target.value; markDirty(); } });
      fields.addEventListener('change', (ev) => { if (ev.target.name in model) { model[ev.target.name] = ev.target.value; markDirty(); } });

      const rowsEl = $('#salary-rows');
      const redraw = () => { rowsEl.innerHTML = salaryRowsHTML(); };
      rowsEl.addEventListener('input', (ev) => {
        const id = ev.target.dataset.amount;
        if (!id) return;
        model.rows.find((x) => x.uid === Number(id)).amount = ev.target.value.replace(/[^\d.]/g, '');
        ev.target.classList.remove('invalid');
        model.rows.forEach((row, i) => { const c = $(`[data-delta="${row.uid}"]`, rowsEl); if (c) c.innerHTML = deltaHTML(i); });
        markDirty();
      });
      rowsEl.addEventListener('change', (ev) => {
        const t = ev.target;
        if (t.dataset.amount) {
          model.rows.forEach((row, i) => { const c = $(`[data-delta="${row.uid}"]`, rowsEl); if (c) c.innerHTML = deltaHTML(i); });
        } else if (t.dataset.m || t.dataset.y) {
          const id = Number((t.dataset.m || t.dataset.y).slice(1));
          const row = model.rows.find((x) => x.uid === id);
          if (t.dataset.m) row.m = Number(t.value); else row.y = Number(t.value);
          markDirty(); redraw();
        }
      });
      rowsEl.addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-remove]');
        if (!b) return;
        model.rows = model.rows.filter((x) => x.uid !== Number(b.dataset.remove));
        markDirty(); redraw();
      });
      $('#add-salary').addEventListener('click', () => {
        sortRows();
        const last = model.rows[model.rows.length - 1];
        let y, m;
        if (last) { y = last.m === 12 ? last.y + 1 : last.y; m = last.m === 12 ? 1 : last.m + 1; }
        else { const d = parseISODate(e.date_of_joining) || new Date(); y = d.getFullYear(); m = d.getMonth() + 1; }
        const row = { uid: ++uid, y, m, amount: '' };
        model.rows.push(row);
        markDirty(); redraw();
        $(`[data-amount="${row.uid}"]`)?.focus();
      });

      $('#discard-btn').addEventListener('click', () => { state.dirty = false; render(); });
      $('#save-btn').addEventListener('click', async (ev) => {
        const keys = model.rows.map((x) => `${x.y}-${x.m}`);
        if (new Set(keys).size !== keys.length) return toast('Two salary entries have the same month. Remove or change one.', 'error');
        const bad = model.rows.find((x) => !(Number(x.amount) > 0));
        if (bad) { $(`[data-amount="${bad.uid}"]`)?.classList.add('invalid'); return toast('Enter a salary amount for every entry.', 'error'); }
        try {
          await withBusy(ev.currentTarget, 'Saving…', () => api.rpc('admin_save_employee', {
            p_user: e.id,
            p_employee_code: model.employee_code.trim() || null,
            p_designation: model.designation.trim() || null,
            p_manager: model.manager || null,
            p_salaries: model.rows.map((x) => ({ month: monthStart(x.y, x.m), amount: Number(x.amount) })),
          }));
          state.dirty = false;
          toast('Employee details saved.');
          await refreshAdmin();
        } catch (err) { toast(friendlyError(err), 'error'); }
      });
    },
  };
}

   PAYROLL (Module 3) — attendance upload, mapping, day-wise calculation
   ===================================================================== */
const DEFAULT_RULES = { weekday_full_minutes: 540, saturday_full_minutes: 300, sunday_paid_off: true };
const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const ST_LABEL = { F: 'F', HD: 'HD', L: 'L', WO: 'WO', MP: 'MP', MPH: 'HD', NA: '—', H: 'H', WFH: 'WFH' };
const ST_TITLE = {
  F: 'Full day', HD: 'Half day — worked less than the full-day hours', L: 'Leave — no punch in or out',
  WO: 'Weekly off (Sunday)', MP: 'Missed punch — counted as a full day', MPH: 'Half day — every 3rd missed punch',
  H: 'Holiday — paid as a full day', WFH: 'Work from home — no punches, paid as a full day',
  NA: 'Before date of joining — not counted',
};
const SYSTEM_TO_FINAL = { F: 'F', MP: 'F', HD: 'HD', MPH: 'HD', L: 'L', WO: 'WO', NA: 'NA', H: 'H', WFH: 'WFH' };
const XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

state.payroll = { runs: null, runId: null, data: null, codeMap: null, rules: null };

// Supabase returns at most 1,000 rows per request, so page through.
async function fetchAll(build, pageSize = 1000) {
  const out = [];
  for (let from = 0; ; from += pageSize) {
    const rows = await q(build().range(from, from + pageSize - 1));
    out.push(...rows);
    if (rows.length < pageSize) return out;
  }
}

const payrollApi = {
  runs: () => q(db.from('payroll_runs').select('*').is('superseded_at', null).order('month', { ascending: false })),
  punches: (runId) => fetchAll(() => db.from('attendance_punches')
    .select('emp_code, emp_name, work_date, day_label, punch_in, punch_out').eq('run_id', runId).order('id')),
  adjustments: (runId) => fetchAll(() => db.from('attendance_adjustments')
    .select('emp_code, work_date, final_status').eq('run_id', runId).order('work_date')),
  results: (runId) => fetchAll(() => db.from('payroll_results').select('*').eq('run_id', runId).eq('included', true).order('emp_code')),
  calendar: () => fetchAll(() => db.from('calendar_days').select('*').is('removed_at', null).order('day')),
  wfh: () => fetchAll(() => db.from('wfh_days').select('*').neq('status', 'withdrawn').order('work_date', { ascending: false })),
  leaves: () => fetchAll(() => db.from('leave_records').select('*').is('removed_at', null).order('leave_date', { ascending: false })),
  queries: (runId) => fetchAll(() => db.from('payroll_queries').select('*').eq('run_id', runId).order('created_at')),
  codeMap: () => fetchAll(() => db.from('attendance_code_map').select('*').order('emp_code')),
  rules: async () => {
    const row = await q(db.from('app_settings').select('value').eq('key', 'attendance_rules').maybeSingle());
    return { ...DEFAULT_RULES, ...(row?.value || {}) };
  },
  pt: async () => {
    const row = await q(db.from('app_settings').select('value').eq('key', 'professional_tax').maybeSingle());
    return row?.value?.slabs ? row.value : DEFAULT_PT;
  },

/* Builds every day of the month for one employee.
   Rules: both punches and ≥ full-day hours → F; both but shorter → HD;
   one punch missing → missed punch (every 3rd one is a half day, the rest
   count as full days); no punches → L; Sunday → weekly off. */
// extras.cal: date → calendar entry (holiday / time relaxation); extras.wfh: date → recorded WFH entry;
// extras.leave: date → entry in the Leaves register (full / half day)
function computeAttendance(rows, monthIso, rules, adjustments, dojFromEmd, lwd = null, extras = {}) {
  const byDate = new Map(rows.map((r) => [r.work_date, r]));
  // Staff added to the HRMS after they actually joined have a later joining date
  // in EMD than their first punch; their punches win.
  const dojIgnored = !!dojFromEmd && rows.some((r) => r.work_date < dojFromEmd && (r.punch_in || r.punch_out));
  const doj = dojIgnored ? null : dojFromEmd;
  const base = parseISODate(monthIso);
  const days = [];
  let misses = 0;
  for (let i = 1; i <= daysInMonth(monthIso); i++) {
    const iso = `${base.getFullYear()}-${pad(base.getMonth() + 1)}-${pad(i)}`;
    const wd = new Date(base.getFullYear(), base.getMonth(), i).getDay();
    const r = byDate.get(iso);
    const inM = timeToMin(r?.punch_in);
    const rawOut = timeToMin(r?.punch_out);
    const outM = inM != null && rawOut === inM ? null : rawOut; // the same time twice is a single punch
    const cal = extras.cal?.get(iso) || null;
    const wfh = extras.wfh?.get(iso) || null;
    const leave = extras.leave?.get(iso) || null;
    // WFH an admin added or confirmed counts even if there are punches; an employee's own only replaces a no-punch day
    const wfhByAdmin = !!wfh && ((wfh.added_by && wfh.added_by !== wfh.employee_id) || (wfh.decided_by && wfh.decided_by !== wfh.employee_id));
    // A time-relaxation day has its own (shorter) full-day hours
    const need = cal?.kind === 'relaxation' ? Number(cal.full_minutes) : wd === 6 ? rules.saturday_full_minutes : rules.weekday_full_minutes;
    let mins = null, sys, missNo = null;
    if ((doj && iso < doj) || (lwd && iso > lwd)) sys = 'NA'; // before joining / after the last working day
    else if (wd === 0) sys = 'WO';
    else if (cal?.kind === 'holiday') sys = 'H'; // Monday–Saturday holiday: paid full day
    else if (inM != null && outM != null) {
      mins = outM - inM;
      if (mins < 0) mins += 1440; // overnight shift
      sys = mins >= need ? 'F' : 'HD';
    } else if (inM != null || outM != null) {
      misses += 1; missNo = misses;

    } else sys = 'L';

    if (['F', 'HD', 'L', 'MP', 'MPH'].includes(sys)) {

      inM, outM, mins, need, sys, missNo, editable, systemFinal, saved: adj, final: adj || systemFinal,

function payrollSheet() {
  const P = state.payroll;
  const run = currentRun();
  if (!run || !P.data) return { run, mapped: [], unmapped: [], exited: [], left: [], groups: [] };
  const groups = groupPunches(P.data.punches);
  const map = codeMapIndex();
  const leftCodes = leftCodeSet();
  const adjByCode = new Map();
  for (const a of P.data.adjustments) {
    if (!a.final_status) continue;
    if (!adjByCode.has(a.emp_code)) adjByCode.set(a.emp_code, new Map());
    adjByCode.get(a.emp_code).set(a.work_date, a.final_status);
  }
  const cal = calendarIndex();
  const wfhByEmp = new Map();
  for (const w of P.wfh || []) {
    if (w.status !== 'recorded') continue;
    if (!wfhByEmp.has(w.employee_id)) wfhByEmp.set(w.employee_id, new Map());
    wfhByEmp.get(w.employee_id).set(w.work_date, w);
  }
  const leaveByEmp = new Map();
  for (const l of P.leaves || []) {
    if (!leaveByEmp.has(l.employee_id)) leaveByEmp.set(l.employee_id, new Map());

  }
  const queriesByEmp = new Map();
  for (const x of P.data.queries || []) {

    queriesByEmp.get(x.employee_id).push(x);
  }
  const mapped = [], unmapped = [], exited = [], left = [];
  for (const g of groups) {
    if (leftCodes.has(g.code)) { left.push(g); continue; } // marked as left — not in payroll
    const emp = byId(map.get(g.code));
    if (emp?.fnf_completed_at) { exited.push({ g, emp }); continue; } // journey ended — not channelled
    if (!emp) { unmapped.push(g); continue; }
    const days = computeAttendance(g.rows, run.month, P.rules, adjByCode.get(g.code) || new Map(), emp.date_of_joining, emp.exit_date,
      { cal, wfh: wfhByEmp.get(emp.id), leave: leaveByEmp.get(emp.id) });
    const queries = queriesByEmp.get(emp.id) || [];
    const pre = tally(days, 'system');
    const post = tally(days, 'final');
    const sal = salaryForMonth(emp.id, run.month);
    const salary = sal ? sal.amount : null;
    const notes = [];
    if (days.dojIgnored) notes.push(`Date of joining in Employee Master Data is ${fmtDate(emp.date_of_joining)}, but the sheet has punches before it — it is ignored for ${fmtMonth(run.month)}. Correct the date of joining if it is wrong.`);
    if (days.punchAfterLwd) notes.push(`The sheet has punches after the last working day (${fmtDMY(emp.exit_date)}) — those days are not counted. Correct the last working day in Employee Master Data if it is wrong.`);
    if (sal?.fallback) notes.push(`No salary entry covers ${fmtMonth(run.month)} — using ${fmtINR(sal.amount)} from ${fmtMonth(sal.from)}. Add the right salary month in Employee Master Data if needed.`);
    const check = idCheck(g.code, emp);
    if (check && !check.ok) notes.unshift(`EmpCode in the sheet is ${g.code}, but ${check.text.replace('ID mismatch — EMD has', 'the Employee ID in EMD is')}. Check the mapping.`);
    const pay = payFor(post, salary, P.rules);
    const pt = salary ? ptFor(salary) : 0;
    mapped.push({ g, emp, days, pre, post, salary, notes, rt: isRT(emp), idOk: !check || check.ok, queries, openQueries: queries.filter((x) => x.status === 'open').length, prePay: payFor(pre, salary, P.rules), ...pay, pt, net: Math.max(0, pay.payable - pt) });
  }
  mapped.sort((a, b) => a.emp.full_name.localeCompare(b.emp.full_name));

}

const COL_ALIASES = {
  code: ['empcode', 'employeecode', 'ecode', 'empid', 'employeeid', 'empno', 'employeeno', 'code', 'cardno', 'staffcode'],
  name: ['name', 'empname', 'employeename', 'employee', 'staffname'],
  date: ['date', 'attdate', 'attendancedate', 'punchdate', 'workdate'],
  day: ['day', 'weekday', 'dayname'],
  in: ['in', 'intime', 'punchin', 'checkin', 'timein', 'firstin', 'inpunch'],
  out: ['out', 'outtime', 'punchout', 'checkout', 'timeout', 'lastout', 'outpunch'],

const MONTH_IDX = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
const isoOf = (y, m, d) => {
  if (y < 100) y += 2000;

function parseSheetDate(v) {

  }

    let d = +m[1], mo = +m[2];

  if ((m = s.match(/^([A-Za-z]{3,})\s+(\d{1,2}),?\s+(\d{4})/))) {

      "Date | Day | Shift | IN | Out1 | In2 | … | In8 | Out", then one row per date.
      IN is the first punch of the day and the last "Out" column the final one.
   2. One table with an EmpCode column on every row:
      EmpCode | Name | Date | Day | IN | OUT. */
function extractAttendance(rows) {
  const norm = (v) => String(v ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const blank = (v) => String(v ?? '').trim() === '';

  const nextValue = (row, idx) => { for (let j = idx + 1; j < row.length; j++) if (!blank(row[j])) return cellText(row[j]); return ''; };
  const findCol = (cells, names) => { for (const n of names) { const i = cells.indexOf(n); if (i >= 0) return i; } return -1; };
  const detectHeader = (cells) => {
    const date = findCol(cells, COL_ALIASES.date);
    const inC = findCol(cells, COL_ALIASES.in);
    const outC = findCol(cells, COL_ALIASES.out);
    if (date < 0 || (inC < 0 && outC < 0)) return null;
    const code = findCol(cells, COL_ALIASES.code);
    const name = findCol(cells, COL_ALIASES.name);
    const day = findCol(cells, COL_ALIASES.day);
    // every punch column in order (IN, Out1, In2, …, Out) for multi-punch exports
    const punches = cells.map((c, i) => (/^(in|out)\d*$/.test(c) || i === inC || i === outC ? i : -1)).filter((i) => i >= 0);
    return { date, in: inC, out: outC, code: code >= 0 ? code : null, name: name >= 0 ? name : null, day: day >= 0 ? day : null, punches };
  };

  const out = [];

    if (!row || row.every(blank)) continue;
    const cells = row.map(norm);
    const header = detectHeader(cells);
    if (header) { col = header; continue; }
    // "Empcode 0003 … Name Sayan" block label row
    const codeLabel = findCol(cells, COL_ALIASES.code);
    if (codeLabel >= 0 && !parseSheetDate(row[0])) {
      blockCode = nextValue(row, codeLabel);
      const nameLabel = cells.findIndex((c, j) => j > codeLabel && COL_ALIASES.name.includes(c));

      continue;

      // only rows with an unreadable date are reported as skipped
      if (/\d/.test(cellText(row[col.date])) && col.punches.some((i) => parseSheetTime(row[i]))) skipped += 1;
      continue;
    }

    if (col.code != null) {
      code = cellText(row[col.code]);

    const times = col.punches.map((i) => parseSheetTime(row[i]));
    const valid = times.filter(Boolean);
    let punchIn = col.in >= 0 ? parseSheetTime(row[col.in]) : null;
    let punchOut = col.out >= 0 ? parseSheetTime(row[col.out]) : null;
    if (!punchIn && valid.length && col.punches.length > 2) punchIn = valid[0];
    if (!punchOut && valid.length > 1 && col.punches.length > 2) punchOut = valid[valid.length - 1];
    out.push({
      emp_code: code, emp_name: name, work_date: date,
      day_label: col.day != null ? cellText(row[col.day]).slice(0, 12) : '',

async function parseAttendanceFile(file) {
  await loadXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  let best = null;
  for (const sheetName of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true, defval: '' });

    if (res && (!best || res.rows.length > best.rows.length)) best = { ...res, sheetName };
  }
  if (best) return best;
  throw new Error('Could not find attendance in this file. Expected an "Empcode … Name" row with a "Date | Day | IN | … | Out" table under it, or the columns EmpCode, Name, Date, Day, IN and OUT.');
}

  const [gy, gm] = guess.split('-').map(Number);
  const summarize = (monthIso) => {
    const key = monthIso.slice(0, 7);
    const rows = parsed.rows.filter((r) => r.work_date.startsWith(key));
    const emps = groupPunches(rows);
    const dates = rows.map((r) => r.work_date).sort();
    return { rows, emps, outside: parsed.rows.length - rows.length, first: dates[0], last: dates[dates.length - 1] };
  };
  const { el, close } = openModal({
    title: 'Upload attendance', size: 'md',
    subtitle: `${esc(file.name)} · sheet “${esc(parsed.sheetName)}” · the file itself is not stored`,
    body: `<div class="field" style="margin-bottom:16px"><label>Payroll month</label>
             <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:280px">${monthYearSelects('imp', gy, gm)}</div></div>
           <div id="imp-summary"></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-save>${icon('upload', 'sm')}Save attendance</button>`,
  });
  const monthIso = () => monthStart($('[data-y="imp"]', el).value, Number($('[data-m="imp"]', el).value));
  const draw = () => {
    const s = summarize(monthIso());
    const existing = state.payroll.runs?.find((r) => r.month === monthIso());
    $('#imp-summary', el).innerHTML = `
      <div class="kv" style="margin-bottom:14px">
        <div><div class="k">Employees</div><div class="v">${s.emps.length}</div></div>
        <div><div class="k">Attendance rows</div><div class="v">${s.rows.length}</div></div>
        <div><div class="k">Dates</div><div class="v">${s.first ? `${fmtDate(s.first)} – ${fmtDate(s.last)}` : '—'}</div></div>
        <div><div class="k">Skipped rows</div><div class="v">${parsed.skipped + s.outside}</div></div>
      </div>
      ${s.outside ? `<div class="alert alert-warn" style="margin-bottom:10px">${icon('alert')}<span>${s.outside} row(s) fall outside ${fmtMonth(monthIso())} and will be left out.</span></div>` : ''}
      ${existing ? `<div class="alert alert-warn" style="margin-bottom:10px">${icon('alert')}<span>${fmtMonth(monthIso())} already has an upload (${esc(existing.source_file_name || 'file')}). Saving replaces it; your day-wise changes are carried over and the old upload is kept in history.</span></div>` : ''}
      ${s.emps.length ? `<div class="table-wrap" style="max-height:220px;border:1px solid var(--border);border-radius:10px"><table class="table">
        <thead><tr><th>EmpCode</th><th>Name in sheet</th><th class="num">Days</th><th class="num">Days with punches</th></tr></thead><tbody>
        ${s.emps.map((g) => `<tr><td class="mono">${esc(g.code)}</td><td>${esc(g.name || '—')}</td><td class="num">${g.rows.length}</td>
          <td class="num">${g.rows.filter((r) => r.punch_in || r.punch_out).length}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="alert alert-error">${icon('alert')}<span>No rows for ${fmtMonth(monthIso())}. Pick the month the sheet is for.</span></div>`}`;
    $('[data-save]', el).disabled = !s.rows.length;
  };
  $$('[data-m="imp"], [data-y="imp"]', el).forEach((sel) => sel.addEventListener('change', draw));
  draw();
  $('[data-save]', el).addEventListener('click', async (e) => {
    const month = monthIso();
    const { rows } = summarize(month);
    try {
      const runId = await withBusy(e.currentTarget, 'Saving…', () => api.rpc('admin_import_attendance', { p_month: month, p_file_name: file.name, p_rows: rows }));
      close();
      archiveUpload('Attendance', file);
      state.payroll.runId = runId;
      await ensurePayroll({ reload: true });
      const unmapped = payrollSheet().unmapped.length;
      toast(`Attendance for ${fmtMonth(month)} saved.${unmapped ? ` ${unmapped} employee(s) need mapping.` : ''}`);
      go(unmapped ? '#/payroll/mapping' : '#/payroll');
    } catch (err) { toast(friendlyError(err), 'error'); }
  });
}

/* ---------- Payroll page ---------- */
function payrollTabs(active) {
  const tabs = [['calc', '#/payroll', 'Salary Calculation'], ['mapping', '#/payroll/mapping', 'Mapping'], ['rules', '#/payroll/rules', 'Working Hours'], ['pt', '#/payroll/pt', 'Professional Tax']];
  return `<div><nav class="tabs">${tabs.map(([k, href, l]) => `<a href="${href}" class="${k === active ? 'active' : ''}">${l}</a>`).join('')}</nav></div>`;
}
function payrollActions() {
  const P = state.payroll;
  const runSelect = P.runs.length
    ? `<select class="input" id="run-select" style="height:34px;width:auto;min-width:150px" title="Payroll month">
        ${P.runs.map((r) => `<option value="${r.id}" ${r.id === P.runId ? 'selected' : ''}>${fmtMonth(r.month)}</option>`).join('')}</select>`
    : '';
  return `<a class="btn btn-sm btn-ghost" href="#/rules/payroll" title="Rules and formulas">${icon('info', 'sm')}Rules</a>${runSelect}${P.runs.length ? `<button class="btn btn-sm" id="payroll-summary">${icon('grid', 'sm')}Summary</button>` : ''}<button class="btn btn-sm btn-primary" id="upload-att">${icon('upload', 'sm')}Upload attendance</button>`;
}
function mountPayrollActions() {
  $('#upload-att')?.addEventListener('click', pickAttendanceFile);
  $('#payroll-summary')?.addEventListener('click', openPayrollSummary);
  $('#run-select')?.addEventListener('change', async (e) => {
    state.payroll.runId = e.target.value;
    render();
  });
}
const rulesSummary = (r) => `Full day: Mon–Fri ${fmtDuration(r.weekday_full_minutes)} · Sat ${fmtDuration(r.saturday_full_minutes)} · Sunday ${r.sunday_paid_off ? 'paid weekly off' : 'unpaid weekly off'}`;

async function pagePayroll(r) {
  await ensurePayroll();
  if (r.id === 'emp') return pagePayrollEmployee(r.sub);
  if (r.id === 'mapping') return pagePayrollMapping();
  if (r.id === 'rules') return pagePayrollRules();
  if (r.id === 'pt') return pagePayrollPt();
  if (r.id === 'holidays') { location.replace('#/holidays'); return pageHolidays(); }
  if (r.id === 'wfh') { location.replace('#/wfh'); return pageAdminWfh(); }
  return pagePayrollCalc();
}

function noRunState() {
  return `<div class="card">${emptyState('upload', 'No attendance uploaded yet',
    'Upload the month’s attendance export from the biometric system (.xlsx) — the “Raw Sheet” with an <b>Empcode · Name</b> block per employee and <b>Date · Day · IN … Out</b> rows — or any sheet with the columns <b>EmpCode · Name · Date · Day · IN · OUT</b>.')}
    <div style="display:flex;justify-content:center;padding-bottom:28px"><button class="btn btn-primary" id="upload-att-empty">${icon('upload', 'sm')}Upload attendance</button></div></div>`;
}

async function pagePayrollCalc() {
  const P = state.payroll;
  const { run, mapped, unmapped, groups, exited, left } = payrollSheet();
  const base = { title: 'Payroll', crumbs: 'Monthly salary calculation from attendance', actions: payrollActions() };
  if (!run) {
    return { ...base, html: payrollTabs('calc') + noRunState(), mount() { mountPayrollActions(); $('#upload-att-empty')?.addEventListener('click', pickAttendanceFile); } };
  }
  const saved = new Map(P.data.results.map((x) => [x.employee_id, x]));
  const changed = run.processed_at && mapped.some((m) => !saved.has(m.emp.id) || Number(saved.get(m.emp.id).payable) !== m.payable || Number(saved.get(m.emp.id).pt) !== m.pt);
  const total = mapped.reduce((s, m) => s + m.payable, 0);
  const totalPt = mapped.reduce((s, m) => s + m.pt, 0);
  const totalNet = mapped.reduce((s, m) => s + m.net, 0);
  const noSalary = mapped.filter((m) => m.salary == null);
  const rtAll = state.admin.profiles.filter(isRT).sort((a, b) => String(a.exit_date).localeCompare(String(b.exit_date)));
  const seg = state.payrollSeg === 'rt' ? 'rt' : 'active';
  const openQ = mapped.filter((m) => m.openQueries);
  return {
    ...base,
    html: `${payrollTabs('calc')}
      <div class="stats">
        <div class="card stat"><div class="top"><span>Month</span><span class="ico" style="background:var(--accent-soft);color:var(--accent)">${icon('calendar')}</span></div>
          <div class="value">${fmtMonth(run.month)}</div><div class="foot" title="${esc(fmtDateTime(run.uploaded_at))}">${esc(run.source_file_name || 'Uploaded sheet')} · ${fmtRelative(run.uploaded_at)}</div></div>
        <div class="card stat"><div class="top"><span>Employees in sheet</span><span class="ico" style="background:var(--blue-soft);color:var(--blue)">${icon('users')}</span></div>
          <div class="value">${groups.length}</div><div class="foot">${mapped.length} mapped · ${unmapped.length} not mapped${left.length ? ` · ${left.length} left` : ''}${exited.length ? ` · ${exited.length} F&F done` : ''}</div></div>
        <div class="card stat"><div class="top"><span>Total net payable</span><span class="ico" style="background:var(--green-soft);color:var(--green)">${icon('wallet')}</span></div>
          <div class="value">${fmtINR(totalNet)}</div><div class="foot">${fmtINR(total)} earned − ${fmtINR(totalPt)} PT</div></div>
        <div class="card stat"><div class="top"><span>Payroll status</span><span class="ico" style="background:var(--violet-soft);color:var(--violet)">${icon('fileCheck')}</span></div>
          <div class="value">${run.processed_at ? (changed ? '<span class="chip amber">Changed since save</span>' : run.pushed_at ? '<span class="chip green">Pushed to employees</span>' : '<span class="chip green">Saved</span>') : '<span class="chip gray">Not saved</span>'}</div>
          <div class="foot">${run.pushed_at ? `Pushed ${fmtRelative(run.last_pushed_at || run.pushed_at)} · queries ${queryUntil(run) > new Date() ? `open until ${fmtDateTime(queryUntil(run))}` : 'closed'}`
            : run.processed_at ? `Saved ${fmtRelative(run.processed_at)} · not pushed yet` : 'Review, then save & push the payroll'}</div></div>
      </div>
      ${openQ.length ? `<div class="alert alert-error">${icon('alert')}<span><b>${openQ.reduce((n, m) => n + m.openQueries, 0)} open salary ${openQ.reduce((n, m) => n + m.openQueries, 0) === 1 ? 'query' : 'queries'}</b> from ${openQ.map((m) => `<a href="#/payroll/emp/${encodeURIComponent(m.g.code)}">${esc(m.emp.full_name)}</a>`).join(', ')} — highlighted below. Open the person, change the day if needed, mark the query, then <b>Save &amp; push</b> again.</span></div>` : ''}
      ${unmapped.length ? `<div class="alert alert-warn">${icon('alert')}<span><b>${unmapped.length} employee(s) in the sheet are not mapped</b> to Employee Master Data, so they are not in the calculation. <a href="#/payroll/mapping">Map them</a>, or mark people who have left as <b>Left / resigned</b>.</span></div>` : ''}
      ${noSalary.length ? `<div class="alert alert-warn">${icon('alert')}<span>No salary in Employee Master Data for: ${noSalary.map((m) => esc(m.emp.full_name)).join(', ')}. Their payable shows ₹0 and they are left out when saving.</span></div>` : ''}
      <div class="card">
        <div class="card-head"><div><h3>Salary calculation — ${fmtMonth(run.month)}</h3></div>
          <div class="right"><button class="btn btn-sm" id="export-payroll" ${mapped.length ? '' : 'disabled'}>${icon('download', 'sm')}Export CSV</button>
          <button class="btn btn-sm" id="save-payroll" ${mapped.length ? '' : 'disabled'}>${icon('check', 'sm')}Save payroll</button>
          <button class="btn btn-sm" id="slips-payroll" ${P.data.results.length ? '' : 'disabled title="Save the payroll first"'}>${icon('file', 'sm')}Salary slips</button>
          <button class="btn btn-sm btn-primary" id="push-payroll" ${mapped.length ? '' : 'disabled'} title="Save, then publish each employee’s final day-wise sheet in their portal">${icon('upload', 'sm')}Save &amp; push</button></div></div>
        ${mapped.length ? '' : emptyState('users', 'No mapped employees yet', 'Map the sheet’s EmpCodes to employees in the <a href="#/payroll/mapping">Mapping</a> tab.')}
      </div>
      <div><nav class="tabs" id="pay-seg">
        <a href="#/payroll" data-seg="active" class="${seg === 'active' ? 'active' : ''}">Active<span class="count">${mapped.filter((m) => !m.rt).length}</span></a>
        <a href="#/payroll" data-seg="rt" class="${seg === 'rt' ? 'active' : ''}">Resigned & Terminated<span class="count">${rtAll.length}</span></a></nav></div>
      ${seg === 'active' ? (mapped.length ? payrollSectionHTML('Active', 'Working employees, including those on notice period', mapped.filter((m) => !m.rt)) : '')
        : rtSectionHTML(run, mapped, rtAll)}
      ${exited.length ? `<p class="muted" style="font-size:12.5px">${exited.length} employee(s) in this sheet have F&F completed and are not included: ${exited.map((x) => esc(x.emp.full_name)).join(', ')}.</p>` : ''}`,
    mount() {
      mountPayrollActions();
      $$('#pay-seg [data-seg]').forEach((a) => a.addEventListener('click', (ev) => { ev.preventDefault(); state.payrollSeg = a.dataset.seg; render(); }));
      $$('.pay-table tbody').forEach((tb) => tb.addEventListener('click', (ev) => {
        const tr = ev.target.closest('tr[data-href]');
        if (tr && !ev.target.closest('a, button')) location.hash = tr.dataset.href;
      }));
      $$('[data-fnf]').forEach((b) => b.addEventListener('click', () => completeFnf(byId(b.dataset.fnf))));
      $('#export-payroll')?.addEventListener('click', () => exportPayrollCsv(run, mapped));
      $('#slips-payroll')?.addEventListener('click', (ev) => withBusy(ev.currentTarget, '', () => openSalarySlips(run, P.data.results).catch((e) => toast(friendlyError(e), 'error'))));
      const results = () => mapped.filter((m) => m.salary != null).map((m) => ({
        employee_id: m.emp.id, emp_code: m.g.code, monthly_salary: m.salary, daily_salary: Number(m.daily.toFixed(4)),
        pre_full: m.pre.F, pre_half: m.pre.HD, pre_leave: m.pre.L, pre_weekly_off: m.pre.WO,
        post_full: m.post.F, post_half: m.post.HD, post_leave: m.post.L, post_weekly_off: m.post.WO, payable: m.payable,
        pt: m.pt, net_payable: m.net,
      }));
      $('#save-payroll')?.addEventListener('click', async (ev) => {
        const res = results();
        try {
          await withBusy(ev.currentTarget, 'Saving…', () => api.rpc('admin_save_payroll', { p_run: run.id, p_results: res, p_rules: P.rules }));
          const finals = new Map(mapped.map((m) => [m.emp.id, new Map(m.days.map((d) => [d.iso, d.final]))]));
          await autoResolveQueries(P.data.queries || [], (emp, iso) => finals.get(emp)?.get(iso)).catch(() => 0);
          toast(`Payroll for ${fmtMonth(run.month)} saved — ${res.length} employee(s), net ${fmtINR(res.reduce((s, x) => s + x.net_payable, 0))}.${run.pushed_at ? ' Push again so employees see the changes.' : ''}`);
          await ensurePayroll({ reload: true });
          render();
        } catch (err) { toast(friendlyError(err), 'error'); }
      });
      $('#push-payroll')?.addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        const res = results();
        const until = run.pushed_at ? queryUntil(run) : new Date(Date.now() + QUERY_HOURS * 3600e3);
        const ok = await confirmDialog({
          title: run.pushed_at ? `Push ${fmtMonth(run.month)} again?` : `Save & push ${fmtMonth(run.month)}?`,
          message: `The final day-wise salary sheet of <b>${res.length}</b> employee(s) is saved and shown in their portal, matched by Employee ID. They can’t edit it.
            <br><br>Employees can ask about a <b>Leave</b> or <b>Half day</b> on a specific date until <b>${esc(fmtDateTime(until))}</b> (${QUERY_HOURS} hours from the first push)${run.pushed_at ? ' — pushing again does not reopen that window' : ''}. You can change days at any time.`,
          confirmText: run.pushed_at ? 'Push again' : 'Save & push',
        });
        if (!ok) return;
        const days = mapped.filter((m) => m.salary != null).map((m) => ({ employee_id: m.emp.id, days: m.days.map(daySnapshot) }));
        try {
          await withBusy(btn, 'Pushing…', async () => {
            await api.rpc('admin_save_payroll', { p_run: run.id, p_results: res, p_rules: P.rules });
            await api.rpc('admin_push_payroll', { p_run: run.id, p_days: days });
          });
          toast(`${fmtMonth(run.month)} pushed to ${days.length} employee(s).`);
          await ensurePayroll({ reload: true });
          render();
        } catch (err) { toast(friendlyError(err), 'error'); }
      });
    },
  };
}

// What an employee sees for one day of their published sheet
const daySnapshot = (d) => ({
  date: d.iso, day: d.dayLabel, in: d.inM == null ? null : fmtClock(d.in), out: d.outM == null ? null : fmtClock(d.out), mins: d.mins, need: d.need,
  status: d.final, label: d.leave && (d.final === 'L' || d.final === 'HD') && d.final === d.systemFinal ? `${d.leave.kind === 'half' ? 'Half-day leave' : 'Leave'}${d.leave.note ? ` — ${d.leave.note}` : ''}` : d.cal ? `${d.cal.description}${d.cal.kind === 'relaxation' ? ` — full day ${fmtHM(d.cal.full_minutes)}` : ''}` : d.final === 'WFH' ? `WFH${d.wfh?.note ? ` — ${d.wfh.note}` : ''}` : null,
});

        <td class="num nowrap">${m.pt ? `− ${fmtINR(m.pt)}` : '—'}</td>
        <td class="num nowrap"><b style="color:var(--text)">${fmtINR(m.net)}</b></td>
</tr>`).join('')}
      </tbody>
      <tfoot><tr><td colspan="10" style="text-align:right;font-weight:600">Total</td><td class="num nowrap">${fmtINR(t.earned)}</td><td class="num nowrap">− ${fmtINR(t.pt)}</td><td class="num nowrap"><b style="color:var(--text)">${fmtINR(t.net)}</b></td></tr></tfoot>
    </table></div>` : emptyState('users', 'No one here', 'Nobody in this section for this month.')}
  </div>`;

// Resigned & Terminated: everyone in R&T stays here (whatever the month) until F&F,
// with the last working day highlighted and F&F due 60 days after it.

  const byEmp = new Map(mapped.map((m) => [m.emp.id, m]));
  const inMonth = (iso) => iso && iso.slice(0, 7) === run.month.slice(0, 7);
  const t = people.reduce((a, p) => { const m = byEmp.get(p.id); return m ? { earned: a.earned + m.payable, pt: a.pt + m.pt, net: a.net + m.net } : a; }, { earned: 0, pt: 0, net: 0 });
  return `<div class="card">
    <div class="card-head"><div><h3>Resigned & Terminated <span class="chip plain gray" style="margin-left:6px">${people.length}</span></h3><p>Until F&F — settle by date shown</p></div>
      <div class="right"><b class="nowrap">${fmtINR(t.net)}</b><span class="muted" style="font-size:12.5px">net in ${fmtMonth(run.month)}</span></div></div>
    ${people.length ? `<div class="table-wrap"><table class="table compact pay-table rt-table">
      <thead>
        <tr><th rowspan="2">Employee</th><th rowspan="2">Last working day</th><th rowspan="2">F&F settlement</th><th rowspan="2" class="num">Monthly salary</th>
          <th colspan="3" class="grp">Final — ${fmtMonth(run.month)}</th><th rowspan="2" class="num">Net payable</th><th rowspan="2"></th></tr>
        <tr><th class="num">F</th><th class="num">HD</th><th class="num">L</th></tr>
      </thead>
      <tbody>${people.map((p) => {
        const m = byEmp.get(p.id);
        const check = m ? `#/payroll/emp/${encodeURIComponent(m.g.code)}` : `#/emd/${p.id}`;
        return `<tr data-href="${check}" class="${m?.openQueries ? 'q-row' : ''}">
        <td><div class="name-line"><a href="${check}" class="plain-link">${person(p, esc(p.employee_code || 'No EID'))}</a>${empChip(p)}${m?.openQueries ? `<span class="chip red plain">${m.openQueries} ${m.openQueries === 1 ? 'query' : 'queries'}</span>` : ''}</div></td>
        <td class="nowrap">${lwdChip(p)}${inMonth(p.exit_date) ? '<div class="faint" style="font-size:11.5px;margin-top:3px">in this month</div>' : ''}</td>
        <td class="nowrap">${settleChip(p)}</td>
        ${m ? `<td class="num">${m.salary == null ? '<span class="chip amber plain">Not set</span>' : fmtINR(m.salary)}</td>
          <td class="num">${m.post.F}</td><td class="num">${m.post.HD}</td><td class="num">${m.post.L}</td>
          <td class="num nowrap"><b style="color:var(--text)">${fmtINR(m.net)}</b><div class="faint" style="font-size:11.5px">${fmtINR(m.payable)} − PT ${fmtINR(m.pt)}</div></td>`
        : `<td colspan="5" class="muted" style="text-align:center;font-size:12.5px">Not in the ${fmtMonth(run.month)} attendance sheet</td>`}
        <td class="actions nowrap"><div class="row-actions"><a class="btn btn-sm" href="${check}" title="${m ? 'Day-wise attendance' : 'Employee details'}">${icon('eye', 'sm')}Check</a>
          <button class="btn btn-sm btn-primary" data-fnf="${p.id}" title="Full & final settlement done — end their journey">F&F</button></div></td></tr>`;
      }).join('')}</tbody>
    </table></div>` : emptyState('users', 'No one in Resigned & Terminated', 'Mark an employee Resigned or Terminated in Employee Master Data → Show detailed info → Status.')}
  </div>`;
}

// Name | FD | HD | HD-PM | Leave — pre (system) and post (final) for every employee in the month
function openPayrollSummary() {
  const { run, mapped } = payrollSheet();
  if (!run) return;
  const counts = (days, which) => {
    const c = { FD: 0, HD: 0, HDPM: 0, L: 0 };
    for (const d of days) {
      const st = which === 'pre' ? SYSTEM_TO_FINAL[d.sys] : d.final;
      if (st === 'F' || st === 'H' || st === 'WFH') c.FD += 1;
      else if (st === 'L') c.L += 1;
      else if (st === 'HD') c[d.sys === 'MPH' ? 'HDPM' : 'HD'] += 1;
    }
    return c;
  };
  const rows = mapped.map((m) => ({ m, pre: counts(m.days, 'pre'), post: counts(m.days, 'post') }));
  const tds = (c, diff) => ['FD', 'HD', 'HDPM', 'L'].map((k) => `<td class="num ${diff ? 'post-c' : 'pre-c'} ${diff && diff[k] !== c[k] ? 'diff' : ''}">${c[k]}</td>`).join('');
  const section = (label, list) => (list.length ? `<tr class="sum-sec"><td colspan="10">${label} · ${list.length} · ${fmtINR(list.reduce((t, r) => t + r.m.net, 0))}</td></tr>` + list.map((r) => `<tr>
      <td class="nowrap"><a href="#/payroll/emp/${encodeURIComponent(r.m.g.code)}" data-close-link>${esc(r.m.emp.full_name)}</a> <span class="faint" style="font-size:11.5px">${esc(r.m.emp.employee_code || r.m.g.code)}</span></td>
      ${tds(r.pre)}${tds(r.post, r.pre)}<td class="num nowrap"><b style="color:var(--text)">${r.m.salary == null ? '—' : fmtINR(r.m.net)}</b></td></tr>`).join('') : '');
  const { el, close } = openModal({
    title: `Summary — ${fmtMonth(run.month)}`, size: 'lg',
    subtitle: `Net pay total ${fmtINR(mapped.reduce((t, m) => t + m.net, 0))} · click a name for the day-wise sheet`,
    body: rows.length ? `<div class="table-wrap"><table class="table compact pay-table sum-table">
        <thead><tr><th rowspan="2">Name</th><th colspan="4" class="grp pre-h">Pre-adjustment (system)</th><th colspan="4" class="grp post-h">Post-adjustment (final)</th><th rowspan="2" class="num">Net pay</th></tr>
          <tr>${['FD', 'HD', 'HD-PM', 'Leave', 'FD', 'HD', 'HD-PM', 'Leave'].map((h, i) => `<th class="num ${i < 4 ? 'pre-h' : 'post-h'}">${h}</th>`).join('')}</tr></thead>
        <tbody>${section('Active', rows.filter((r) => !r.m.rt))}${section('Resigned & Terminated', rows.filter((r) => r.m.rt))}</tbody></table></div>`
      : emptyState('users', 'No mapped employees', 'Map the sheet in the Mapping tab first.'),
    footer: `<button class="btn" data-close>Close</button>`,
  });
  $$('[data-close-link]', el).forEach((a) => a.addEventListener('click', () => close()));
}

function exportPayrollCsv(run, mapped) {
  const cell = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const header = ['Employee', 'Employee ID', 'EmpCode', 'Monthly Salary', 'Daily Salary', 'Pre Full', 'Pre Half', 'Pre Leave',
    'Post Full', 'Post Half', 'Post Leave', 'Weekly Off', 'Earned', 'Professional Tax', 'Net Payable'];
  const lines = mapped.map((m) => [m.emp.full_name, m.emp.employee_code, m.g.code, m.salary ?? '', m.salary == null ? '' : m.daily.toFixed(2),
    m.pre.F, m.pre.HD, m.pre.L, m.post.F, m.post.HD, m.post.L, m.post.WO, m.payable, m.pt, m.net].map(cell).join(','));
  const blob = new Blob(['﻿' + [header.join(','), ...lines].join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `altius-payroll-${run.month.slice(0, 7)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

          : d.leave && (d.sys === 'L' || d.sys === 'HD') ? `${d.leave.kind === 'half' ? 'Half-day leave' : 'Leave'} from the Leaves register${d.leave.note ? `: ${d.leave.note}` : ''}`
          : d.sys === 'H' ? `Holiday: ${d.cal.description} — paid full day` : d.sys === 'WFH' ? `WFH${d.wfh?.note ? `: ${d.wfh.note}` : ''} — paid full day. Change it in the Final line, or reject it under Attendance → WFH.` : d.cal?.kind === 'relaxation' && d.sys === 'F' ? `Full day — time relaxation ${fmtHM(d.cal.full_minutes)} (${d.cal.description})` : ST_TITLE[d.sys]))}
        <tr class="final-row"><th class="lbl">Final<div class="faint" style="font-weight:400;font-size:11px">F / HD / L / WFH</div></th>${days.map((d) => `<td class="${dc(d)} ${d.editable && d.final !== d.systemFinal ? 'changed' : ''}">${d.editable
          ? `<select class="st-select st-${d.final}" data-day="${d.iso}">${(d.sys === 'NA' ? ['NA', 'F', 'HD', 'L', 'WFH'] : ['F', 'HD', 'L', 'WFH']).map((s) => `<option value="${s}" ${s === d.final ? 'selected' : ''}>${ST_LABEL[s]}</option>`).join('')}</select>`

  return {
    title: m.emp.full_name,
    crumbs: `<a href="#/payroll">Payroll</a> &nbsp;/&nbsp; ${fmtMonth(run.month)} &nbsp;/&nbsp; Day-wise attendance`,
    actions: back,
    html: `
      <div class="card emp-head">${avatar(m.emp, 'lg')}
        <div style="min-width:0"><h2>${esc(m.emp.full_name)}</h2>

        <button class="btn btn-sm btn-light" id="save-btn">${icon('check', 'sm')}Save changes</button>
      </div>`,
    mount() {
      mountQueryActions();
      const lw = $('#att-grid td.lwd');
      if (lw) $('#att-grid').scrollLeft = Math.max(0, lw.offsetLeft - 360); // bring the last working day into view
      const redraw = () => {
        $('#att-summary').innerHTML = summaryHTML();
        const scroll = $('#att-grid').scrollLeft;
        $('#att-grid').innerHTML = gridHTML();
        $('#att-grid').scrollLeft = scroll;
        $('#att-reports').innerHTML = reportsHTML();
        const dirty = m.days.some((d) => d.editable && edits.get(d.iso) !== d.final);
        state.dirty = dirty;
        $('#savebar').classList.toggle('hidden', !dirty);
      };
      $('#att-grid').addEventListener('change', (ev) => {
        const sel = ev.target.closest('[data-day]');
        if (!sel) return;
        edits.set(sel.dataset.day, sel.value);
        redraw();
      });
      $('#discard-btn').addEventListener('click', () => {
        m.days.forEach((d) => { if (d.editable) edits.set(d.iso, d.final); });
        redraw();
      });
      $('#save-btn').addEventListener('click', async (ev) => {
        const changed = m.days.filter((d) => d.editable && edits.get(d.iso) !== d.final);
        try {
          await withBusy(ev.currentTarget, 'Saving…', async () => {
            const items = [];
            for (const d of changed) {
              const to = edits.get(d.iso);
              if (to === 'WFH') {
                // WFH is recorded in the WFH register (added or confirmed by admin, so it counts even with punches)
                if (d.wfh) await api.rpc('admin_set_wfh', { p_id: d.wfh.id, p_status: 'recorded', p_note: 'Confirmed in day-wise attendance' });
                else await api.rpc('admin_add_wfh', { p_employee: m.emp.id, p_date: d.iso, p_note: 'Set in day-wise attendance' });
                items.push({ date: d.iso, status: null });
              } else {
                if (d.sys === 'WFH' && d.wfh) await api.rpc('admin_set_wfh', { p_id: d.wfh.id, p_status: 'rejected', p_note: `Changed to ${to} in day-wise attendance` });
                const base = d.sys === 'WFH' ? SYSTEM_TO_FINAL[d.punchSys] : d.systemFinal;
                items.push({ date: d.iso, status: to === base ? null : to });
              }
            }
            await api.rpc('admin_save_adjustments', { p_run: run.id, p_emp_code: m.g.code, p_items: items });
          });
          state.dirty = false;
          P.data.adjustments = await payrollApi.adjustments(run.id);
          const changedTo = new Map(changed.map((d) => [d.iso, edits.get(d.iso)]));
          const auto = await autoResolveQueries(m.queries, (emp, iso) => (emp === m.emp.id ? changedTo.get(iso) : null)).catch(() => 0);
          toast(`Attendance changes saved for ${m.emp.full_name}.${auto ? ` ${auto} quer${auto === 1 ? 'y' : 'ies'} resolved automatically.` : ''}`);
          location.hash = '#/payroll';
        } catch (err) { toast(friendlyError(err), 'error'); }
      });
    },
  };
}

// Salary queries an employee raised on their pushed sheet (date-specific, Leave / Half day only)
const Q_TONE = { open: 'red', resolved: 'green', rejected: 'gray', withdrawn: 'gray' };
const Q_LABEL = { open: 'Open', resolved: 'Resolved', rejected: 'Rejected', withdrawn: 'Withdrawn' };
function queriesCardHTML(m, run) {
  if (!m.queries.length) return '';
  const open = m.queries.filter((x) => x.status === 'open').length;
  return `<div class="card"><div class="card-head"><div><h3>Salary queries <span class="chip ${open ? 'red' : 'gray'} plain" style="margin-left:6px">${open} open</span></h3>
      <p>Change the day in the Final line below and save, mark the query, then <b>Save &amp; push</b> on the Payroll page so ${esc(firstName(m.emp.full_name))} sees it.</p></div></div>
    <div class="card-body"><div class="q-list">${m.queries.map((x) => `<div class="q-item">
      <div class="grow"><b>${fmtDate(x.work_date)}</b> <span class="faint">${DAY_NAMES[parseISODate(x.work_date).getDay()]}</span> · ${stChip(x.current_status)} → asks for ${stChip(x.requested_status)}
        <div style="margin-top:4px">“${esc(x.note)}”</div>
        <div class="faint" style="font-size:12px;margin-top:2px">Asked ${fmtDateTime(x.created_at)}${x.admin_note ? ` · Your note: ${esc(x.admin_note)}` : ''}</div></div>
      <span class="chip ${Q_TONE[x.status]} plain">${Q_LABEL[x.status]}</span>
      ${x.status === 'open' ? `<button class="btn btn-sm btn-danger" data-q-reject="${x.id}">${icon('x', 'sm')}Reject</button><button class="btn btn-sm btn-success" data-q-resolve="${x.id}">${icon('check', 'sm')}Resolved</button>`
        : x.status !== 'withdrawn' ? `<button class="btn btn-sm" data-q-reopen="${x.id}">Reopen</button>` : ''}
    </div>`).join('')}</div></div></div>`;
}
// An open query whose day has been changed counts as answered — resolve it without waiting for the button
const DAY_PHRASE = { F: 'a full day', HD: 'a half day', L: 'a leave', WFH: 'WFH (full day)', H: 'a holiday' };
async function autoResolveQueries(queries, finalOf) {
  let n = 0;
  for (const x of queries) {
    if (x.status !== 'open') continue;
    const now = finalOf(x.employee_id, x.work_date);
    if (!now || now === x.current_status) continue;
    await api.rpc('admin_decide_query', { p_id: x.id, p_status: 'resolved', p_note: `Resolved automatically — the day is now ${DAY_PHRASE[now] || now}` });
    n += 1;
  }
  if (n) { state.payroll.data.queries = await payrollApi.queries(state.payroll.runId); await refreshQueryBadge(); }
  return n;
}
function mountQueryActions() {
  const decide = async (btn, id, status, note) => {
    try {
      await withBusy(btn, '', () => api.rpc('admin_decide_query', { p_id: id, p_status: status, p_note: note ?? null }));
      state.payroll.data.queries = await payrollApi.queries(state.payroll.runId);
      await refreshQueryBadge();
      toast(status === 'resolved' ? 'Query marked resolved.' : status === 'rejected' ? 'Query rejected.' : 'Query reopened.');
      render();
    } catch (err) { toast(friendlyError(err), 'error'); }
  };
  $$('[data-q-resolve]').forEach((b) => b.addEventListener('click', () => decide(b, b.dataset.qResolve, 'resolved')));
  $$('[data-q-reopen]').forEach((b) => b.addEventListener('click', () => decide(b, b.dataset.qReopen, 'open')));
  $$('[data-q-reject]').forEach((b) => b.addEventListener('click', () => {
    const dlg = openModal({
      title: 'Reject query', size: 'sm', subtitle: 'The employee sees this note in My Pay.',
      body: `<div class="field"><label>Note for the employee<span class="req">*</span></label><textarea class="input" id="q-note" rows="3" placeholder="e.g. The OUT punch shows 3:05 pm"></textarea></div>`,
      footer: `<button class="btn" data-close>Cancel</button><button class="btn btn-danger" data-ok>Reject</button>`,
    });
    $('[data-ok]', dlg.el).addEventListener('click', async (ev) => {
      const note = $('#q-note', dlg.el).value.trim();
      if (!note) return toast('Add a note for the employee.', 'error');
      dlg.close(); await decide(b, b.dataset.qReject, 'rejected', note);
    });
  }));
}

/* ---------- Mapping: sheet EmpCode ↔ Employee Master Data ---------- */
const LEFT = '__left__'; // Mapping dropdown value: the person in the sheet has left (not in the HRMS)
async function pagePayrollMapping() {
  const P = state.payroll;
  const { run, groups } = payrollSheet();
  const base = { title: 'Payroll', crumbs: 'Map the sheet’s EmpCode and name to employees in Employee Master Data', actions: payrollActions() };
  if (!run) return { ...base, html: payrollTabs('mapping') + noRunState(), mount() { mountPayrollActions(); $('#upload-att-empty')?.addEventListener('click', pickAttendanceFile); } };

  const emps = activeEmployees();
  const savedMap = new Map(P.codeMap.map((x) => [x.emp_code, x.left_at ? LEFT : x.employee_id || '']));
  const takenBySaved = new Set([...savedMap.values()].filter((v) => v && v !== LEFT));
  // The sheet's EmpCode must be the Employee ID in EMD (names are not used).
  const suggest = (g) => {
    const hits = emps.filter((e) => normCode(e.employee_code) && normCode(e.employee_code) === normCode(g.code));
    return hits.length === 1 ? hits[0].id : '';
  };
  const model = new Map(groups.map((g) => {
    const saved = savedMap.get(g.code);
    let pick = saved || '';
    if (!savedMap.has(g.code)) { const s = suggest(g); if (s && !takenBySaved.has(s)) pick = s; }
    return [g.code, pick];
  }));
  // Codes already saved as "left" are folded away; everything else is listed
  const leftSaved = groups.filter((g) => savedMap.get(g.code) === LEFT);
  const main = groups.filter((g) => savedMap.get(g.code) !== LEFT);
  const isEmp = (v) => v && v !== LEFT;
  const statusOf = (g) => {
    const pick = model.get(g.code) || '';
    const saved = savedMap.get(g.code) || '';
    const label = savedMap.has(g.code) ? 'Changed' : pick && pick === suggest(g) ? 'Suggested' : 'New';
    const unsaved = pick === saved ? '' : ` <span class="chip ${savedMap.has(g.code) ? 'amber' : 'blue'} plain">${label} · not saved</span>`;
    if (!pick) return '<span class="chip gray">Not mapped</span>' + unsaved;
    if (pick === LEFT) return '<span class="chip gray plain">Left — not in payroll, hidden from next month</span>' + unsaved;
    const check = idCheck(g.code, byId(pick));
    return `<span class="chip ${check.ok ? 'green' : 'red'}">${esc(check.text)}</span>` + unsaved;
  };
  const rowsHTML = (list) => list.map((g) => {
    const pick = model.get(g.code) || '';
    const dup = isEmp(pick) && [...model.entries()].some(([c, v]) => c !== g.code && v === pick);
    return `<tr class="${pick === LEFT ? 'row-left' : ''}">
      <td class="mono"><b>${esc(g.code)}</b></td><td>${esc(g.name || '—')}</td><td class="num">${g.rows.length}</td>
      <td style="min-width:260px"><select class="input ${dup ? 'invalid' : ''}" data-code="${esc(g.code)}" style="height:36px">
        <option value="">— Not mapped —</option>
        <option value="${LEFT}" ${pick === LEFT ? 'selected' : ''}>Left / resigned — not in HRMS</option>
        <optgroup label="Employee Master Data">
        ${emps.map((e) => `<option value="${e.id}" ${e.id === pick ? 'selected' : ''}>${esc(e.full_name)}${e.employee_code ? ` · ${esc(e.employee_code)}` : ''}</option>`).join('')}
        </optgroup>
      </select>${dup ? '<div class="error-text">Already picked for another EmpCode</div>' : ''}</td>
      <td>${statusOf(g)}</td></tr>`;
  }).join('');
  const counts = () => {
    const v = groups.map((g) => model.get(g.code) || '');
    return { mapped: v.filter(isEmp).length, left: v.filter((x) => x === LEFT).length, none: v.filter((x) => !x).length };
  };
  const countText = () => { const c = counts(); return `${c.mapped} mapped · ${c.left} left / resigned · ${c.none} not mapped`; };
  const tableHead = '<thead><tr><th>EmpCode (sheet)</th><th>Name (sheet)</th><th class="num">Days</th><th>Employee (EMD) · Employee ID</th><th>Status</th></tr></thead>';

  return {
    ...base,
    html: `${payrollTabs('mapping')}
      <div class="card">
        <div class="card-head"><div><h3>${fmtMonth(run.month)} sheet — ${main.length} EmpCode(s) to map</h3><p id="map-count">${countText()}</p></div>
          <div class="right"><button class="btn btn-sm" id="all-left" title="Set every “Not mapped” row to Left / resigned">Mark not-mapped as left</button>
            <button class="btn btn-sm btn-primary" id="save-map">${icon('check', 'sm')}Save mapping</button></div></div>
        ${main.length ? `<div class="table-wrap"><table class="table compact">${tableHead}<tbody id="map-body">${rowsHTML(main)}</tbody></table></div>`
          : `<div id="map-body">${emptyState('check', 'Nothing left to map', 'Every EmpCode in this sheet is mapped or marked as left.')}</div>`}
      </div>
      ${leftSaved.length ? `<details class="card left-codes"><summary class="card-head" style="cursor:pointer"><div><h3>Left / resigned — ${leftSaved.length} EmpCode(s) hidden</h3><p>Marked earlier as people who have left. They are not in payroll. Open to change one back.</p></div>
          <div class="right">${icon('arrowRight', 'sm')}</div></summary>
          <div class="table-wrap"><table class="table compact">${tableHead}<tbody id="left-body">${rowsHTML(leftSaved)}</tbody></table></div></details>` : ''}`,
    mount() {
      mountPayrollActions();
      const redraw = () => {
        if ($('#map-body')?.tagName === 'TBODY') $('#map-body').innerHTML = rowsHTML(main);
        if ($('#left-body')) $('#left-body').innerHTML = rowsHTML(leftSaved);
        $('#map-count').textContent = countText();
        state.dirty = groups.some((g) => (model.get(g.code) || '') !== (savedMap.get(g.code) || ''));
      };
      $$('#map-body, #left-body').forEach((tb) => tb.addEventListener('change', (ev) => {
        const sel = ev.target.closest('[data-code]');
        if (!sel) return;
        model.set(sel.dataset.code, sel.value);
        redraw();
      }));
      $('#all-left').addEventListener('click', () => {
        const none = main.filter((g) => !model.get(g.code));
        if (!none.length) return toast('No “Not mapped” rows to mark.', 'error');
        none.forEach((g) => model.set(g.code, LEFT));
        redraw();
        toast(`${none.length} row(s) set to Left / resigned — check them, then Save mapping.`);
      });
      $('#save-map').addEventListener('click', async (ev) => {
        const btn = ev.currentTarget; // currentTarget is cleared once the handler awaits
        const picks = [...model.values()].filter(isEmp);
        if (new Set(picks).size !== picks.length) return toast('An employee is picked for two EmpCodes. Fix the highlighted rows.', 'error');
        const mismatched = groups.filter((g) => isEmp(model.get(g.code)) && !idCheck(g.code, byId(model.get(g.code))).ok);
        if (mismatched.length && !(await confirmDialog({
          title: 'Employee ID does not match',
          message: `For ${mismatched.map((g) => `<b>${esc(g.code)}</b>`).join(', ')}, the sheet’s EmpCode is not the same as the Employee ID in Employee Master Data. Save anyway? These rows stay flagged in red.`,
          confirmText: 'Save anyway', danger: true,
        }))) return;
        const items = groups.map((g) => {
          const v = model.get(g.code) || '';
          return { emp_code: g.code, employee_id: isEmp(v) ? v : null, sheet_name: g.name || null, left: v === LEFT };
        });
        try {
          await withBusy(btn, 'Saving…', () => api.rpc('admin_save_code_map', { p_items: items }));
          state.dirty = false;
          P.codeMap = await payrollApi.codeMap();
          const c = counts();
          toast(`Mapping saved — ${c.mapped} mapped${c.left ? `, ${c.left} left / resigned` : ''}${c.none ? `, ${c.none} not mapped` : ''}.`);
          render();
        } catch (err) { toast(friendlyError(err), 'error'); }
      });
    },
  };
}

        'On a time-relaxation day the full day is the time set for it (e.g. 5h on Diwali): working that long counts as a full day',
