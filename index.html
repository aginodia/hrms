/* =====================================================================
   PAYROLL (Module 3) — attendance upload, mapping, day-wise calculation
   ===================================================================== */
const DEFAULT_RULES = { weekday_full_minutes: 540, saturday_full_minutes: 300, sunday_paid_off: true };
const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const ST_LABEL = { F: 'F', HD: 'HD', L: 'L', WO: 'WO', MP: 'MP', MPH: 'HD', NA: '—' };
const ST_TITLE = {
  F: 'Full day', HD: 'Half day — worked less than the full-day hours', L: 'Leave — no punch in or out',
  WO: 'Weekly off (Sunday)', MP: 'Missed punch — counted as a full day', MPH: 'Half day — every 3rd missed punch',
  NA: 'Before date of joining — not counted',
};
const SYSTEM_TO_FINAL = { F: 'F', MP: 'F', HD: 'HD', MPH: 'HD', L: 'L', WO: 'WO', NA: 'NA' };
const XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

state.payroll = { runs: null, runId: null, data: null, codeMap: null, rules: null };

// Supabase returns at most 1,000 rows per request, so page through.
async function fetchAll(build, pageSize = 1000) {
  const out = [];
  for (let from = 0; ; from += pageSize) {
    const rows = await q(build().range(from, from + pageSize - 1));
    out.push(...rows);
    if (rows.length < pageSize) return out;
  }
}

const payrollApi = {
  runs: () => q(db.from('payroll_runs').select('*').is('superseded_at', null).order('month', { ascending: false })),
  punches: (runId) => fetchAll(() => db.from('attendance_punches')
    .select('emp_code, emp_name, work_date, day_label, punch_in, punch_out').eq('run_id', runId).order('id')),
  adjustments: (runId) => fetchAll(() => db.from('attendance_adjustments')
    .select('emp_code, work_date, final_status').eq('run_id', runId).order('work_date')),
  results: (runId) => fetchAll(() => db.from('payroll_results').select('*').eq('run_id', runId).eq('included', true).order('emp_code')),
  codeMap: () => fetchAll(() => db.from('attendance_code_map').select('*').order('emp_code')),
  rules: async () => {
    const row = await q(db.from('app_settings').select('value').eq('key', 'attendance_rules').maybeSingle());
    return { ...DEFAULT_RULES, ...(row?.value || {}) };
  },
  saveRules: (value) => q(db.from('app_settings')
    .update({ value, updated_by: state.user.id, updated_at: new Date().toISOString() })
    .eq('key', 'attendance_rules').select()),
};

async function ensurePayroll({ reload = false } = {}) {
  await ensureAdmin();
  const P = state.payroll;
  if (!P.runs || reload) {
    [P.runs, P.codeMap, P.rules] = await Promise.all([payrollApi.runs(), payrollApi.codeMap(), payrollApi.rules()]);
  }
  if (!P.runs.some((r) => r.id === P.runId)) P.runId = P.runs[0]?.id || null;
  if (!P.runId) { P.data = null; return; }
  if (!P.data || P.data.runId !== P.runId || reload) {
    const [punches, adjustments, results] = await Promise.all([
      payrollApi.punches(P.runId), payrollApi.adjustments(P.runId), payrollApi.results(P.runId)]);
    P.data = { runId: P.runId, punches, adjustments, results };
  }
}
const currentRun = () => state.payroll.runs?.find((r) => r.id === state.payroll.runId) || null;

/* ---------- Attendance rules engine ---------- */
const timeToMin = (t) => { if (!t) return null; const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
const fmtClock = (t) => (t ? String(t).slice(0, 5) : '—');
const fmtDuration = (m) => (m == null ? '—' : `${Math.floor(m / 60)}h ${pad(m % 60)}m`);
const daysInMonth = (monthIso) => { const d = parseISODate(monthIso); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };
const stChip = (s, title) => `<span class="st st-${s}" title="${esc(title || ST_TITLE[s] || '')}">${ST_LABEL[s] || s}</span>`;

/* Builds every day of the month for one employee.
   Rules: both punches and ≥ full-day hours → F; both but shorter → HD;
   one punch missing → missed punch (every 3rd one is a half day, the rest
   count as full days); no punches → L; Sunday → weekly off. */
function computeAttendance(rows, monthIso, rules, adjustments, doj) {
  const byDate = new Map(rows.map((r) => [r.work_date, r]));
  const base = parseISODate(monthIso);
  const days = [];
  let misses = 0;
  for (let i = 1; i <= daysInMonth(monthIso); i++) {
    const iso = `${base.getFullYear()}-${pad(base.getMonth() + 1)}-${pad(i)}`;
    const wd = new Date(base.getFullYear(), base.getMonth(), i).getDay();
    const r = byDate.get(iso);
    const inM = timeToMin(r?.punch_in);
    const rawOut = timeToMin(r?.punch_out);
    const outM = inM != null && rawOut === inM ? null : rawOut; // the same time twice is a single punch
    const need = wd === 6 ? rules.saturday_full_minutes : rules.weekday_full_minutes;
    let mins = null, sys, missNo = null;
    if (doj && iso < doj) sys = 'NA';
    else if (wd === 0) sys = 'WO';
    else if (inM != null && outM != null) {
      mins = outM - inM;
      if (mins < 0) mins += 1440; // overnight shift
      sys = mins >= need ? 'F' : 'HD';
    } else if (inM != null || outM != null) {
      misses += 1; missNo = misses;
      sys = misses % 3 === 0 ? 'MPH' : 'MP';
    } else sys = 'L';
    const editable = sys === 'HD' || sys === 'L' || sys === 'MP' || sys === 'MPH';
    const systemFinal = SYSTEM_TO_FINAL[sys];
    const adj = editable ? adjustments.get(iso) || null : null;
    days.push({
      iso, d: i, wd, dayLabel: r?.day_label || DAY_NAMES[wd], in: r?.punch_in || null, out: outM == null ? null : r?.punch_out,
      inM, outM, mins, need, sys, missNo, editable, systemFinal, saved: adj, final: adj || systemFinal,
      missing: sys === 'MP' || sys === 'MPH' ? (inM == null ? 'IN' : 'OUT') : null,
    });
  }
  return days;
}
function tally(days, which) {
  const c = { F: 0, HD: 0, L: 0, WO: 0 };
  for (const d of days) {
    const s = which === 'system' ? SYSTEM_TO_FINAL[d.sys] : d.final;
    if (s in c) c[s] += 1;
  }
  return c;
}
function salaryForMonth(empId, monthIso) {
  const rows = salariesOf(empId).filter((s) => s.effective_month <= monthIso);
  const row = rows[rows.length - 1] || salariesOf(empId)[0];
  return row ? Number(row.amount) : null;
}
function payFor(counts, salary, rules) {
  const daily = salary ? salary / 30 : 0;
  const fullDays = counts.F + (rules.sunday_paid_off ? counts.WO : 0);
  return { daily, fullDays, payable: Math.round(fullDays * daily + counts.HD * daily * 0.5) };
}
function groupPunches(punches) {
  const groups = new Map();
  for (const p of punches) {
    if (!groups.has(p.emp_code)) groups.set(p.emp_code, { code: p.emp_code, name: p.emp_name || '', rows: [] });
    const g = groups.get(p.emp_code);
    if (!g.name && p.emp_name) g.name = p.emp_name;
    g.rows.push(p);
  }
  return [...groups.values()].sort((a, b) => (a.name || a.code).localeCompare(b.name || b.code));
}
const codeMapIndex = () => new Map(state.payroll.codeMap.filter((m) => m.employee_id).map((m) => [m.emp_code, m.employee_id]));

function payrollSheet() {
  const P = state.payroll;
  const run = currentRun();
  if (!run || !P.data) return { run, mapped: [], unmapped: [], groups: [] };
  const groups = groupPunches(P.data.punches);
  const map = codeMapIndex();
  const adjByCode = new Map();
  for (const a of P.data.adjustments) {
    if (!a.final_status) continue;
    if (!adjByCode.has(a.emp_code)) adjByCode.set(a.emp_code, new Map());
    adjByCode.get(a.emp_code).set(a.work_date, a.final_status);
  }
  const mapped = [], unmapped = [];
  for (const g of groups) {
    const emp = byId(map.get(g.code));
    if (!emp) { unmapped.push(g); continue; }
    const days = computeAttendance(g.rows, run.month, P.rules, adjByCode.get(g.code) || new Map(), emp.date_of_joining);
    const pre = tally(days, 'system');
    const post = tally(days, 'final');
    const salary = salaryForMonth(emp.id, run.month);
    mapped.push({ g, emp, days, pre, post, salary, prePay: payFor(pre, salary, P.rules), ...payFor(post, salary, P.rules) });
  }
  mapped.sort((a, b) => a.emp.full_name.localeCompare(b.emp.full_name));
  return { run, groups, mapped, unmapped };
}

/* ---------- Excel parsing (in the browser; the file is never uploaded) ---------- */
let xlsxLoading = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxLoading) {
    xlsxLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = XLSX_SRC;
      s.onload = resolve;
      s.onerror = () => { xlsxLoading = null; reject(new Error('Could not load the Excel reader. Check your connection and try again.')); };
      document.head.appendChild(s);
    });
  }
  return xlsxLoading;
}
const COL_ALIASES = {
  code: ['empcode', 'employeecode', 'ecode', 'empid', 'employeeid', 'empno', 'employeeno', 'code', 'cardno', 'staffcode'],
  name: ['name', 'empname', 'employeename', 'employee', 'staffname'],
  date: ['date', 'attdate', 'attendancedate', 'punchdate', 'workdate'],
  day: ['day', 'weekday', 'dayname'],
  in: ['in', 'intime', 'punchin', 'checkin', 'timein', 'firstin', 'inpunch'],
  out: ['out', 'outtime', 'punchout', 'checkout', 'timeout', 'lastout', 'outpunch'],
};
const MONTH_IDX = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
const isoOf = (y, m, d) => {
  if (y < 100) y += 2000;
  const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d ? `${y}-${pad(m)}-${pad(d)}` : null;
};
function parseSheetDate(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') {
    if (v < 1 || v > 80000) return null;
    const p = XLSX.SSF.parse_date_code(v);
    return p ? isoOf(p.y, p.m, p.d) : null;
  }
  if (v instanceof Date) return isoOf(v.getFullYear(), v.getMonth() + 1, v.getDate());
  const s = String(v).trim();
  let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return isoOf(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))) {
    let d = +m[1], mo = +m[2];
    if (mo > 12 && d <= 12) [d, mo] = [mo, d]; // month-first dates
    return isoOf(+m[3], mo, d);
  }
  if ((m = s.match(/^(\d{1,2})[-\s/.]([A-Za-z]{3,})[-\s/.,]*(\d{2,4})/))) {
    const mo = MONTH_IDX[m[2].slice(0, 3).toLowerCase()];
    return mo ? isoOf(+m[3], mo, +m[1]) : null;
  }
  if ((m = s.match(/^([A-Za-z]{3,})\s+(\d{1,2}),?\s+(\d{4})/))) {
    const mo = MONTH_IDX[m[1].slice(0, 3).toLowerCase()];
    return mo ? isoOf(+m[3], mo, +m[2]) : null;
  }
  return null;
}
// "00:00" and blanks mean no punch.
function parseSheetTime(v) {
  if (v == null || v === '') return null;
  let mins = null;
  if (typeof v === 'number') {
    mins = Math.round((v - Math.floor(v)) * 1440) % 1440;
  } else if (v instanceof Date) {
    mins = v.getHours() * 60 + v.getMinutes();
  } else {
    const m = String(v).trim().match(/(\d{1,2})[:.](\d{2})(?:[:.]\d{2})?\s*([ap])?\.?\s*m?\.?/i);
    if (!m) return null;
    let h = +m[1];
    const min = +m[2];
    if (m[3]) { const pm = m[3].toLowerCase() === 'p'; if (h === 12) h = pm ? 12 : 0; else if (pm) h += 12; }
    if (h > 23 || min > 59) return null;
    mins = h * 60 + min;
  }
  return mins ? `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}` : null;
}
/* Reads attendance rows from a sheet. Two layouts are understood:
   1. Blocks per employee (the biometric "Raw Sheet" export): an
      "Empcode <code> … Name <name>" row, then a header row
      "Date | Day | Shift | IN | Out1 | In2 | … | In8 | Out", then one row per date.
      IN is the first punch of the day and the last "Out" column the final one.
   2. One table with an EmpCode column on every row:
      EmpCode | Name | Date | Day | IN | OUT. */
function extractAttendance(rows) {
  const norm = (v) => String(v ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const blank = (v) => String(v ?? '').trim() === '';
  const cellText = (v) => (typeof v === 'number' ? String(v) : String(v ?? '').trim());
  const nextValue = (row, idx) => { for (let j = idx + 1; j < row.length; j++) if (!blank(row[j])) return cellText(row[j]); return ''; };
  const findCol = (cells, names) => { for (const n of names) { const i = cells.indexOf(n); if (i >= 0) return i; } return -1; };
  const detectHeader = (cells) => {
    const date = findCol(cells, COL_ALIASES.date);
    const inC = findCol(cells, COL_ALIASES.in);
    const outC = findCol(cells, COL_ALIASES.out);
    if (date < 0 || (inC < 0 && outC < 0)) return null;
    const code = findCol(cells, COL_ALIASES.code);
    const name = findCol(cells, COL_ALIASES.name);
    const day = findCol(cells, COL_ALIASES.day);
    // every punch column in order (IN, Out1, In2, …, Out) for multi-punch exports
    const punches = cells.map((c, i) => (/^(in|out)\d*$/.test(c) || i === inC || i === outC ? i : -1)).filter((i) => i >= 0);
    return { date, in: inC, out: outC, code: code >= 0 ? code : null, name: name >= 0 ? name : null, day: day >= 0 ? day : null, punches };
  };

  const out = [];
  let col = null, skipped = 0, blockCode = '', blockName = '', lastCode = '', lastName = '';
  for (const row of rows) {
    if (!row || row.every(blank)) continue;
    const cells = row.map(norm);
    const header = detectHeader(cells);
    if (header) { col = header; continue; }
    // "Empcode 0003 … Name Sayan" block label row
    const codeLabel = findCol(cells, COL_ALIASES.code);
    if (codeLabel >= 0 && !parseSheetDate(row[0])) {
      blockCode = nextValue(row, codeLabel);
      const nameLabel = cells.findIndex((c, j) => j > codeLabel && COL_ALIASES.name.includes(c));
      blockName = nameLabel >= 0 ? nextValue(row, nameLabel) : '';
      col = null; // wait for this block's header row
      continue;
    }
    if (!col) continue;
    const date = parseSheetDate(row[col.date]);
    if (!date) {
      // totals / notes rows between blocks ("Total Present", …) are ignored;
      // only rows with an unreadable date are reported as skipped
      if (/\d/.test(cellText(row[col.date])) && col.punches.some((i) => parseSheetTime(row[i]))) skipped += 1;
      continue;
    }
    let code, name;
    if (col.code != null) {
      code = cellText(row[col.code]);
      name = col.name != null ? cellText(row[col.name]) : '';
      if (code) { if (code !== lastCode) lastName = ''; lastCode = code; if (name) lastName = name; } else code = lastCode;
      name = name || lastName;
    } else { code = blockCode; name = blockName; }
    if (!code) { skipped += 1; continue; }
    const times = col.punches.map((i) => parseSheetTime(row[i]));
    const valid = times.filter(Boolean);
    let punchIn = col.in >= 0 ? parseSheetTime(row[col.in]) : null;
    let punchOut = col.out >= 0 ? parseSheetTime(row[col.out]) : null;
    if (!punchIn && valid.length && col.punches.length > 2) punchIn = valid[0];
    if (!punchOut && valid.length > 1 && col.punches.length > 2) punchOut = valid[valid.length - 1];
    out.push({
      emp_code: code, emp_name: name, work_date: date,
      day_label: col.day != null ? cellText(row[col.day]).slice(0, 12) : '',
      punch_in: punchIn, punch_out: punchOut,
    });
  }
  return out.length ? { rows: out, skipped } : null;
}
async function parseAttendanceFile(file) {
  await loadXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  let best = null;
  for (const sheetName of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true, defval: '' });
    const res = extractAttendance(rows);
    if (res && (!best || res.rows.length > best.rows.length)) best = { ...res, sheetName };
  }
  if (best) return best;
  throw new Error('Could not find attendance in this file. Expected an "Empcode … Name" row with a "Date | Day | IN | … | Out" table under it, or the columns EmpCode, Name, Date, Day, IN and OUT.');
}

/* ---------- Upload flow ---------- */
function pickAttendanceFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls,.csv';
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;
    const busy = toastBusy(`Reading ${file.name}…`);
    try {
      const parsed = await parseAttendanceFile(file);
      busy();
      showImportPreview(file, parsed);
    } catch (e) { busy(); toast(friendlyError(e), 'error'); }
  });
  input.click();
}
function toastBusy(text) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${spinnerHTML}<span>${esc(text)}</span>`;
  $('#toast-root').appendChild(el);
  return () => el.remove();
}
function showImportPreview(file, parsed) {
  const counts = {};
  for (const r of parsed.rows) { const k = r.work_date.slice(0, 7); counts[k] = (counts[k] || 0) + 1; }
  const guess = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
  const [gy, gm] = guess.split('-').map(Number);
  const summarize = (monthIso) => {
    const key = monthIso.slice(0, 7);
    const rows = parsed.rows.filter((r) => r.work_date.startsWith(key));
    const emps = groupPunches(rows);
    const dates = rows.map((r) => r.work_date).sort();
    return { rows, emps, outside: parsed.rows.length - rows.length, first: dates[0], last: dates[dates.length - 1] };
  };
  const { el, close } = openModal({
    title: 'Upload attendance', size: 'md',
    subtitle: `${esc(file.name)} · sheet “${esc(parsed.sheetName)}” · the file itself is not stored`,
    body: `<div class="field" style="margin-bottom:16px"><label>Payroll month</label>
             <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:280px">${monthYearSelects('imp', gy, gm)}</div></div>
           <div id="imp-summary"></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-save>${icon('upload', 'sm')}Save attendance</button>`,
  });
  const monthIso = () => monthStart($('[data-y="imp"]', el).value, Number($('[data-m="imp"]', el).value));
  const draw = () => {
    const s = summarize(monthIso());
    const existing = state.payroll.runs?.find((r) => r.month === monthIso());
    $('#imp-summary', el).innerHTML = `
      <div class="kv" style="margin-bottom:14px">
        <div><div class="k">Employees</div><div class="v">${s.emps.length}</div></div>
        <div><div class="k">Attendance rows</div><div class="v">${s.rows.length}</div></div>
        <div><div class="k">Dates</div><div class="v">${s.first ? `${fmtDate(s.first)} – ${fmtDate(s.last)}` : '—'}</div></div>
        <div><div class="k">Skipped rows</div><div class="v">${parsed.skipped + s.outside}</div></div>
      </div>
      ${s.outside ? `<div class="alert alert-warn" style="margin-bottom:10px">${icon('alert')}<span>${s.outside} row(s) fall outside ${fmtMonth(monthIso())} and will be left out.</span></div>` : ''}
      ${existing ? `<div class="alert alert-warn" style="margin-bottom:10px">${icon('alert')}<span>${fmtMonth(monthIso())} already has an upload (${esc(existing.source_file_name || 'file')}). Saving replaces it; your day-wise changes are carried over and the old upload is kept in history.</span></div>` : ''}
      ${s.emps.length ? `<div class="table-wrap" style="max-height:220px;border:1px solid var(--border);border-radius:10px"><table class="table">
        <thead><tr><th>EmpCode</th><th>Name in sheet</th><th class="num">Days</th><th class="num">Days with punches</th></tr></thead><tbody>
        ${s.emps.map((g) => `<tr><td class="mono">${esc(g.code)}</td><td>${esc(g.name || '—')}</td><td class="num">${g.rows.length}</td>
          <td class="num">${g.rows.filter((r) => r.punch_in || r.punch_out).length}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="alert alert-error">${icon('alert')}<span>No rows for ${fmtMonth(monthIso())}. Pick the month the sheet is for.</span></div>`}`;
    $('[data-save]', el).disabled = !s.rows.length;
  };
  $$('[data-m="imp"], [data-y="imp"]', el).forEach((sel) => sel.addEventListener('change', draw));
  draw();
  $('[data-save]', el).addEventListener('click', async (e) => {
    const month = monthIso();
    const { rows } = summarize(month);
    try {
      const runId = await withBusy(e.currentTarget, 'Saving…', () => api.rpc('admin_import_attendance', { p_month: month, p_file_name: file.name, p_rows: rows }));
      close();
      state.payroll.runId = runId;
      await ensurePayroll({ reload: true });
      const unmapped = payrollSheet().unmapped.length;
      toast(`Attendance for ${fmtMonth(month)} saved.${unmapped ? ` ${unmapped} employee(s) need mapping.` : ''}`);
      go(unmapped ? '#/payroll/mapping' : '#/payroll');
    } catch (err) { toast(friendlyError(err), 'error'); }
  });
}

function exportPayrollCsv(run, mapped) {
  const cell = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const header = ['Employee', 'Employee ID', 'EmpCode', 'Monthly Salary', 'Daily Salary', 'Pre Full', 'Pre Half', 'Pre Leave',
    'Post Full', 'Post Half', 'Post Leave', 'Weekly Off', 'Payable'];
  const lines = mapped.map((m) => [m.emp.full_name, m.emp.employee_code, m.g.code, m.salary ?? '', m.salary == null ? '' : m.daily.toFixed(2),
    m.pre.F, m.pre.HD, m.pre.L, m.post.F, m.post.HD, m.post.L, m.post.WO, m.payable].map(cell).join(','));
  const blob = new Blob(['﻿' + [header.join(','), ...lines].join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `altius-payroll-${run.month.slice(0, 7)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

    };
  }
  const run = sheet.run;
  // working copy of the final line: iso -> status (only editable days)
  const edits = new Map(m.days.filter((d) => d.editable).map((d) => [d.iso, d.final]));

      </div>
      <div class="pay-line ${emphasize ? 'strong' : ''}">${m.salary == null ? 'No salary in Employee Master Data'

  };
  const gridHTML = () => {
    const days = daysNow();
    const head = (label, fn, cls = '') => `<tr class="${cls}"><th class="lbl">${label}</th>${days.map((d) => `<td class="${d.wd === 0 ? 'sun' : ''}">${fn(d)}</td>`).join('')}</tr>`;
    return `<table class="att">
      <thead>${head('Date', (d) => `<b>${pad(d.d)}</b>`, 'hdr')}${head('Day', (d) => esc(d.dayLabel), 'hdr sub')}</thead>
      <tbody>
        ${head('IN', (d) => (d.inM == null ? '<span class="faint">—</span>' : fmtClock(d.in)))}
        ${head('OUT', (d) => (d.outM == null ? '<span class="faint">—</span>' : fmtClock(d.out)))}
        ${head('Worked', (d) => (d.mins == null ? '<span class="faint">—</span>' : `<span class="${d.mins < d.need ? 'short' : ''}">${fmtDuration(d.mins).replace(' ', '')}</span>`))}
        ${head('System', (d) => stChip(d.sys, d.sys === 'MP' || d.sys === 'MPH' ? `${ST_TITLE[d.sys]} (missed ${d.missing}, miss #${d.missNo})` : d.sys === 'HD' ? `${ST_TITLE.HD}: ${fmtDuration(d.mins)} of ${fmtDuration(d.need)}` : ST_TITLE[d.sys]))}
        <tr class="final-row"><th class="lbl">Final<div class="faint" style="font-weight:400;font-size:11px">change HD / L / missed</div></th>${days.map((d) => `<td class="${d.wd === 0 ? 'sun' : ''} ${d.editable && d.final !== d.systemFinal ? 'changed' : ''}">${d.editable
          ? `<select class="st-select st-${d.final}" data-day="${d.iso}">${['F', 'HD', 'L'].map((s) => `<option value="${s}" ${s === d.final ? 'selected' : ''}>${s}</option>`).join('')}</select>`
          : stChip(d.final)}</td>`).join('')}</tr>
      </tbody></table>`;
  };
  const reportsHTML = () => {
    const days = daysNow();
    const short = m.days.filter((d) => d.sys === 'HD');
    const missed = m.days.filter((d) => d.sys === 'MP' || d.sys === 'MPH');
    const leave = m.days.filter((d) => d.sys === 'L');

    const list = (items, fn, empty) => (items.length ? `<div class="rep-list">${items.map(fn).join('')}</div>` : `<p class="muted" style="font-size:13px">${empty}</p>`);
    const dl = (d) => `<b>${fmtDate(d.iso)}</b> <span class="faint">${esc(d.dayLabel)}</span>`;
    return `<div class="rep-grid">
      <div class="card"><div class="card-head"><div><h3>Half days — short hours</h3><p>Both punches, but under the full-day hours</p></div><div class="right"><span class="chip amber plain">${short.length}</span></div></div>
        <div class="card-body">${list(short, (d) => `<div class="rep-row">${dl(d)}<span>${fmtClock(d.in)}–${fmtClock(d.out)} · ${fmtDuration(d.mins)} of ${fmtDuration(d.need)}</span></div>`, 'None this month.')}</div></div>
      <div class="card"><div class="card-head"><div><h3>Missed punches</h3><p>Every 3rd missed punch becomes a half day</p></div><div class="right"><span class="chip violet plain">${missed.filter((d) => d.sys === 'MPH').length} HD from ${missed.length}</span></div></div>
        <div class="card-body">${list(missed, (d) => `<div class="rep-row">${dl(d)}<span>Missed ${d.missing} · miss #${d.missNo} → ${d.sys === 'MPH' ? '<span class="st st-MPH">HD</span> half day' : '<span class="st st-MP">MP</span> counted full'}</span></div>`, 'No missed punches.')}</div></div>
      <div class="card"><div class="card-head"><div><h3>Leaves</h3><p>No punch in or out on a working day</p></div><div class="right"><span class="chip red plain">${leave.length}</span></div></div>
        <div class="card-body">${list(leave, (d) => `<div class="rep-row">${dl(d)}</div>`, 'No leaves.')}</div></div>
      <div class="card"><div class="card-head"><div><h3>Admin changes</h3><p>Days changed in the Final line</p></div><div class="right"><span class="chip blue plain">${changedDays.length}</span></div></div>
        <div class="card-body">${list(changedDays, (d) => `<div class="rep-row">${dl(d)}<span>${stChip(d.sys)} → ${stChip(d.final)}</span></div>`, 'No changes — the system calculation is used.')}</div></div>
    </div>`;
  };

  return {
    title: m.emp.full_name,
    crumbs: `<a href="#/payroll">Payroll</a> &nbsp;/&nbsp; ${fmtMonth(run.month)} &nbsp;/&nbsp; Day-wise attendance`,
    actions: back,
    html: `
      <div class="card emp-head">${avatar(m.emp, 'lg')}
        <div style="min-width:0"><h2>${esc(m.emp.full_name)}</h2>
          <div class="meta"><span>${esc(m.emp.employee_code || 'No EID')}</span><span>·</span><span>EmpCode ${esc(m.g.code)}${m.g.name && m.g.name !== m.emp.full_name ? ` (“${esc(m.g.name)}” in sheet)` : ''}</span><span>·</span><span>${esc(m.emp.designation || 'No designation')}</span></div></div>
        <div class="facts">
          <div><div class="k">Monthly salary</div><div class="v">${fmtINR(m.salary)}</div></div>
          <div><div class="k">Daily salary (÷30)</div><div class="v">${m.salary == null ? '—' : fmtINR2(m.daily)}</div></div>
          <div><div class="k">Full day</div><div class="v" style="font-size:13px">Mon–Fri ${fmtDuration(P.rules.weekday_full_minutes)}<br>Sat ${fmtDuration(P.rules.saturday_full_minutes)}</div></div>
        </div>
      </div>
      <div id="att-summary">${summaryHTML()}</div>
      <div class="card">
        <div class="card-head"><div><h3>Day-wise attendance — ${fmtMonth(run.month)}</h3><p>System line is calculated from the punches. Change HD, L or missed-punch days in the Final line.</p></div>
          <div class="right legend">${['F', 'HD', 'L', 'MP', 'WO'].map((s) => `${stChip(s)}<span>${{ F: 'Full', HD: 'Half', L: 'Leave', MP: 'Missed punch', WO: 'Weekly off' }[s]}</span>`).join('')}</div></div>
        <div class="att-wrap" id="att-grid">${gridHTML()}</div>
      </div>
      <div id="att-reports">${reportsHTML()}</div>
      <div class="savebar hidden" id="savebar">
        <div class="grow"><b>Unsaved changes</b> <span>— the post-adjustment count and payable update when you save</span></div>
        <button class="btn btn-sm" id="discard-btn">Discard</button>
        <button class="btn btn-sm btn-light" id="save-btn">${icon('check', 'sm')}Save changes</button>
      </div>`,
    mount() {
      const redraw = () => {
        $('#att-summary').innerHTML = summaryHTML();
        const scroll = $('#att-grid').scrollLeft;
        $('#att-grid').innerHTML = gridHTML();
        $('#att-grid').scrollLeft = scroll;
        $('#att-reports').innerHTML = reportsHTML();
        const dirty = m.days.some((d) => d.editable && edits.get(d.iso) !== d.final);
        state.dirty = dirty;
        $('#savebar').classList.toggle('hidden', !dirty);
      };
      $('#att-grid').addEventListener('change', (ev) => {
        const sel = ev.target.closest('[data-day]');
        if (!sel) return;
        edits.set(sel.dataset.day, sel.value);
        redraw();
      });
      $('#discard-btn').addEventListener('click', () => {
        m.days.forEach((d) => { if (d.editable) edits.set(d.iso, d.final); });
        redraw();
      });
      $('#save-btn').addEventListener('click', async (ev) => {
        const items = m.days.filter((d) => d.editable && edits.get(d.iso) !== d.final)
          .map((d) => ({ date: d.iso, status: edits.get(d.iso) === d.systemFinal ? null : edits.get(d.iso) }));
        try {
          await withBusy(ev.currentTarget, 'Saving…', () => api.rpc('admin_save_adjustments', { p_run: run.id, p_emp_code: m.g.code, p_items: items }));
          state.dirty = false;
          P.data.adjustments = await payrollApi.adjustments(run.id);
          toast(`Attendance changes saved for ${m.emp.full_name}.`);
          render();
        } catch (err) { toast(friendlyError(err), 'error'); }
      });
    },
  };
}

/* ---------- Mapping: sheet EmpCode ↔ Employee Master Data ---------- */
async function pagePayrollMapping() {
  const P = state.payroll;
  const { run, groups } = payrollSheet();
  const base = { title: 'Payroll', crumbs: 'Map the sheet’s EmpCode and name to employees in Employee Master Data', actions: payrollActions() };
  if (!run) return { ...base, html: payrollTabs('mapping') + noRunState(), mount() { mountPayrollActions(); $('#upload-att-empty')?.addEventListener('click', pickAttendanceFile); } };

  const emps = activeEmployees();
  const savedMap = new Map(P.codeMap.map((x) => [x.emp_code, x.employee_id || '']));
  const takenBySaved = new Set([...savedMap.values()].filter(Boolean));
  const normName = (s) => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
  const digits = (s) => (String(s || '').match(/\d+/g) || []).join('');
  const similarity = (a, b) => { // 1 = identical, based on edit distance
    if (!a || !b) return 0;
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    return 1 - d[a.length][b.length] / Math.max(a.length, b.length);
  };
  // Suggest: same Employee ID → same number ignoring prefixes / leading zeros → same name → close spelling.
  const suggest = (g) => {
    const code = g.code.trim().toLowerCase();
    const byCode = emps.find((e) => e.employee_code && e.employee_code.trim().toLowerCase() === code);
    if (byCode) return byCode.id;
    const num = digits(g.code);
    const byNum = num ? emps.filter((e) => digits(e.employee_code) && Number(digits(e.employee_code)) === Number(num)) : [];
    if (byNum.length === 1) return byNum[0].id;
    const target = normName(g.name);
    const byName = emps.filter((e) => normName(e.full_name) && normName(e.full_name) === target);
    if (byName.length === 1) return byName[0].id;
    const scored = emps.map((e) => ({ id: e.id, score: similarity(normName(e.full_name), target) })).sort((a, b) => b.score - a.score);
    return scored[0] && scored[0].score >= 0.8 && (!scored[1] || scored[0].score - scored[1].score >= 0.08) ? scored[0].id : '';
  };
  const model = new Map(groups.map((g) => {
    const saved = savedMap.get(g.code);
    let pick = saved || '';
    if (!savedMap.has(g.code)) { const s = suggest(g); if (s && !takenBySaved.has(s)) pick = s; }
    return [g.code, pick];
  }));
  const statusOf = (g) => {
    const pick = model.get(g.code) || '';
    const saved = savedMap.get(g.code) || '';
    if (pick && pick === saved) return '<span class="chip green">Mapped</span>';
    if (!savedMap.has(g.code) && pick) return '<span class="chip blue">Suggested</span>';
    if (pick !== saved) return '<span class="chip amber">Changed</span>';
    return '<span class="chip gray">Not mapped</span>';
  };
  const rowsHTML = () => groups.map((g) => {
    const pick = model.get(g.code) || '';
    const dup = pick && [...model.entries()].some(([c, v]) => c !== g.code && v === pick);
    return `<tr>
      <td class="mono"><b>${esc(g.code)}</b></td><td>${esc(g.name || '—')}</td><td class="num">${g.rows.length}</td>
      <td style="min-width:260px"><select class="input ${dup ? 'invalid' : ''}" data-code="${esc(g.code)}" style="height:36px">
        <option value="">— Not mapped —</option>
        ${emps.map((e) => `<option value="${e.id}" ${e.id === pick ? 'selected' : ''}>${esc(e.full_name)}${e.employee_code ? ` · ${esc(e.employee_code)}` : ''}</option>`).join('')}
      </select>${dup ? '<div class="error-text">Already picked for another EmpCode</div>' : ''}</td>
      <td>${statusOf(g)}</td></tr>`;
  }).join('');
  const mappedCount = () => groups.filter((g) => model.get(g.code)).length;

  return {
    ...base,
    html: `${payrollTabs('mapping')}
      <div class="alert alert-info">${icon('info')}<span>Only mapped employees are included in the salary calculation. Suggestions match the sheet’s EmpCode to the Employee ID in Employee Master Data, then the name. A mapping is remembered for future months.</span></div>
      <div class="card">
        <div class="card-head"><div><h3>${fmtMonth(run.month)} sheet — ${groups.length} employee(s)</h3><p id="map-count">${mappedCount()} of ${groups.length} mapped</p></div>
          <div class="right"><button class="btn btn-sm btn-primary" id="save-map">${icon('check', 'sm')}Save mapping</button></div></div>
        <div class="table-wrap"><table class="table compact">
          <thead><tr><th>EmpCode (sheet)</th><th>Name (sheet)</th><th class="num">Days</th><th>Employee (EMD) · Employee ID</th><th>Status</th></tr></thead>
          <tbody id="map-body">${rowsHTML()}</tbody></table></div>
      </div>`,
    mount() {
      mountPayrollActions();
      $('#map-body').addEventListener('change', (ev) => {
        const sel = ev.target.closest('[data-code]');
        if (!sel) return;
        model.set(sel.dataset.code, sel.value);
        $('#map-body').innerHTML = rowsHTML();
        $('#map-count').textContent = `${mappedCount()} of ${groups.length} mapped`;
        state.dirty = groups.some((g) => (model.get(g.code) || '') !== (savedMap.get(g.code) || ''));
      });
      $('#save-map').addEventListener('click', async (ev) => {
        const picks = [...model.values()].filter(Boolean);
        if (new Set(picks).size !== picks.length) return toast('An employee is picked for two EmpCodes. Fix the highlighted rows.', 'error');
        const items = groups.map((g) => ({ emp_code: g.code, employee_id: model.get(g.code) || null, sheet_name: g.name || null }));
        try {
          await withBusy(ev.currentTarget, 'Saving…', () => api.rpc('admin_save_code_map', { p_items: items }));
          state.dirty = false;
          P.codeMap = await payrollApi.codeMap();
          toast(`Mapping saved — ${picks.length} of ${groups.length} employee(s) mapped.`);
          render();
        } catch (err) { toast(friendlyError(err), 'error'); }
      });
    },
  };
}

/* ---------- Working hours (full-day rules) ---------- */
async function pagePayrollRules() {
  const P = state.payroll;
  const r = P.rules;
  const hm = (name, mins) => `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:240px">
      <div class="field"><label class="hint">Hours</label><input class="input mono" type="number" min="0" max="24" name="${name}_h" value="${Math.floor(mins / 60)}"></div>
      <div class="field"><label class="hint">Minutes</label><input class="input mono" type="number" min="0" max="59" step="5" name="${name}_m" value="${mins % 60}"></div></div>`;
  return {
    title: 'Payroll', crumbs: 'Set how much time counts as a full working day', actions: payrollActions(),
    html: `${payrollTabs('rules')}
      <div class="split" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
        <form class="card" id="rules-form" novalidate>
          <div class="card-head"><div><h3>Full-day working time</h3><p>Time between punch in and punch out needed for a full day</p></div></div>
          <div class="card-body grid" style="gap:20px">
            <div><div class="label" style="margin-bottom:8px">Monday – Friday</div>${hm('wk', r.weekday_full_minutes)}</div>
            <div><div class="label" style="margin-bottom:8px">Saturday</div>${hm('sat', r.saturday_full_minutes)}</div>
            <label class="toggle-row" style="padding:0;border:0"><div class="txt"><b>Sunday is a paid weekly off</b><span>Sundays count as paid days (WO). Turn off if Sundays are unpaid.</span></div>
              <span class="switch"><input type="checkbox" name="sunday_paid_off" ${r.sunday_paid_off ? 'checked' : ''}><span></span></span></label>
            <div style="display:flex;justify-content:flex-end"><button class="btn btn-primary" type="submit">${icon('check', 'sm')}Save working hours</button></div>
          </div>
        </form>
        <div class="card">
          <div class="card-head"><div><h3>How each day is marked</h3><p>System calculation (pre-adjustment)</p></div></div>
          <div class="card-body rules-list">
            <div>${stChip('F')}<span><b>Full day</b> — both punch in and punch out, and the time between them meets the full-day hours.</span></div>
            <div>${stChip('HD')}<span><b>Half day</b> — both punches, but less than the full-day hours.</span></div>
            <div>${stChip('MP')}<span><b>Missed punch</b> — only IN or only OUT. Counted as a full day, except every 3rd missed punch in the month, which becomes a <b>half day</b>.</span></div>
            <div>${stChip('L')}<span><b>Leave</b> — no punch in and no punch out on a working day (also days missing from the sheet).</span></div>
            <div>${stChip('WO')}<span><b>Weekly off</b> — Sunday.</span></div>
            <div>${stChip('NA')}<span>Days before the employee’s date of joining are not counted.</span></div>
            <p class="muted" style="font-size:12.5px;margin-top:6px">Salary: daily salary = monthly salary ÷ 30. Payable = Full days × daily + Half days × daily × 0.5${r.sunday_paid_off ? ' (paid weekly offs count as full days)' : ''}, rounded to the nearest rupee. It is calculated from the post-adjustment (Final) line.</p>
          </div>
        </div>
      </div>`,
    mount() {
      mountPayrollActions();
      $('#rules-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.currentTarget.elements;
        const mins = (n) => (Number(f[`${n}_h`].value) || 0) * 60 + (Number(f[`${n}_m`].value) || 0);
        const value = { weekday_full_minutes: mins('wk'), saturday_full_minutes: mins('sat'), sunday_paid_off: f.sunday_paid_off.checked };
        if (value.weekday_full_minutes < 30 || value.weekday_full_minutes > 1440 || value.saturday_full_minutes < 30 || value.saturday_full_minutes > 1440) {
          return toast('Full-day time must be between 30 minutes and 24 hours.', 'error');
        }
        try {
          await withBusy($('button[type=submit]', ev.currentTarget), 'Saving…', () => payrollApi.saveRules(value));
          P.rules = { ...DEFAULT_RULES, ...value };
          toast('Working hours saved. The salary calculation now uses them.');
          render();
        } catch (err) { toast(friendlyError(err), 'error'); }
      });
    },
  };
}

    html: `
      <div class="card emp-head">${avatar(me, 'lg')}
        <div><h2>${esc(me.full_name)}</h2><div class="meta"><span>${esc(me.email)}</span>${vis.job_details && me.designation ? `<span>·</span><span>${esc(me.designation)}</span>` : ''}</div></div></div>
      <div class="card"><div class="card-head"><div><h3>Personal information</h3><p>Contact HR to correct any of these.</p></div></div>
        <div class="card-body kv" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
          ${kv('Name', me.full_name)}${kv('Mail ID', me.email)}${kv('Phone', me.phone)}
          ${kv('Date of birth', me.date_of_birth ? fmtDate(me.date_of_birth) : '')}${kv('Date of joining', me.date_of_joining ? fmtDate(me.date_of_joining) : '')}
        </div></div>
      ${vis.job_details ? `<div class="card"><div class="card-head"><div><h3>Employment</h3></div></div>
        <div class="card-body kv" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
          ${kv('Employee ID', me.employee_code)}${kv('Designation', me.designation)}${kv('Reporting manager', me.reporting_manager_name)}
        </div></div>` : ''}
      ${vis.salary ? `<div class="card"><div class="card-head"><div><h3>Salary history</h3><p>Latest first</p></div></div>
        ${rows.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Effective from</th><th class="num">Monthly salary</th><th></th></tr></thead><tbody>
          ${rows.map((r, i) => `<tr><td>${fmtMonth(r.effective_month)}</td><td class="num"><b style="color:var(--text)">${fmtINR(r.amount)}</b></td><td>${i === 0 ? '<span class="chip green">Current</span>' : ''}</td></tr>`).join('')}
          </tbody></table></div>` : emptyState('wallet', 'No salary records yet', 'HR has not added salary details.')}</div>` : ''}
      ${vis.kyc_documents && kyc ? `<div class="card"><div class="card-head"><div><h3>KYC</h3><p>Submitted during onboarding</p></div></div>
        <div class="card-body split" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)">
          <div>${docListHTML(kyc)}</div>
          <div class="grid" style="gap:22px">
            <div><div class="section-title">Bank details</div><div class="kv">${kv('Account number', maskAccount(kyc.bank_account_number), 'mono')}${kv('IFSC', kyc.bank_ifsc, 'mono')}</div></div>
            <div><div class="section-title">Emergency contact</div><div class="kv">${kv('Name', kyc.emergency_name)}${kv('Relationship', kyc.emergency_relationship)}${kv('Contact number', kyc.emergency_phone)}</div></div>
          </div></div></div>` : ''}`,
  };
}

/* =====================================================================
   BOOT
   ===================================================================== */
function renderSetup() {
  $('#app').innerHTML = `<div class="center-wrap" style="min-height:100vh"><div class="card status-card" style="max-width:560px;text-align:left">
    <div class="brand" style="margin-bottom:20px">${LOGO}<div>Altius HRMS<small>Setup required</small></div></div>
    <h2>Connect Supabase</h2>
    <p>${window.supabase ? 'Open <b>index.html</b> and set <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of the script (Supabase → Project Settings → API), then apply <code>supabase/migrations</code> (<code>supabase db push</code> or the SQL editor).' : 'The Supabase library could not be loaded. Check your internet connection and reload.'}</p>
  </div></div>`;
}

if (!db) {
  renderSetup();
} else {
  $('#app').innerHTML = `<div class="loading full">${spinnerHTML}</div>`;
  db.auth.onAuthStateChange((event, session) => {
    // Defer: Supabase recommends not awaiting other calls inside this callback.
    setTimeout(() => handleAuthEvent(event, session), 0);
  });
}

async function handleAuthEvent(event, session) {
  if (event === 'PASSWORD_RECOVERY') {
    state.recovery = true; state.session = session; state.user = session?.user || null;
    return renderAuth('reset');
  }
  if (event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') { state.session = session; return; }
  const sameUser = state.user && session?.user && state.user.id === session.user.id;
  state.session = session;
  state.user = session?.user || null;
  if (!session) {
    const wasSignedIn = !!state.profile;
    resetSessionState();
    if (state.signingOut) return; // signOut() renders the login screen itself
    if (wasSignedIn) {
      closeAllModals();
      history.replaceState(null, '', location.pathname);
      lastHash = '';
      toast('Your session has ended. Please sign in again.', 'error');
    }
    if (wasSignedIn || !$('#auth-form')) renderAuth('login');
    return;
  }
  if (state.recovery) return;
  if (sameUser && state.profile) return; // e.g. SIGNED_IN re-emitted on tab focus
  await loadSelfAndRoute();
}

// Never fail silently: surface unexpected errors to the user.
window.addEventListener('unhandledrejection', (e) => toast(friendlyError(e.reason), 'error'));
</script>
</body>
</html>
