/* ---------- Leaves register: admins record leaves day by day; payroll picks them up ---------- */
async function pageLeaves() {
  await ensurePayroll();
  const P = state.payroll;
  const all = P.leaves || [];
  const nowM = todayISO().slice(0, 7);
  const months = [...new Set([nowM, ...all.map((l) => l.leave_date.slice(0, 7))])].sort().reverse();
  const month = months.includes(state.leaveMonth) ? state.leaveMonth : nowM;
  const list = all.filter((l) => l.leave_date.startsWith(month))
    .sort((a, b) => b.leave_date.localeCompare(a.leave_date) || (byId(a.employee_id)?.full_name || '').localeCompare(byId(b.employee_id)?.full_name || ''));
  const emps = activeEmployees().slice().sort((a, b) => String(a.employee_code || '~').localeCompare(String(b.employee_code || '~'), undefined, { numeric: true }) || a.full_name.localeCompare(b.full_name));
  const label = (e) => `${e.employee_code || 'No EID'} · ${e.full_name}`;
  const days = (l) => (l.kind === 'half' ? 0.5 : 1);
  const totals = new Map();
  for (const l of list) totals.set(l.employee_id, (totals.get(l.employee_id) || 0) + days(l));
  const totalDays = [...totals.values()].reduce((a, b) => a + b, 0);
  return {
    title: 'Leaves', crumbs: 'Attendance · leave register', actions: `<a class="btn btn-sm btn-ghost" href="#/rules/leaves" title="Rules and formulas">${icon('info', 'sm')}Rules</a>`,
    html: `
      <div class="card"><div class="card-head"><div><h3>Record leave</h3><p>Type the Employee ID or name, pick the date (or a range)</p></div></div>
        <div class="card-body"><div class="cal-form">
          <input class="input" id="lv-emp" list="lv-emps" placeholder="Employee ID or name" autocomplete="off" style="flex:1.3;min-width:220px">
          <datalist id="lv-emps">${emps.map((e) => `<option value="${esc(label(e))}"></option>`).join('')}</datalist>
          <input class="input" type="date" id="lv-from" value="${todayISO()}" title="From">
          <input class="input" type="date" id="lv-to" title="To (optional)">
          <select class="input" id="lv-kind" style="width:auto"><option value="full">Full day</option><option value="half">Half day</option></select>
          <input class="input" id="lv-note" placeholder="Note (optional)" maxlength="120">
          <button class="btn btn-primary" id="lv-add">${icon('plus', 'sm')}Add</button></div></div></div>
      <div class="card"><div class="card-head"><div><h3>Leaves — ${fmtMonth(month + '-01')}</h3><p>${list.length} entr${list.length === 1 ? 'y' : 'ies'} · ${totalDays} day${totalDays === 1 ? '' : 's'} · ${totals.size} employee${totals.size === 1 ? '' : 's'}</p></div>
        <div class="right"><select class="input" id="lv-month" style="height:32px;width:auto">${months.map((x) => `<option value="${x}" ${x === month ? 'selected' : ''}>${fmtMonth(x + '-01')}</option>`).join('')}</select></div></div>
        ${list.length ? `<div class="table-wrap"><table class="table compact"><thead><tr><th>Date</th><th>Emp ID</th><th>Employee</th><th>Type</th><th>Note</th><th>Added</th><th></th></tr></thead><tbody>
          ${list.map((l) => { const e = byId(l.employee_id); return `<tr>
            <td class="nowrap"><b>${fmtDMY(l.leave_date)}</b> <span class="faint">${DAY_NAMES[parseISODate(l.leave_date).getDay()]}</span></td>
            <td class="mono">${esc(e?.employee_code || '—')}</td><td>${esc(e?.full_name || '—')}</td>
            <td>${l.kind === 'half' ? '<span class="st st-HD">HD</span> Half day' : '<span class="st st-L">L</span> Full day'}</td>
            <td class="wrap">${esc(l.note || '') || '<span class="faint">—</span>'}</td>
            <td class="nowrap muted" title="${esc(fmtDateTime(l.created_at))}">${esc(firstName(byId(l.created_by)?.full_name || ''))} · ${fmtRelative(l.created_at)}</td>
            <td class="actions"><button class="btn btn-sm btn-ghost" data-lv-remove="${l.id}" title="Remove">${icon('trash', 'sm')}</button></td></tr>`; }).join('')}
          </tbody></table></div>` : `<div class="card-body"><p class="muted" style="font-size:13px">No leaves recorded in ${fmtMonth(month + '-01')}.</p></div>`}
      </div>
      ${totals.size ? `<details class="card fold"><summary class="card-head"><div><h3>By employee — ${fmtMonth(month + '-01')}</h3><p>Total leave days in the month</p></div><div class="right">${icon('arrowRight', 'sm')}</div></summary>
        <div class="card-body"><div class="count-grid">${[...totals.entries()].sort((a, b) => b[1] - a[1]).map(([id, n]) => { const e = byId(id); return `<div><span class="st st-L">${esc(e?.employee_code || '—')}</span><b>${n}</b><span>${esc(e?.full_name || '—')}</span></div>`; }).join('')}</div></div></details>` : ''}`,
    mount() {
      $('#lv-month').addEventListener('change', (e) => { state.leaveMonth = e.target.value; render(); });
      $('#lv-add').addEventListener('click', async (ev) => {
        const txt = $('#lv-emp').value.trim().toLowerCase();
        const emp = emps.find((e) => label(e).toLowerCase() === txt) || emps.find((e) => normCode(e.employee_code) && normCode(e.employee_code) === normCode(txt))
          || (emps.filter((e) => e.full_name.toLowerCase() === txt).length === 1 ? emps.find((e) => e.full_name.toLowerCase() === txt) : null);
        if (!emp) return toast('Pick the employee from the list (Employee ID · name).', 'error');
        const a = $('#lv-from').value, b = $('#lv-to').value || a;
        if (!a) return toast('Pick the date.', 'error');
        if (b < a) return toast('“To” is before “From”.', 'error');
        const dates = []; for (let d = parseISODate(a), n = 0; d <= parseISODate(b) && n < 62; n++, d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) dates.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`);
        try {
          const n = await withBusy(ev.currentTarget, 'Adding…', () => api.rpc('admin_add_leaves', { p_employee: emp.id, p_dates: dates, p_kind: $('#lv-kind').value, p_note: $('#lv-note').value }));
          P.leaves = await payrollApi.leaves(); state.leaveMonth = a.slice(0, 7);
          toast(n ? `${n} leave day${n === 1 ? '' : 's'} recorded for ${emp.full_name}.` : 'No working days in that range (Sundays and holidays are skipped).');
          render();
        } catch (err) { toast(friendlyError(err), 'error'); }
      });
      $$('[data-lv-remove]').forEach((b) => b.addEventListener('click', async () => {
        const l = all.find((x) => x.id === b.dataset.lvRemove);
        if (!(await confirmDialog({ title: 'Remove this leave?', message: `${esc(byId(l.employee_id)?.full_name || '')} · ${fmtDMY(l.leave_date)} — payroll goes back to what the punches say for that day.`, confirmText: 'Remove', danger: true }))) return;
        try { await withBusy(b, '', () => api.rpc('admin_remove_leave', { p_id: l.id })); P.leaves = await payrollApi.leaves(); toast('Leave removed.'); render(); }
        catch (err) { toast(friendlyError(err), 'error'); }
      }));
    },
  };
}

/* ---------- Holidays & time relaxation (financial year 1 April – 31 March) ---------- */
function fyOptions(selected, extra = []) {
  const now = fyOf(todayISO());
  const years = [...new Set([now - 1, now, now + 1, ...extra])].sort((a, b) => b - a);
  return years.map((y) => `<option value="${y}" ${y === selected ? 'selected' : ''}>${fyLabel(y)} · 1 Apr ${y} – 31 Mar ${y + 1}</option>`).join('');
}
async function pageHolidays() {
  await ensurePayroll();
  const P = state.payroll;
  const fy = state.calFy ?? fyOf(todayISO());
  const [from, to] = fyRange(fy);
  const all = P.calendar || [];
  const inFy = all.filter((c) => c.day >= from && c.day <= to);
  const hol = inFy.filter((c) => c.kind === 'holiday'), rel = inFy.filter((c) => c.kind === 'relaxation');
  const dn = (iso) => DAY_NAMES[parseISODate(iso).getDay()];
  const regular = (iso) => (parseISODate(iso).getDay() === 6 ? P.rules.saturday_full_minutes : P.rules.weekday_full_minutes);
  const past = (iso) => iso < todayISO();
  return {
    title: 'Holidays & time relaxation', crumbs: 'Attendance · the calendar payroll follows', actions: `<a class="btn btn-sm btn-ghost" href="#/rules/holidays" title="Rules and formulas">${icon('info', 'sm')}Rules</a>`,
    html: `
      <div class="card"><div class="card-head"><div><h3>Financial year</h3><p>${hol.length} holiday${hol.length === 1 ? '' : 's'} · ${rel.length} time relaxation${rel.length === 1 ? '' : 's'}</p></div>
        <div class="right"><select class="input" id="cal-fy" style="height:34px;width:auto">${fyOptions(fy, all.map((c) => fyOf(c.day)))}</select></div></div></div>
      <div class="card" id="hol-card"><div class="card-head"><div><h3>Holidays</h3><p>Date and description</p></div></div>
        <div class="card-body">
          <div class="cal-form"><input class="input" type="date" id="h-date" min="${from}" max="${to}" title="Date">
            <input class="input" id="h-desc" placeholder="Description, e.g. Diwali" maxlength="80">
            <button class="btn btn-primary" id="h-add">${icon('plus', 'sm')}Add holiday</button></div>
        </div>
        ${hol.length ? `<div class="table-wrap"><table class="table compact"><thead><tr><th>Date</th><th>Day</th><th>Description</th><th>Payroll</th><th></th></tr></thead><tbody>
          ${hol.map((c) => `<tr class="${past(c.day) ? 'muted' : ''}"><td class="nowrap mono">${fmtDMY(c.day)}</td><td>${dn(c.day)}</td><td>${esc(c.description)}</td>
            <td>${parseISODate(c.day).getDay() === 0 ? '<span class="chip gray plain">Sunday — weekly off anyway</span>' : '<span class="st st-H">H</span> paid full day'}</td>
            <td class="actions"><button class="btn btn-sm btn-ghost" data-cal-remove="${c.id}" title="Remove">${icon('trash', 'sm')}</button></td></tr>`).join('')}
          </tbody></table></div>` : `<div class="card-body" style="padding-top:0"><p class="muted" style="font-size:13px">No holidays in ${fyLabel(fy)} yet.</p></div>`}
      </div>
      <div class="card" id="rel-card"><div class="card-head"><div><h3>Time relaxation</h3><p>Days with a shorter full day — date, description and the full-day time</p></div></div>
        <div class="card-body">
          <div class="cal-form"><input class="input" type="date" id="r-date" min="${from}" max="${to}" title="Date">

          ${rel.map((c) => `<tr class="${past(c.day) ? 'muted' : ''}"><td class="nowrap mono">${fmtDMY(c.day)}</td><td>${dn(c.day)}</td><td>${esc(c.description)}</td>
            <td class="num nowrap"><b style="color:var(--text)">${fmtHM(c.full_minutes)}</b></td><td class="num nowrap faint">${parseISODate(c.day).getDay() === 0 ? 'Sunday' : fmtHM(regular(c.day))}</td>
            <td class="actions"><button class="btn btn-sm btn-ghost" data-cal-remove="${c.id}" title="Remove">${icon('trash', 'sm')}</button></td></tr>`).join('')}
          </tbody></table></div>` : `<div class="card-body" style="padding-top:0"><p class="muted" style="font-size:13px">No time relaxation in ${fyLabel(fy)} yet.</p></div>`}
      </div>`,

      $('#cal-fy').addEventListener('change', (e) => { state.calFy = Number(e.target.value); render(); });
      const reload = async () => { P.calendar = await payrollApi.calendar(); render(); };
      const inRange = (d) => d && d >= from && d <= to;
      $('#h-add').addEventListener('click', async (ev) => {
        const d = $('#h-date').value, desc = $('#h-desc').value.trim();
        if (!inRange(d)) return toast(`Pick a date in ${fyLabel(fy)} (01-04-${fy} to 31-03-${fy + 1}).`, 'error');
        if (!desc) return toast('Add a description.', 'error');
        try { await withBusy(ev.currentTarget, 'Adding…', () => api.rpc('admin_add_calendar_day', { p_kind: 'holiday', p_day: d, p_description: desc, p_minutes: null })); toast(`Holiday added: ${desc} (${fmtDMY(d)}).`); await reload(); }
        catch (err) { toast(friendlyError(err), 'error'); }
      });
      $('#r-add').addEventListener('click', async (ev) => {
        const d = $('#r-date').value, desc = $('#r-desc').value.trim();
        const h = Number($('#r-h').value || 0), mm = Number($('#r-m').value || 0);
        if (!inRange(d)) return toast(`Pick a date in ${fyLabel(fy)} (01-04-${fy} to 31-03-${fy + 1}).`, 'error');
        if (!desc) return toast('Add a description.', 'error');
        const mins = h * 60 + mm;
        if (!(mins > 0) || h > 23 || mm > 59 || !Number.isInteger(h) || !Number.isInteger(mm)) return toast('Enter the full-day time in hours and minutes, e.g. 5 h 00 m.', 'error');
        const usual = regular(d);
        if (mins >= usual && parseISODate(d).getDay() !== 0) return toast(`A time relaxation must be shorter than the usual ${fmtHM(usual)} for that day.`, 'error');
        try { await withBusy(ev.currentTarget, 'Adding…', () => api.rpc('admin_add_calendar_day', { p_kind: 'relaxation', p_day: d, p_description: desc, p_minutes: mins })); toast(`Time relaxation added: ${fmtHM(mins)} on ${fmtDMY(d)}.`); await reload(); }
        catch (err) { toast(friendlyError(err), 'error'); }
      });
      $$('[data-cal-remove]').forEach((b) => b.addEventListener('click', async () => {
        const c = all.find((x) => x.id === b.dataset.calRemove);
        if (!(await confirmDialog({ title: `Remove ${c.kind === 'holiday' ? 'holiday' : 'time relaxation'}?`, message: `<b>${esc(c.description)}</b> on ${fmtDMY(c.day)} is taken out of the calendar and payroll. It stays in the activity log.`, confirmText: 'Remove', danger: true }))) return;
        try { await withBusy(b, '', () => api.rpc('admin_remove_calendar_day', { p_id: c.id })); toast('Removed from the calendar.'); await reload(); }
        catch (err) { toast(friendlyError(err), 'error'); }
      }));
    },
  };
}

/* ---------- WFH: dates employees added; a WFH day with no punches is paid as a full day ---------- */
async function pageAdminWfh() {
  await ensurePayroll();
  const P = state.payroll;
  const run = currentRun();
  const all = P.wfh || [];
  const months = [...new Set([...(run ? [run.month.slice(0, 7)] : []), todayISO().slice(0, 7), ...all.map((w) => w.work_date.slice(0, 7))])].sort().reverse();
  const month = months.includes(state.wfhMonth) ? state.wfhMonth : run ? run.month.slice(0, 7) : todayISO().slice(0, 7);
  const inMonth = all.filter((w) => w.work_date.startsWith(month)).sort((a, b) => a.work_date.localeCompare(b.work_date) || (byId(a.employee_id)?.full_name || '').localeCompare(byId(b.employee_id)?.full_name || ''));
  const byAdminW = (w) => !!w.added_by && w.added_by !== w.employee_id;
  const split = { employee: inMonth.filter((w) => !byAdminW(w)), admin: inMonth.filter(byAdminW) };
  const tab = state.wfhBy === 'admin' ? 'admin' : 'employee';
  const list = split[tab];
  // How the day ends up in this month's attendance (only when the sheet for that month is loaded)
  const effect = new Map();
  if (run && run.month.startsWith(month)) {
    for (const m of payrollSheet().mapped) for (const d of m.days) if (d.wfh) effect.set(`${m.emp.id}|${d.iso}`, d);
  }
  const effectText = (w) => {
    if (w.status !== 'recorded') return '<span class="faint">Not counted</span>';
    const d = effect.get(`${w.employee_id}|${w.work_date}`);
    if (!d) return run && run.month.startsWith(month) ? '<span class="faint">Not in this sheet</span>' : '<span class="faint">Applied when the sheet is uploaded</span>';
    if (d.sys === 'WFH') return `${stChip('WFH')} paid full day`;
    return `${stChip(d.sys)} <span class="faint">${d.sys === 'NA' ? 'not counted' : 'has punches — counted from them'}</span>`;
  };
  const by = (w) => (w.added_by && w.added_by !== w.employee_id ? `Admin (${esc(byId(w.added_by)?.full_name || '—')})` : 'Employee');
  const recorded = list.filter((w) => w.status === 'recorded').length;
  return {
    title: 'WFH', crumbs: 'Attendance · work-from-home days', actions: `<a class="btn btn-sm btn-ghost" href="#/rules/wfh" title="Rules and formulas">${icon('info', 'sm')}Rules</a>`,
    html: `

          <button class="btn btn-sm btn-primary" id="wfh-add">${icon('plus', 'sm')}Add WFH</button></div></div>
        ${list.length ? `<div class="table-wrap"><table class="table compact"><thead><tr><th>Employee</th><th>Date</th><th>Note</th><th>Added</th><th>In payroll</th><th>Status</th><th></th></tr></thead><tbody>
          ${list.map((w) => { const e = byId(w.employee_id); return `<tr>
            <td>${e ? person(e, esc(e.employee_code || 'No EID')) : '—'}</td>
            <td class="nowrap"><b>${fmtDMY(w.work_date)}</b> <span class="faint">${DAY_NAMES[parseISODate(w.work_date).getDay()]}</span></td>

    mount() {

  return {

        <div class="card">
          <div class="card-head"><div><h3>Professional Tax slabs</h3><p>Monthly salary band → PT deducted each month</p></div>

          <div class="table-wrap"><table class="table compact">
            <thead><tr><th>Salary from</th><th>Salary to</th><th>PT amount</th><th></th></tr></thead>
            <tbody id="pt-body">${rowsHTML()}</tbody></table></div>
          <div class="card-body" style="border-top:1px solid var(--border);display:flex;justify-content:flex-end">
            <button class="btn btn-primary" id="pt-save">${icon('check', 'sm')}Save slabs</button></div>
        </div>
        <div class="card"><div class="card-head"><div><h3>How it is applied</h3></div></div>
          <div class="card-body rules-list">
            <div>${icon('info')}<span>Each employee’s <b>monthly salary</b> (the salary used for that payroll month, from Employee Master Data) is checked against these bands, and the matching PT amount is deducted from the earned amount.</span></div>
            <div>${icon('info')}<span>Net payable = Earned − PT. It shows in the Salary Calculation table, on each employee’s day-wise page and in the saved payroll.</span></div>
            <div>${icon('alert')}<span>The slabs are prefilled with West Bengal rates as a starting point — check them against the current notification and edit if needed. Leave “Salary to” empty for the top slab.</span></div>
          </div></div>
      </div>`,
    mount() {
      mountPayrollActions();
      const body = $('#pt-body');
      body.addEventListener('input', (e) => {
        const t = e.target.closest('[data-k]');
        if (t) slabs[Number(t.dataset.i)][t.dataset.k] = t.value.replace(/[^\d]/g, '');
      });
      body.addEventListener('click', (e) => {
        const b = e.target.closest('[data-del]');
        if (!b) return;
        slabs.splice(Number(b.dataset.del), 1);
        body.innerHTML = rowsHTML();
      });
      $('#pt-add').addEventListener('click', () => {
        const last = slabs[slabs.length - 1];
        slabs.push({ min: last && last.max !== '' && last.max != null ? Number(last.max) + 1 : '', max: '', amount: '' });
        body.innerHTML = rowsHTML();
      });
      $('#pt-save').addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        const clean = slabs.map((x) => ({ min: Number(x.min || 0), max: x.max === '' || x.max == null ? null : Number(x.max), amount: Number(x.amount || 0) }))
          .sort((a, b) => a.min - b.min);
        for (let i = 0; i < clean.length; i++) {
          const x = clean[i];
          if (x.max != null && x.max < x.min) return toast(`A slab ends (₹${x.max}) before it starts (₹${x.min}).`, 'error');
          const next = clean[i + 1];
          if (next && (x.max == null || next.min <= x.max)) return toast('Slabs overlap — each slab must start after the previous one ends.', 'error');
        }
        try {
          await withBusy(btn, 'Saving…', () => payrollApi.savePt({ slabs: clean }));
          P.pt = { slabs: clean };
          toast('Professional Tax slabs saved.');
          render();
        } catch (err) { toast(friendlyError(err), 'error'); }
      });
    },
  };
}

/* =====================================================================
   FINANCE — Variable, Bonus & Leave Encash, Monthly Expense, ESOPs
   ===================================================================== */
state.fin = { loaded: false, eligibility: [], bonus: [], expenses: [], expenseSource: null, variablePayouts: [], loans: [], loanDeductions: [], loanRepayments: [], log: [] };

const finApi = {
  eligibility: () => fetchAll(() => db.from('comp_eligibility').select('employee_id, program, eligible').order('employee_id')),
  variablePayouts: () => fetchAll(() => db.from('variable_payouts').select('*').is('removed_at', null).order('pay_month', { ascending: false })),
  loans: () => fetchAll(() => db.from('loans').select('*').is('removed_at', null).order('taken_on', { ascending: false })),
  loanDeductions: () => fetchAll(() => db.from('loan_deductions').select('*').is('voided_at', null).order('created_at')),
  loanRepayments: () => fetchAll(() => db.from('loan_repayments').select('*').is('voided_at', null).order('paid_on')),
  log: () => fetchAll(() => db.from('finance_log').select('*').order('created_at', { ascending: false })),
  bonus: () => fetchAll(() => db.from('bonus_payments').select('*').is('removed_at', null).order('pay_month', { ascending: false })),
  expenses: () => fetchAll(() => db.from('expense_claims').select('*').order('submitted_at', { ascending: false })),
  expenseSource: async () => {
    const row = await q(db.from('app_settings').select('value').eq('key', 'expense_source').maybeSingle());
    return { url: '', columns: {}, ...(row?.value || {}) };
  },
  saveExpenseSource: (value) => q(db.from('app_settings')
    .update({ value, updated_by: state.user.id, updated_at: new Date().toISOString() })
    .eq('key', 'expense_source').select()),
};
async function ensureFinance(force = false) {
  await ensureAdmin();
  if (state.fin.loaded && !force) return;
  const [eligibility, bonus, expenses, expenseSource, variablePayouts, loans, loanDeductions, loanRepayments, log] = await Promise.all([
    finApi.eligibility(), finApi.bonus(), finApi.expenses(), finApi.expenseSource(),
    finApi.variablePayouts(), finApi.loans(), finApi.loanDeductions(), finApi.loanRepayments(), finApi.log()]);
  state.fin = { loaded: true, eligibility, bonus, expenses, expenseSource, variablePayouts, loans, loanDeductions, loanRepayments, log };
}
const currentSalary = (empId) => { const rows = salariesOf(empId); return rows.length ? Number(rows[rows.length - 1].amount) : null; };
const eligibleIds = (program) => new Set(state.fin.eligibility.filter((x) => x.program === program && x.eligible).map((x) => x.employee_id));
const eligibleEmployees = (program) => { const ids = eligibleIds(program); return activeEmployees().filter((e) => ids.has(e.id)); };
const fmtPct = (n) => `${Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 4 })}%`;
const num = (v) => { const n = Number(String(v ?? '').replace(/[^\d.\-]/g, '')); return Number.isFinite(n) ? n : 0; };

const logMonths = (section) => [...new Set(state.fin.log.filter((x) => x.section === section && x.month).map((x) => x.month))].sort().reverse();
function monthLogCard(section, key) {
  const months = logMonths(section);
  const pick = state.logMonth?.[key] && (state.logMonth[key] === 'all' || months.includes(state.logMonth[key])) ? state.logMonth[key] : (months[0] || 'all');

function mountLogMonth() {

/* ---------- Loans helpers ---------- */
// Repaid = deductions from Variable / Bonus lines + manual repayments
const loanDeducted = (loanId) => state.fin.loanDeductions.filter((d) => d.loan_id === loanId).reduce((s, d) => s + Number(d.amount), 0)
  + state.fin.loanRepayments.filter((x) => x.loan_id === loanId).reduce((s, x) => s + Number(x.amount), 0);
const loanLeft = (loan) => Number(loan.amount) - loanDeducted(loan.id);
const empLoanLeft = (empId) => state.fin.loans.filter((l) => l.employee_id === empId).reduce((s, l) => s + loanLeft(l), 0);

/* ---------- Variable (uploaded sheet) ---------- */
const VAR_COLS = {
  code: ['empid', 'employeeid', 'empcode', 'employeecode', 'ecode', 'code', 'id'],
  name: ['name', 'empname', 'employeename', 'employee'],
  amount: ['variableamount', 'variable', 'amount', 'variablepay', 'payout', 'netvariable', 'netamount', 'total', 'finalamount'],
  remarks: ['remarks', 'remark', 'note', 'notes', 'comment', 'comments'],
};
function parseVariableRows(rows) {
  const norm = (v) => String(v ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
  for (let h = 0; h < Math.min(rows.length, 30); h++) {
    const cells = (rows[h] || []).map(norm);
    const find = (names) => { for (const n of names) { const i = cells.indexOf(n); if (i >= 0) return i; } return -1; };
    const c = { code: find(VAR_COLS.code), name: find(VAR_COLS.name), amount: find(VAR_COLS.amount), remarks: find(VAR_COLS.remarks) };
    if (c.code < 0 || c.amount < 0) continue;
    const out = [];
    for (const row of rows.slice(h + 1)) {
      const code = typeof row[c.code] === 'number' ? String(row[c.code]) : String(row[c.code] ?? '').trim();
      if (!code) continue;
      const amt = row[c.amount];
      out.push({ emp_code: code, emp_name: c.name >= 0 ? String(row[c.name] ?? '').trim() : '', amount: typeof amt === 'number' ? amt : num(amt), remarks: c.remarks >= 0 ? String(row[c.remarks] ?? '').trim() : '' });
    }
    return out;
  }
  throw new Error('Could not find the columns. The sheet needs an “Emp ID” column and a “Variable Amount” column (download the template).');
}
function downloadVariableTemplate() {
  const cell = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = activeEmployees().map((e) => [e.employee_code || '', e.full_name, '', ''].map(cell).join(','));
  const blob = new Blob(['﻿' + ['Emp ID,Name,Variable Amount,Remarks', ...lines].join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'altius-variable-template.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function pickVariableFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls,.csv';
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      await loadXLSX();
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      let rows = null, lastErr = null;
      for (const n of wb.SheetNames) {
        try { rows = parseVariableRows(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' })); break; } catch (e) { lastErr = e; }
      }
      if (!rows) throw lastErr;
      showVariableImport(file, rows);
    } catch (e) { toast(friendlyError(e), 'error'); }
  });
  input.click();
}
function showVariableImport(file, rows) {
  const now = new Date();
  const byCode = (code) => activeEmployees().find((e) => normCode(e.employee_code) && normCode(e.employee_code) === normCode(code));
  const { el, close } = openModal({
    title: 'Upload variable sheet', size: 'md', subtitle: `${esc(file.name)} · rows are matched to employees by Emp ID`,
    body: `<div class="field" style="margin-bottom:14px"><label>Payout month</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:280px">${monthYearSelects('vup', now.getFullYear(), now.getMonth() + 1)}</div></div>
      <div id="vup-summary"></div>`,
    footer: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-save>${icon('upload', 'sm')}Import</button>`,
  });
  const month = () => monthStart($('[data-y="vup"]', el).value, Number($('[data-m="vup"]', el).value));
  const draw = () => {
    const existing = state.fin.variablePayouts.filter((v) => v.pay_month === month()).length;
    const matched = rows.filter((r) => byCode(r.emp_code));
    $('#vup-summary', el).innerHTML = `
      <div class="kv" style="margin-bottom:12px"><div><div class="k">Rows</div><div class="v">${rows.length}</div></div><div><div class="k">Matched by Emp ID</div><div class="v">${matched.length}</div></div>
        <div><div class="k">Total variable</div><div class="v">${fmtINR(rows.reduce((s, r) => s + Number(r.amount || 0), 0))}</div></div><div><div class="k">Not matched</div><div class="v">${rows.length - matched.length}</div></div></div>
      ${existing ? `<label class="check-inline" style="margin-bottom:10px"><input type="checkbox" id="vup-replace" checked> Replace the ${existing} row(s) already uploaded for ${fmtMonth(month())} (their loan deductions are reversed)</label>` : ''}
      <div class="table-wrap" style="max-height:240px;border:1px solid var(--border);border-radius:10px"><table class="table compact"><thead><tr><th>Emp ID</th><th>Name in sheet</th><th>Employee (EMD)</th><th class="num">Amount</th></tr></thead><tbody>
        ${rows.map((r) => { const e = byCode(r.emp_code); return `<tr><td class="mono">${esc(r.emp_code)}</td><td>${esc(r.emp_name || '—')}</td><td>${e ? esc(e.full_name) : '<span class="chip red plain">Emp ID not in EMD</span>'}</td><td class="num">${fmtINR(r.amount)}</td></tr>`; }).join('')}
      </tbody></table></div>`;
  };
  $$('[data-m="vup"], [data-y="vup"]', el).forEach((s) => s.addEventListener('change', draw));
  draw();
  $('[data-save]', el).addEventListener('click', async (ev) => {
    const replace = $('#vup-replace', el) ? $('#vup-replace', el).checked : true;
    try {
      const res = await withBusy(ev.currentTarget, 'Importing…', () => api.rpc('admin_import_variable', { p_month: month(), p_file_name: file.name, p_rows: rows, p_replace: replace }));
      close();
      archiveUpload('Variable', file);
      state.variableMonth = month();
      toast(`Variable for ${fmtMonth(month())} imported — ${res?.rows ?? rows.length} row(s)${res?.unmatched ? `, ${res.unmatched} not matched` : ''}.`);
      await ensureFinance(true);
      render();
    } catch (err) { toast(friendlyError(err), 'error'); }
  });
}

async function pageVariable(r) {
  await ensureFinance();
  if (r.id) return pageVariableEmployee(r.id);
  const all = state.fin.variablePayouts;
  const months = [...new Set(all.map((v) => v.pay_month))].sort().reverse();
  const month = state.variableMonth && months.includes(state.variableMonth) ? state.variableMonth : months[0];
  const lines = all.filter((v) => v.pay_month === month).sort((a, b) => String(a.emp_name || a.emp_code).localeCompare(String(b.emp_name || b.emp_code)));
  const edits = new Map(lines.map((v) => [v.id, { amount: String(Number(v.loan_deduction) || ''), full: v.deduct_full }]));
  const lineHTML = (v) => {
    const e = byId(v.employee_id);
    const ed = edits.get(v.id);
    const left = e ? empLoanLeft(e.id) + Number(v.loan_deduction) : 0; // what this line could still take
    const ded = ed.full ? Math.min(Number(v.amount), left) : num(ed.amount);
    return `<tr data-id="${v.id}">
      <td class="mono">${esc(v.emp_code)}</td>
      <td>${e ? `<a class="plain-link" href="#/variable/${e.id}">${person(e, esc(e.designation || ''))}</a>` : `${esc(v.emp_name || '—')}<div><span class="chip red plain">Emp ID not in EMD</span></div>`}</td>
      <td class="num nowrap"><b style="color:var(--text)">${fmtINR(v.amount)}</b></td>
      <td class="num nowrap">${e ? (left > 0 ? fmtINR(empLoanLeft(e.id)) : '<span class="faint">No loan</span>') : '—'}</td>
      <td style="min-width:130px">${e && left > 0 ? `<div class="rs-in"><span>₹</span><input class="input mono" data-ded="${v.id}" inputmode="decimal" style="height:34px" value="${esc(ed.full ? String(ded) : ed.amount)}" ${ed.full ? 'disabled' : ''}></div>` : '<span class="faint">—</span>'}</td>
      <td class="nowrap">${e && left > 0 ? `<label class="check-inline"><input type="checkbox" data-full="${v.id}" ${ed.full ? 'checked' : ''}> Deduct full</label>` : ''}</td>
      <td class="num nowrap" data-net><b>${fmtINR(Number(v.amount) - (e ? ded : 0))}</b></td>
      <td class="wrap" style="max-width:180px;font-size:12.5px">${esc(v.remarks || '')}</td>
      <td class="actions nowrap">${e ? `<a class="btn btn-sm" href="#/variable/${e.id}">Details</a>` : ''}<button class="icon-btn" data-remove="${v.id}" title="Remove line">${icon('trash')}</button></td></tr>`;
  };
  const totals = () => lines.reduce((a, v) => { const e = byId(v.employee_id); const ed = edits.get(v.id); const left = e ? empLoanLeft(e.id) + Number(v.loan_deduction) : 0; const ded = e ? (ed.full ? Math.min(Number(v.amount), left) : num(ed.amount)) : 0; return { gross: a.gross + Number(v.amount), ded: a.ded + ded }; }, { gross: 0, ded: 0 });
  return {
    title: 'Variable',
    crumbs: 'Upload the calculated variable sheet — rows are matched to employees by Emp ID',
    actions: `${months.length ? `<select class="input" id="var-month" style="height:34px;width:auto;min-width:140px">${months.map((m) => `<option value="${m}" ${m === month ? 'selected' : ''}>${fmtMonth(m)}</option>`).join('')}</select>` : ''}
      <button class="btn btn-sm" id="var-template">${icon('download', 'sm')}Template</button><button class="btn btn-sm btn-primary" id="var-upload">${icon('upload', 'sm')}Upload sheet</button>`,
    html: `
      ${months.length ? '' : `<div class="alert alert-info">${icon('info')}<span>Download the <b>Template</b> (Emp ID · Name · Variable Amount · Remarks, prefilled with your employees), fill in the calculated amounts, then <b>Upload sheet</b>. Your own sheet works too if it has an “Emp ID” column and a “Variable Amount” (or “Amount”) column.</span></div>`}
      <div class="card">
        <div class="card-head"><div><h3>${month ? `Variable — ${fmtMonth(month)}` : 'Variable'}</h3><p id="var-totals">${month ? (() => { const t = totals(); return `${lines.length} line(s) · ${fmtINR(t.gross)} variable − ${fmtINR(t.ded)} loan deduction = <b>${fmtINR(t.gross - t.ded)}</b> net`; })() : 'No sheet uploaded yet'}</p></div></div>
        ${lines.length ? `<div class="table-wrap"><table class="table compact"><thead><tr><th>Emp ID</th><th>Name</th><th class="num">Variable</th><th class="num">Loan remaining</th><th>Loan deduct (₹)</th><th></th><th class="num">Net payout</th><th>Remarks</th><th></th></tr></thead>
          <tbody id="var-body">${lines.map(lineHTML).join('')}</tbody></table></div>` : emptyState('upload', 'No variable uploaded', 'Click <b>Upload sheet</b> to import the calculated variable for a month.')}
      </div>
      ${monthLogCard('variable', 'variable')}
      <div class="savebar hidden" id="savebar"><div class="grow"><b>Unsaved loan deductions</b> <span>— save to deduct from the loans</span></div>
        <button class="btn btn-sm" id="discard-btn">Discard</button><button class="btn btn-sm btn-light" id="save-btn">${icon('check', 'sm')}Save deductions</button></div>`,
    mount() {
      mountLogMonth();
      $('#var-template').addEventListener('click', downloadVariableTemplate);
      $('#var-upload').addEventListener('click', pickVariableFile);
      $('#var-month')?.addEventListener('change', (e) => { state.variableMonth = e.target.value; render(); });
      const body = $('#var-body');
      if (!body) return;
      const dirty = new Set();
      const refresh = (id, redraw = true) => {
        const v = lines.find((x) => x.id === id);
        if (redraw) body.querySelector(`tr[data-id="${id}"]`).outerHTML = lineHTML(v);
        else body.querySelector(`tr[data-id="${id}"] [data-net]`).innerHTML = `<b>${fmtINR(Number(v.amount) - num(edits.get(id).amount))}</b>`;
        const t = totals();
        $('#var-totals').innerHTML = `${lines.length} line(s) · ${fmtINR(t.gross)} variable − ${fmtINR(t.ded)} loan deduction = <b>${fmtINR(t.gross - t.ded)}</b> net`;
        state.dirty = dirty.size > 0;
        $('#savebar').classList.toggle('hidden', !dirty.size);
      };
      body.addEventListener('input', (ev) => {
        const id = ev.target.dataset.ded;
        if (!id) return;
        edits.get(id).amount = ev.target.value.replace(/[^\d.]/g, '');
        dirty.add(id);
        refresh(id, false);
      });
      body.addEventListener('change', (ev) => {
        const id = ev.target.dataset.full;
        if (!id) return;
        edits.get(id).full = ev.target.checked;
        dirty.add(id);
        refresh(id);
      });
      body.addEventListener('click', async (ev) => {
        const b = ev.target.closest('[data-remove]');
        if (!b) return;
        if (!(await confirmDialog({ title: 'Remove this line?', message: 'The line and any loan deduction on it are reversed. It stays in the log.', confirmText: 'Remove', danger: true }))) return;
        try { await api.rpc('admin_remove_variable_payout', { p_id: b.dataset.remove }); toast('Line removed.'); state.dirty = false; await ensureFinance(true); render(); }
        catch (err) { toast(friendlyError(err), 'error'); }
      });
      $('#discard-btn').addEventListener('click', () => { state.dirty = false; render(); });
      $('#save-btn').addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        for (const id of dirty) {
          const v = lines.find((x) => x.id === id);
          if (!edits.get(id).full && num(edits.get(id).amount) > Number(v.amount)) return toast(`Loan deduction for ${esc(v.emp_name || v.emp_code)} is more than the variable amount.`, 'error');
        }
        try {
          await withBusy(btn, 'Saving…', async () => {
            for (const id of dirty) await api.rpc('admin_set_loan_deduction', { p_source: 'variable', p_id: id, p_amount: num(edits.get(id).amount), p_full: edits.get(id).full });
          });
          state.dirty = false;
          toast('Loan deductions saved.');
          await ensureFinance(true);
          render();
        } catch (err) { toast(friendlyError(err), 'error'); }
      });
    },
  };
}

/* ---------- Bonus & Leave Encash ---------- */
const bonusDate = (b) => b.pay_date || b.pay_month;
const fmtSlash = (iso) => fmtDMY(iso).replace(/-/g, '/');
// Loan deduction cell: the amount, or "No loan" when the employee had no loan at the time.
function bonusLoanCell(b) {
  if (Number(b.loan_deduction) > 0) return `${fmtINR(b.loan_deduction)}${b.deduct_full ? ' <span class="chip plain gray">full</span>' : ''}`;
  const hadLoan = state.fin.loans.some((l) => l.employee_id === b.employee_id && l.taken_on <= bonusDate(b));
  return hadLoan ? '<span class="faint">Not deducted</span>' : '<span class="faint">No loan</span>';
}
// One line per payment: Date | Employee | E-Code | Desc. | Amount | Loan Deduction | Net Amount
function bonusLedgerHTML(lines, { showEmployee = true } = {}) {
  const list = [...lines].sort((a, b) => String(bonusDate(b)).localeCompare(String(bonusDate(a))) || String(b.created_at).localeCompare(String(a.created_at)));
  const tot = list.reduce((a, b) => ({ amt: a.amt + Number(b.amount), ded: a.ded + Number(b.loan_deduction) }), { amt: 0, ded: 0 });
  if (!list.length) return emptyState('wallet', 'No payments yet', 'Saved payments show here, one line each.');
  return `<div class="table-wrap"><table class="table compact ledger"><thead><tr><th>Date</th>${showEmployee ? '<th>Employee</th><th>E-Code</th>' : ''}<th>Desc.</th><th class="num">Amount</th><th class="num">Loan deduction</th><th class="num">Net amount</th></tr></thead>
    <tbody>${list.map((b) => { const e = byId(b.employee_id); return `<tr>
      <td class="nowrap">${fmtSlash(bonusDate(b))}</td>
      ${showEmployee ? `<td>${e ? `<a class="plain-link" href="#/bonus/${e.id}"><b style="color:var(--text);font-weight:600">${esc(e.full_name)}</b></a>` : '—'}</td><td class="mono">${esc(e?.employee_code || '—')}</td>` : ''}
      <td class="wrap">${esc(b.description)}${b.use_current_salary ? ' <span class="chip plain gray">current salary</span>' : ''}</td>
      <td class="num nowrap">${fmtINR(b.amount)}</td><td class="num nowrap">${bonusLoanCell(b)}</td>
      <td class="num nowrap"><b style="color:var(--text)">${fmtINR(Number(b.amount) - Number(b.loan_deduction))}</b></td></tr>`; }).join('')}</tbody>
    <tfoot><tr><td colspan="${showEmployee ? 4 : 2}" style="text-align:right;font-weight:600">Total</td><td class="num nowrap">${fmtINR(tot.amt)}</td><td class="num nowrap">${fmtINR(tot.ded)}</td><td class="num nowrap"><b style="color:var(--text)">${fmtINR(tot.amt - tot.ded)}</b></td></tr></tfoot>
  </table></div>`;
}

async function pageBonus(r) {
  await ensureFinance();
  if (r?.id) return pageBonusEmployee(r.id);
  const emps = eligibleEmployees('bonus');
  let uid = 0;
  const blank = () => ({ key: ++uid, employee_id: '', description: '', pay_date: todayISO(), amount: '', use_current_salary: false, loan: '', full: false });
  const rows = [blank()];
  const rowAmount = (r) => (r.use_current_salary ? currentSalary(r.employee_id) || 0 : num(r.amount));
  const room = (r) => (r.employee_id ? empLoanLeft(r.employee_id) : 0);
  const rowDeduction = (r) => (room(r) > 0 ? (r.full ? Math.min(rowAmount(r), room(r)) : num(r.loan)) : 0);
  const touched = (r) => r.employee_id || r.description.trim() || num(r.amount) > 0;
  const lineHTML = (r) => {
    const loanLeft = room(r);
    const sal = currentSalary(r.employee_id);
    return `<div class="bn-row" data-key="${r.key}">
      <div class="bn-cell"><select class="input" data-k="employee_id"><option value="">Select employee</option>
          ${emps.map((e) => `<option value="${e.id}" ${e.id === r.employee_id ? 'selected' : ''}>${esc(e.full_name)}${e.employee_code ? ` · ${esc(e.employee_code)}` : ''}</option>`).join('')}</select>
        <div class="bn-sub">${r.employee_id ? (loanLeft > 0 ? `Loan remaining ${fmtINR(loanLeft)}` : 'No loan') : ''}</div></div>
      <div class="bn-cell"><input class="input" data-k="description" placeholder="e.g. Diwali bonus / Leave encashment" value="${esc(r.description)}"><div class="bn-sub"></div></div>
      <div class="bn-cell"><input class="input" type="date" data-k="pay_date" value="${r.pay_date}"><div class="bn-sub">${r.pay_date ? fmtSlash(r.pay_date) : ''}</div></div>
      <div class="bn-cell"><div class="rs-in"><span>₹</span><input class="input mono" data-k="amount" inputmode="decimal" value="${esc(r.use_current_salary ? String(rowAmount(r) || '') : r.amount)}" ${r.use_current_salary ? 'disabled' : ''}></div>
        <label class="bn-sub check-inline"><input type="checkbox" data-k="use_current_salary" ${r.use_current_salary ? 'checked' : ''}> Current salary${r.use_current_salary && r.employee_id && sal == null ? ' <span class="error-text">· none in EMD</span>' : ''}</label></div>
      <div class="bn-cell">${loanLeft > 0 ? `<div class="rs-in"><span>₹</span><input class="input mono ${!r.full && !r.loan ? 'need' : ''}" data-k="loan" inputmode="decimal" placeholder="Fill manually" value="${esc(r.full ? String(rowDeduction(r)) : r.loan)}" ${r.full ? 'disabled' : ''}></div>
          <label class="bn-sub check-inline"><input type="checkbox" data-k="full" ${r.full ? 'checked' : ''}> Deduct full</label>`
        : `<div class="input bn-static faint">${r.employee_id ? 'No loan' : '—'}</div><div class="bn-sub"></div>`}</div>
      <div class="bn-cell bn-net" data-net>${fmtINR(rowAmount(r) - rowDeduction(r))}</div>
      <div class="bn-cell"><button type="button" class="icon-btn" data-del="${r.key}" title="Remove this unsaved line">${icon('x')}</button></div>
    </div>`;
  };
  const months = [...new Set(state.fin.bonus.map((b) => String(bonusDate(b)).slice(0, 7)))].sort().reverse();
  const pick = state.bonusMonth === 'all' || months.includes(state.bonusMonth) ? state.bonusMonth : 'all';
  const ledgerLines = state.fin.bonus.filter((b) => pick === 'all' || String(bonusDate(b)).startsWith(pick));
  return {
    title: 'Bonus & Leave Encash',
    crumbs: 'One-off payments to eligible employees',
    actions: `<button class="btn btn-sm" id="elig-btn">${icon('users', 'sm')}Manage eligibility</button>`,
    html: `
      ${emps.length ? '' : `<div class="alert alert-warn">${icon('alert')}<span>No one is eligible yet. Click <b>Manage eligibility</b> to pick the employees who can receive bonus or leave encashment.</span></div>`}
      <div class="card">
        <div class="card-head"><div><h3>Add payments</h3><p>Fill a line per payment and click Save. Saved payments move to the log below and cannot be edited or removed.</p></div>
          <div class="right"><button class="btn btn-sm" id="bulk-btn" ${emps.length ? '' : 'disabled'}>${icon('users', 'sm')}Bulk populate</button><button class="btn btn-sm" id="add-line" ${emps.length ? '' : 'disabled'}>${icon('plus', 'sm')}Add line</button></div></div>
        <div class="bn-wrap"><div class="bn-row bn-head"><div>Employee</div><div>Description</div><div>Date</div><div>Amount</div><div>Loan deduct (₹)</div><div class="num">Net</div><div></div></div>
          <div id="bonus-body">${emps.length ? rows.map(lineHTML).join('') : ''}</div></div>
        <div class="card-foot"><span class="muted" id="bonus-total" style="font-size:13px"></span><button class="btn btn-primary" id="save-btn" ${emps.length ? '' : 'disabled'}>${icon('check', 'sm')}Save payments</button></div>
      </div>
      <div class="card">
        <div class="card-head"><div><h3>Payments log</h3><p>Every saved payment, one line each</p></div>
          <div class="right"><select class="input" id="bonus-month" style="height:32px;width:auto;min-width:130px"><option value="all">All months</option>${months.map((m) => `<option value="${m}" ${m === pick ? 'selected' : ''}>${fmtMonth(m + '-01')}</option>`).join('')}</select></div></div>
        ${bonusLedgerHTML(ledgerLines)}
      </div>`,
    mount() {
      const body = $('#bonus-body');
      $('#elig-btn').addEventListener('click', () => openEligibilityDialog('bonus', 'Bonus & Leave Encash'));
      $('#bonus-month').addEventListener('change', (e) => { state.bonusMonth = e.target.value; render(); });
      if (!emps.length) return;
      const rowOf = (el) => rows.find((r) => r.key === Number(el.closest('.bn-row').dataset.key));
      const elOf = (r) => body.querySelector(`.bn-row[data-key="${r.key}"]`);
      const total = () => {
        const live = rows.filter(touched);
        $('#bonus-total').innerHTML = live.length ? `${live.length} line(s) · ${fmtINR(live.reduce((s, r) => s + rowAmount(r), 0))} − loan ${fmtINR(live.reduce((s, r) => s + rowDeduction(r), 0))} = <b>${fmtINR(live.reduce((s, r) => s + rowAmount(r) - rowDeduction(r), 0))}</b> net` : '';
        state.dirty = live.length > 0;
      };
      const updateNet = (r) => {
        const el = elOf(r);
        const loanIn = el.querySelector('[data-k="loan"]');
        if (loanIn && r.full) loanIn.value = String(rowDeduction(r));
        if (loanIn) loanIn.classList.toggle('need', !r.full && !r.loan);
        el.querySelector('[data-net]').textContent = fmtINR(rowAmount(r) - rowDeduction(r));
        total();
      };
      const redraw = (r) => { elOf(r).outerHTML = lineHTML(r); total(); };
      $('#add-line').addEventListener('click', () => { const r = blank(); rows.push(r); body.insertAdjacentHTML('beforeend', lineHTML(r)); });
      // Bulk populate: one line per eligible employee (all, or the ticked ones), current salary as the amount.
      // Loan deductions are left blank — they are filled in by hand.
      $('#bulk-btn').addEventListener('click', () => {
        const dlg = openModal({
          title: 'Bulk populate', size: 'md', subtitle: 'Adds a line for each employee with their current salary as the amount. Loan deductions are left blank to fill in by hand.',
          body: `<div class="grid" style="gap:14px">
              <div class="bk-top">
                <div class="field"><label>Description<span class="req">*</span></label><input class="input" id="bk-desc" placeholder="e.g. Diwali bonus 2026"></div>
                <div class="field"><label>Date</label><input class="input" type="date" id="bk-date" value="${todayISO()}"><div class="hint" id="bk-dmy">${fmtDMY(todayISO())}</div></div>
              </div>
              <div class="bk-mode">
                <label class="check-inline"><input type="radio" name="bk-mode" value="all" checked> <b>Give all</b> <span class="muted">— everyone eligible (${emps.length})</span></label>
                <label class="check-inline"><input type="radio" name="bk-mode" value="pick"> <b>Select from the list</b> <span class="muted">— all ticked; untick who should not get it</span></label>
              </div>
              <div id="bk-list" class="elig-list hidden">${emps.map((e) => { const sal = currentSalary(e.id); const loan = empLoanLeft(e.id); return `<label class="elig-row">
                  <input type="checkbox" value="${e.id}" checked>${person(e, esc(e.employee_code || 'No Employee ID'))}
                  <span style="margin-left:auto;text-align:right;font-size:12.5px">${sal == null ? '<span class="error-text">No salary in EMD</span>' : `<b style="color:var(--text)">${fmtINR(sal)}</b>`}${loan > 0 ? `<div class="faint">Loan ${fmtINR(loan)}</div>` : ''}</span></label>`; }).join('')}</div>
              <div class="muted" id="bk-count" style="font-size:12.5px"></div></div>`,
          footer: `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-ok>${icon('check', 'sm')}Populate</button>`,
        });
        const el = dlg.el;
        const mode = () => $('input[name="bk-mode"]:checked', el).value;
        const chosen = () => (mode() === 'all' ? emps : emps.filter((e) => $(`#bk-list input[value="${e.id}"]`, el).checked));
        const count = () => {
          const list = chosen();
          const withLoan = list.filter((e) => empLoanLeft(e.id) > 0).length;
          $('#bk-count', el).innerHTML = `${list.length} employee(s) · ${fmtINR(list.reduce((t, e) => t + (currentSalary(e.id) || 0), 0))} total at current salary${withLoan ? ` · ${withLoan} with a loan — fill their loan deduction by hand` : ''}`;
        };
        $$('input[name="bk-mode"]', el).forEach((x) => x.addEventListener('change', () => { $('#bk-list', el).classList.toggle('hidden', mode() !== 'pick'); count(); }));
        $('#bk-list', el).addEventListener('change', count);
        $('#bk-date', el).addEventListener('change', (ev) => { $('#bk-dmy', el).textContent = ev.target.value ? fmtDMY(ev.target.value) : ''; });
        count();
        $('[data-ok]', el).addEventListener('click', () => {
          const desc = $('#bk-desc', el).value.trim(), date = $('#bk-date', el).value;
          const list = chosen();
          if (!desc) return toast('Write what this is for in the description.', 'error');
          if (!date) return toast('Pick the date.', 'error');
          if (!list.length) return toast('Tick at least one employee.', 'error');
          for (let i = rows.length - 1; i >= 0; i--) if (!touched(rows[i])) rows.splice(i, 1); // drop empty lines
          for (const e of list) rows.push({ ...blank(), employee_id: e.id, description: desc, pay_date: date, use_current_salary: currentSalary(e.id) != null });
          body.innerHTML = rows.map(lineHTML).join('');
          total();
          dlg.close();
          const noSal = list.filter((e) => currentSalary(e.id) == null).length;
          toast(`${list.length} line(s) populated.${noSal ? ` ${noSal} have no salary in EMD — enter their amount.` : ''} Fill the loan deductions, then Save payments.`);
        });
      });
      body.addEventListener('input', (ev) => {
        const k = ev.target.dataset.k;
        if (!['description', 'amount', 'loan'].includes(k)) return;
        const r = rowOf(ev.target);
        r[k] = k === 'description' ? ev.target.value : ev.target.value.replace(/[^\d.]/g, '');
        updateNet(r);
      });
      body.addEventListener('change', (ev) => {
        const t = ev.target, k = t.dataset.k;
        if (!t.closest('.bn-row')) return;
        const r = rowOf(t);
        if (k === 'employee_id') { r.employee_id = t.value; r.loan = ''; r.full = false; redraw(r); }
        else if (k === 'use_current_salary') { r.use_current_salary = t.checked; redraw(r); }
        else if (k === 'full') { r.full = t.checked; redraw(r); }
        else if (k === 'pay_date') { r.pay_date = t.value; t.closest('.bn-cell').querySelector('.bn-sub').textContent = t.value ? fmtSlash(t.value) : ''; }
      });
      body.addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-del]');
        if (!b) return;
        const r = rowOf(b);
        rows.splice(rows.indexOf(r), 1);
        b.closest('.bn-row').remove();
        if (!rows.length) { const n = blank(); rows.push(n); body.insertAdjacentHTML('beforeend', lineHTML(n)); }
        total();
      });
      $('#save-btn').addEventListener('click', async (ev) => {
        const btn = ev.currentTarget;
        const live = rows.filter(touched);
        if (!live.length) return toast('Fill in at least one line.', 'error');
        for (const r of live) {
          if (!r.employee_id) return toast('Pick the employee on every line.', 'error');
          if (!r.description.trim()) return toast('Enter a description on every line.', 'error');
          if (!r.pay_date) return toast('Pick the date on every line.', 'error');
          if (r.use_current_salary && currentSalary(r.employee_id) == null) return toast(`${byId(r.employee_id)?.full_name} has no salary in Employee Master Data — untick “Current salary” or add one.`, 'error');
          if (!(rowAmount(r) > 0)) return toast('Enter an amount on every line.', 'error');
          if (!r.full && rowDeduction(r) > rowAmount(r)) return toast('A loan deduction is more than the amount.', 'error');
          if (!r.full && rowDeduction(r) > room(r)) return toast(`The loan deduction for ${byId(r.employee_id).full_name} is more than the loan remaining (${fmtINR(room(r))}).`, 'error');
        }
        const items = live.map((r) => ({ employee_id: r.employee_id, description: r.description.trim(), pay_date: r.pay_date, amount: rowAmount(r),
          use_current_salary: r.use_current_salary, loan_deduction: r.full ? 0 : rowDeduction(r), deduct_full: r.full && room(r) > 0 }));
        try {
          await withBusy(btn, 'Saving…', () => api.rpc('admin_add_bonus_payments', { p_items: items }));
          state.dirty = false;
          toast(`${items.length} payment(s) saved to the log.`);
          await ensureFinance(true);
          render();
        } catch (err) { toast(friendlyError(err), 'error'); }
      });
    },
  };
}

async function pageBonusEmployee(id) {
  const e = byId(id);
  const back = `<a class="btn btn-sm" href="#/bonus">${icon('arrowLeft', 'sm')}Back to Bonus & Leave Encash</a>`;
  if (!e) return { title: 'Bonus & Leave Encash', crumbs: '<a href="#/bonus">Bonus & Leave Encash</a>', actions: back, html: `<div class="card">${emptyState('user', 'Employee not found', '')}</div>` };
  const lines = state.fin.bonus.filter((b) => b.employee_id === id);
  return {
    title: e.full_name, crumbs: '<a href="#/bonus">Bonus & Leave Encash</a> &nbsp;/&nbsp; Details', actions: back,
    html: `
      <div class="card emp-head">${avatar(e, 'lg')}
        <div style="min-width:0"><h2>${esc(e.full_name)}</h2><div class="meta">${empChip(e)}<span>${esc(e.employee_code || 'No Employee ID')}</span></div></div>
        <div class="facts"><div><div class="k">Total paid</div><div class="v">${fmtINR(lines.reduce((s, b) => s + Number(b.amount), 0))}</div></div>
          <div><div class="k">Loan deducted</div><div class="v">${fmtINR(lines.reduce((s, b) => s + Number(b.loan_deduction), 0))}</div></div>
          <div><div class="k">Loan remaining</div><div class="v">${fmtINR(empLoanLeft(id))}</div></div></div>
      </div>
      <div class="card"><div class="card-head"><div><h3>Payments log</h3><p>One line per payment</p></div><div class="right"><span class="chip plain gray">${lines.length}</span></div></div>
        ${bonusLedgerHTML(lines)}</div>`,
  };
}

/* ---------- Loans ---------- */
async function pageLoans(r) {
  await ensureFinance();
  if (r.id) return pageLoanDetail(r.id);
  const emps = activeEmployees();
  const loans = [...state.fin.loans].sort((a, b) => b.taken_on.localeCompare(a.taken_on));
  const outstanding = loans.reduce((s, l) => s + loanLeft(l), 0);
  return {
    title: 'Loans', crumbs: 'Loans taken by employees',
    html: `
      <form class="card" id="loan-form" novalidate>
        <div class="card-head"><div><h3>Add a loan</h3><p>Pick the employee; the Emp ID is filled in from Employee Master Data</p></div></div>
        <div class="card-body grid g4" style="align-items:end">
          <div class="field"><label>Name<span class="req">*</span></label><select class="input" name="employee"><option value="">Select employee</option>${emps.map((e) => `<option value="${e.id}">${esc(e.full_name)}</option>`).join('')}</select></div>
          <div class="field"><label>Emp ID</label><div class="locked" id="loan-eid"><span>—</span>${icon('lock')}</div></div>
          <div class="field"><label>Amount taken<span class="req">*</span></label><div class="rs-in"><span>₹</span><input class="input mono" name="amount" inputmode="decimal" placeholder="e.g. 200000"></div></div>
          <div class="field"><label>Date (day · month · year)<span class="req">*</span></label><input class="input" type="date" name="taken_on" value="${todayISO()}" max="${todayISO()}"></div>
          <div class="field span-2"><label>Note <span class="faint">(optional)</span></label><input class="input" name="note" placeholder="e.g. Personal loan, repay from variable"></div>
          <div style="display:flex;justify-content:flex-end" class="span-2"><button class="btn btn-primary" type="submit">${icon('plus', 'sm')}Add</button></div>
        </div>
      </form>
      <div class="card">
        <div class="card-head"><div><h3>Loans</h3><p>${loans.length} loan(s) · ${fmtINR(outstanding)} outstanding</p></div></div>
        ${loans.length ? `<div class="table-wrap"><table class="table compact"><thead><tr><th>Emp ID</th><th>Name</th><th class="num">Amount</th><th>Date</th><th class="num">Loan remaining</th><th></th></tr></thead><tbody id="loan-body">
          ${loans.map((l) => { const e = byId(l.employee_id); const left = loanLeft(l); return `<tr data-href="#/loans/${l.id}">
            <td class="mono">${esc(e?.employee_code || '—')}</td><td>${e ? person(e, empState(e) !== 'active' ? empChip(e) : undefined) : '—'}</td>
            <td class="num">${fmtINR(l.amount)}</td><td class="nowrap">${fmtDMY(l.taken_on)}</td>
            <td class="num"><b style="color:${left > 0 ? 'var(--text)' : 'var(--green)'}">${left > 0 ? fmtINR(left) : 'Repaid'}</b></td>
            <td class="actions"><a class="btn btn-sm" href="#/loans/${l.id}">Details</a></td></tr>`; }).join('')}
        </tbody></table></div>` : emptyState('bank', 'No loans', 'Add a loan above. It is repaid when a loan deduction is set on a Variable or Bonus line.')}
      </div>
      ${monthLogCard('loan', 'loan')}`,
    mount() {
      mountLogMonth();
      const f = $('#loan-form');
      f.elements.employee.addEventListener('change', () => {
        const e = byId(f.elements.employee.value);
        $('#loan-eid').innerHTML = `<span>${esc(e ? e.employee_code || 'No Employee ID in EMD' : '—')}</span>${icon('lock')}`;
      });
      $('#loan-body')?.addEventListener('click', (ev) => { const tr = ev.target.closest('tr[data-href]'); if (tr && !ev.target.closest('a, button')) location.hash = tr.dataset.href; });
      f.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const emp = f.elements.employee.value, amount = num(f.elements.amount.value), on = f.elements.taken_on.value;
        if (!emp) return toast('Pick the employee.', 'error');
        if (!(amount > 0)) return toast('Enter the loan amount.', 'error');
        if (!on) return toast('Enter the date the loan was taken.', 'error');
        try {
          await withBusy($('button[type=submit]', f), 'Adding…', () => api.rpc('admin_add_loan', { p_employee: emp, p_amount: amount, p_taken_on: on, p_note: f.elements.note.value }));
          toast(`Loan of ${fmtINR(amount)} added for ${byId(emp).full_name}.`);
          await ensureFinance(true);
          render();
        } catch (err) { toast(friendlyError(err), 'error'); }
      });
    },
  };
}

async function pageLoanDetail(loanId) {
  const back = `<a class="btn btn-sm" href="#/loans">${icon('arrowLeft', 'sm')}Back to Loans</a>`;
  const l = state.fin.loans.find((x) => x.id === loanId);
  if (!l) return { title: 'Loans', crumbs: '<a href="#/loans">Loans</a>', actions: back, html: `<div class="card">${emptyState('bank', 'Loan not found', 'It may have been removed.')}</div>` };
  const e = byId(l.employee_id);
  const left = loanLeft(l);
  // Every repayment, oldest first: Variable / Bonus deductions and manual repayments
  const events = [
    ...state.fin.loanDeductions.filter((d) => d.loan_id === l.id).map((d) => {
      if (d.source === 'variable') { const v = state.fin.variablePayouts.find((x) => x.id === d.source_id); return { on: String(d.created_at).slice(0, 10), at: d.created_at, from: `Variable${v ? ` · ${fmtMonth(v.pay_month)}` : ''}`, amount: Number(d.amount) }; }
      const b = state.fin.bonus.find((x) => x.id === d.source_id);

/* ---------- Monthly Expense (Google Form responses) ---------- */
const EXPENSE_FIELDS = [
  ['emp_code', 'Employee ID', true, /emp.*(id|code)|employee\s*(id|code)|^e\.?code$|^id$/i],
  ['amount', 'Amount', true, /amount|amt|total|^rs|inr|value/i],
  ['submitted_at', 'Timestamp', false, /timestamp|submitted/i],
  ['emp_name', 'Name', false, /name/i],
  ['expense_date', 'Expense date', false, /date/i],
  ['category', 'Category', false, /category|type|head|nature/i],
  ['description', 'Description', false, /desc|purpose|detail|remark|particular|reason/i],
  ['receipt_url', 'Bill / receipt', false, /bill|receipt|upload|attach|proof|invoice/i],
];
function sheetCsvUrl(url) {
  const u = String(url || '').trim();
  if (!u) throw new Error('Paste the link of the Google Form responses sheet first.');
  if (/forms\.gle|docs\.google\.com\/forms/.test(u)) throw new Error('That is the Form link. Open the form → Responses → “Link to Sheets”, then paste the link of that responses sheet.');
  if (/output=csv|format=csv|tqx=out:csv/.test(u)) return u;
  const pub = u.match(/docs\.google\.com\/spreadsheets\/d\/e\/([\w-]+)/);
  if (pub) return `https://docs.google.com/spreadsheets/d/e/${pub[1]}/pub?output=csv`;
  const id = u.match(/docs\.google\.com\/spreadsheets\/d\/([\w-]+)/);
  if (id) { const gid = (u.match(/[#&?]gid=(\d+)/) || [])[1]; return `https://docs.google.com/spreadsheets/d/${id[1]}/gviz/tq?tqx=out:csv${gid ? `&gid=${gid}` : ''}`; }
  return u;
}
async function fetchExpenseSheet(url) {
  const res = await fetch(sheetCsvUrl(url), { cache: 'no-store' }).catch(() => { throw new Error('Could not read the sheet. Share it as “Anyone with the link – Viewer” (or File → Share → Publish to web → CSV) and try again.'); });
  if (!res.ok) throw new Error(`Google returned ${res.status}. Share the sheet as “Anyone with the link – Viewer” and try again.`);
  const text = await res.text();
  if (/^\s*<(!doctype|html)/i.test(text)) throw new Error('Google returned a sign-in page instead of data. Share the sheet as “Anyone with the link – Viewer”.');
  await loadXLSX();
  const wb = XLSX.read(text, { type: 'string', raw: true });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
  const headers = (rows[0] || []).map((h) => String(h).trim());
  return { headers, rows: rows.slice(1).filter((r) => r.some((c) => String(c).trim() !== '')) };
}
function guessExpenseColumns(headers, saved = {}) {
  const used = new Set();
  const out = {};
  for (const [key, , , re] of EXPENSE_FIELDS) {
    if (saved[key] && headers.includes(saved[key])) { out[key] = saved[key]; used.add(saved[key]); continue; }
    const h = headers.find((x) => !used.has(x) && re.test(x) && !(key === 'expense_date' && /timestamp/i.test(x)) && !(key === 'emp_name' && /emp.*(id|code)/i.test(x)));
    if (h) { out[key] = h; used.add(h); }
  }
  return out;
}
function buildExpenseRows(headers, rows, cols) {
  const idx = Object.fromEntries(Object.entries(cols).filter(([, h]) => h).map(([k, h]) => [k, headers.indexOf(h)]));
  const cell = (r, k) => (idx[k] >= 0 && idx[k] != null ? String(r[idx[k]] ?? '').trim() : '');
  return rows.map((r) => {
    const ts = cell(r, 'submitted_at');
    const tsDate = parseSheetDate(ts);
    const tsTime = (ts.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/) || []);
    return {
      source_key: r.map((c) => String(c ?? '').trim()).join('␟'),
      submitted_at: tsDate ? `${tsDate}T${pad(tsTime[1] || 0)}:${tsTime[2] || '00'}:${tsTime[3] || '00'}+05:30` : null,
      emp_code: cell(r, 'emp_code'), emp_name: cell(r, 'emp_name'),
      expense_date: parseSheetDate(cell(r, 'expense_date')) || null,
      category: cell(r, 'category'), description: cell(r, 'description'),
      amount: cell(r, 'amount') ? num(cell(r, 'amount')) : null, receipt_url: cell(r, 'receipt_url'),
      raw: Object.fromEntries(headers.map((h, i) => [h || `Column ${i + 1}`, String(r[i] ?? '')])),
    };
  }).filter((x) => x.emp_code || x.amount != null);
}

/* ---------- ESOPs ---------- */
/* =====================================================================
   Google Drive storage (through the Apps Script bridge in drive-bridge/Code.gs)
   Files live in the company's Drive; Supabase keeps only the Drive file id.
   KYC paths for Drive files look like "<employee id>/drive/<file id>".
   ===================================================================== */
const isDrivePath = (p) => /^[^/]+\/drive\/[^/]+$/.test(String(p || ''));
const driveIdOf = (p) => String(p).split('/drive/')[1];
async function driveSettings(force = false) {
  if (state.drive && !force) return state.drive;
  const row = await q(db.from('app_settings').select('value').eq('key', 'drive').maybeSingle()).catch(() => null);
  state.drive = { url: String(row?.value?.url || '').trim() };
  return state.drive;
}
const driveOn = async () => !!(await driveSettings()).url;
async function driveCall(action, body = {}) {
  const { url } = await driveSettings();
  if (!url) throw new Error('Google Drive is not connected yet — an admin can set it up in Settings → Storage & documents.');
  const { data } = await db.auth.getSession();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 120000);
  let res;
  try {
    res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ...body, action, token: data?.session?.access_token }), signal: ctrl.signal });
  } catch (e) {
    throw new Error(e?.name === 'AbortError' ? 'Google Drive took too long to answer. Try again.' : 'Could not reach Google Drive. Check the bridge URL in Settings → Storage & documents.');
  } finally { clearTimeout(timer); }
  const j = await res.json().catch(() => null);
  if (!j) throw new Error('Google Drive did not answer properly — check that the bridge is deployed as a web app for “Anyone”.');
  if (!j.ok) throw new Error(j.error || 'Google Drive error');
  return j;
}
const blobToB64 = (blob) => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(String(r.result).split(',')[1] || '');
  r.onerror = () => reject(r.error);
  r.readAsDataURL(blob);
});
function b64ToBlob(b64, mime) {
  const bin = atob(b64); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type: mime || 'application/octet-stream' });
}
function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function driveUpload({ folder, name, blob, owner = '', replace = true }) {
  return driveCall('upload', { folder, name, owner, replace, mime: blob.type || 'application/octet-stream', data: await blobToB64(blob) });
}
async function driveDownload(id) {
  const r = await driveCall('get', { id });
  return { blob: b64ToBlob(r.data, r.mime), name: r.name, url: r.url };
}
// Keeps a copy of an uploaded sheet in Drive (Uploads/<section>/<YYYY-MM>/…). Never blocks the import.
async function archiveUpload(section, file) {
  try {
    if (!(await driveOn())) return;
    const n = new Date();
    await driveCall('upload', { folder: ['Uploads', section, `${n.getFullYear()}-${pad(n.getMonth() + 1)}`],
      name: `${fmtDMY(todayISO())} ${pad(n.getHours())}${pad(n.getMinutes())} - ${file.name}`, replace: false,

const JSPDF_SRC = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
const AUTOTABLE_SRC = 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js';
const scriptLoads = {};
function loadScript(src) {
  if (!scriptLoads[src]) {
    scriptLoads[src] = new Promise((resolve, reject) => {
      const s = document.createElement('script'); s.src = src; s.onload = resolve;
      s.onerror = () => { delete scriptLoads[src]; reject(new Error('Could not load the PDF maker. Check your connection and try again.')); };
      document.head.appendChild(s);
    });
  }
  return scriptLoads[src];
}
async function loadPDF() { await loadScript(JSPDF_SRC); await loadScript(AUTOTABLE_SRC); return window.jspdf.jsPDF; }
const COMPANY_DEFAULT = { name: 'Altius Investech Private Limited', address: '', cin: '', signatory_name: '', signatory_title: 'Director' };
async function companyInfo(force = false) {
  if (state.company && !force) return state.company;
  const row = await q(db.from('app_settings').select('value').eq('key', 'company').maybeSingle()).catch(() => null);
  state.company = { ...COMPANY_DEFAULT, ...(row?.value || {}) };
  return state.company;
}
const rsAmt = (n) => `Rs. ${Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
function inrWords(num) {
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = (x) => (x < 20 ? a[x] : `${b[Math.floor(x / 10)]}${x % 10 ? ` ${a[x % 10]}` : ''}`);
  const three = (x) => (x >= 100 ? `${a[Math.floor(x / 100)]} Hundred${x % 100 ? ` ${two(x % 100)}` : ''}` : two(x));
  const words = (n) => {
    if (n === 0) return '';
    const out = [];
    const cr = Math.floor(n / 1e7); n %= 1e7;
    const lk = Math.floor(n / 1e5); n %= 1e5;
    const th = Math.floor(n / 1e3); n %= 1e3;
    if (cr) out.push(`${words(cr)} Crore`);
    if (lk) out.push(`${two(lk)} Lakh`);
    if (th) out.push(`${two(th)} Thousand`);
    if (n) out.push(three(n));
    return out.join(' ');
  };
  const total = Math.round(Math.abs(Number(num) || 0) * 100);
  const rupees = Math.floor(total / 100), paise = total % 100;
  return `Rupees ${words(rupees) || 'Zero'}${paise ? ` and ${two(paise)} Paise` : ''} Only`;
}
const PDF = { L: 16, W: 178, ink: [17, 24, 39], muted: [107, 114, 128], line: [229, 231, 235] };
function pdfLetterhead(doc, co) {
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(...PDF.ink);
  doc.text(co.name || COMPANY_DEFAULT.name, PDF.L, 18);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...PDF.muted);
  let y = 23;
  for (const line of doc.splitTextToSize([co.address, co.cin ? `CIN: ${co.cin}` : ''].filter(Boolean).join('  ·  '), PDF.W)) { doc.text(line, PDF.L, y); y += 4; }
  doc.setDrawColor(...PDF.line); doc.setLineWidth(0.4); doc.line(PDF.L, y, PDF.L + PDF.W, y);
  doc.setTextColor(...PDF.ink);
  return y + 8;
}
function pdfPara(doc, text, y, { size = 10, bold = false, gap = 2.5, color = PDF.ink } = {}) {
  doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(...color);
  const lines = doc.splitTextToSize(text, PDF.W);
  const lh = size * 0.47;
  if (y + lines.length * lh > 282) { doc.addPage(); y = 20; }
  doc.text(lines, PDF.L, y);
  doc.setTextColor(...PDF.ink);
  return y + lines.length * lh + gap;
}
function pdfFooter(doc, text) {
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...PDF.muted);
    doc.text(`${text}${n > 1 ? `  ·  Page ${i} of ${n}` : ''}`, PDF.L, 290);
  }
  doc.setTextColor(...PDF.ink);
}
const pdfTable = (doc, y, opts) => {
  doc.autoTable({ startY: y, margin: { left: PDF.L, right: PDF.L }, theme: 'grid',
    styles: { fontSize: 9, cellPadding: 2.2, textColor: PDF.ink, lineColor: PDF.line, lineWidth: 0.2 },
    headStyles: { fillColor: [243, 244, 246], textColor: PDF.ink, fontStyle: 'bold' }, ...opts });
  return doc.lastAutoTable.finalY + 6;
};
const monthName = (iso) => parseISODate(iso).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
